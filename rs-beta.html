                  <div className="detail-row"><span className="detail-key">Type</span><span className="detail-val">{t.treatment_type || '—'}</span></div>
                  <div className="detail-row"><span className="detail-key">Lot #</span><span className="detail-val">{t.lot_number || '—'}</span></div>
                  <div className="detail-row"><span className="detail-key">Dosage</span><span className="detail-val">{t.dosage || '—'}</span></div>
                  <div className="detail-row"><span className="detail-key">Reason</span><span className="detail-val">{t.reason || '—'}</span></div>
                  <div className="detail-row"><span className="detail-key">Administered By</span><span className="detail-val">{t.administered_by || '—'}</span></div>
                  <div className="detail-row"><span className="detail-key">Withdrawal</span><span className="detail-val">{formatDate(t.withdrawal_date)}</span></div>
                </div>
              ))}
            </div>
          )}
        </div>

        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Close</button>
          {tab === 'details' && (editing
            ? <><button className="btn btn-ghost" onClick={() => setEditing(false)}>Cancel</button><button className="btn btn-primary" onClick={handleSave}>Save Changes</button></>
            : <button className="btn btn-secondary" onClick={() => setEditing(true)}>Edit Animal</button>
          )}
        </div>
      </div>

      {/* ── DELETE CONFIRMATION MODAL ── */}
      {deletingCalvingId && (
        <div className="modal-overlay" style={{zIndex:300}}>
          <div className="modal" style={{maxWidth:'400px'}}>
            <div className="modal-header">
              <h2 className="modal-title">Delete Calving Record?</h2>
              <button className="modal-close" onClick={() => setDeletingCalvingId(null)}>✕</button>
            </div>
            <div className="modal-body">
              <p style={{color:'var(--ash)', fontSize:'14px', lineHeight:'1.6'}}>
                This will permanently delete this calving record. This action <strong style={{color:'#e05555'}}>cannot be undone</strong>.
              </p>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setDeletingCalvingId(null)}>Cancel</button>
              <button className="btn btn-danger" onClick={executeDeleteCalving}>Delete Record</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function CalvingGapPage({ toast }) {
  const today = new Date();
  const oneYearAgo = new Date(today); oneYearAgo.setFullYear(today.getFullYear() - 1);
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  const [herds, setHerds] = useState([]);
  const [herdFilter, setHerdFilter] = useState('');
  const [mode, setMode] = useState('no_record_in_range');
  const [rangeStart, setRangeStart] = useState(fmt(oneYearAgo));
  const [rangeEnd, setRangeEnd] = useState(fmt(today));
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);
  const [sortCol, setSortCol] = useState('days_since');
  const [sortDir, setSortDir] = useState('desc');

  useEffect(() => {
    supabase.from('herds').select('*').order('name').then(({ data }) => setHerds(data || []));
  }, []);

  const runFilter = async () => {
    if (!rangeStart || !rangeEnd) { toast('Please pick a date range', 'error'); return; }
    setLoading(true);

    // 1. Fetch active cows/heifers
    let q = supabase.from('animals')
      .select('id, vid, sex, herd_id, breeding_status, herds(name)')
      .in('sex', ['cow', 'heifer'])
      .eq('status', 'active')
      .order('vid')
      .limit(10000);
    if (herdFilter) q = q.eq('herd_id', herdFilter);
    const { data: cows, error } = await q;
    if (error) { toast('Error loading animals: ' + error.message, 'error'); setLoading(false); return; }
    if (!cows || cows.length === 0) { setResults([]); setLoading(false); return; }

    // 2. Fetch all calving records for those cows
    const cowIds = cows.map(c => c.id);
    // Chunked: a single .in() with 800+ UUIDs exceeds URL length limits and fails silently
    const { data: calvings, error: calvErr } = await chunkedIn(cowIds, (chunk) => supabase
      .from('calving_records')
      .select('dam_id, calving_date')
      .in('dam_id', chunk)
      .order('calving_date', { ascending: false })
      .limit(10000));
    if (calvErr) { toast('Error loading calving records: ' + calvErr.message, 'error'); setLoading(false); return; }

    // 3. Build map: dam_id -> all calving dates (most recent first)
    const calvingMap = {};
    (calvings || []).forEach(r => {
      if (!calvingMap[r.dam_id]) calvingMap[r.dam_id] = [];
      calvingMap[r.dam_id].push(r.calving_date);
    });

    // 4. Apply mode filter
    let filtered;
    if (mode === 'no_record_in_range') {
      // Cows with NO calving record dated within [rangeStart, rangeEnd]
      const inRange = new Set(
        (calvings || []).filter(r => r.calving_date >= rangeStart && r.calving_date <= rangeEnd).map(r => r.dam_id)
      );
      filtered = cows.filter(c => !inRange.has(c.id));
    } else {
      // 'last_before_start': most recent calving is before rangeStart, OR never calved
      filtered = cows.filter(c => {
        const mostRecent = calvingMap[c.id]?.[0];
        if (!mostRecent) return true; // never calved
        return mostRecent < rangeStart;
      });
    }

    // 5. Annotate
    const todayMs = Date.now();
    const annotated = filtered.map(c => {
      const mostRecent = calvingMap[c.id]?.[0] || null;
      const daysSince = mostRecent ? Math.floor((todayMs - new Date(mostRecent).getTime()) / 86400000) : null;
      return { ...c, lastCalvingDate: mostRecent, totalCalvings: calvingMap[c.id]?.length || 0, daysSince };
    });

    setResults(annotated);
    setLoading(false);
    toast(`Found ${annotated.length} cow${annotated.length !== 1 ? 's' : ''}`, 'success');
  };

  const sortedResults = useMemo(() => {
    if (!results) return [];
    return [...results].sort((a, b) => {
      let av, bv;
      if (sortCol === 'vid') { av = a.vid || ''; bv = b.vid || ''; }
      else if (sortCol === 'herd') { av = a.herds?.name || ''; bv = b.herds?.name || ''; }
      else if (sortCol === 'last_calving') { av = a.lastCalvingDate || ''; bv = b.lastCalvingDate || ''; }
      else if (sortCol === 'days_since') { av = a.daysSince ?? 99999; bv = b.daysSince ?? 99999; }
      else if (sortCol === 'total') { av = a.totalCalvings; bv = b.totalCalvings; }
      else if (sortCol === 'breeding') { av = a.breeding_status || ''; bv = b.breeding_status || ''; }
      else { av = ''; bv = ''; }
      if (typeof av === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
  }, [results, sortCol, sortDir]);

  const handleSort = (col) => { if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc'); else { setSortCol(col); setSortDir(col === 'days_since' ? 'desc' : 'asc'); } };
  const SortTh = ({ col, label }) => (
    <th onClick={() => handleSort(col)} style={{cursor:'pointer', userSelect:'none'}}>
      {label} {sortCol === col && (sortDir === 'asc' ? '↑' : '↓')}
    </th>
  );

  const gapClass = (days) => {
    if (days === null) return 'gap-never';
    if (days > 730) return 'gap-critical';
    if (days > 400) return 'gap-warn';
    return 'gap-ok';
  };
  const gapLabel = (days) => {
    if (days === null) return 'Never';
    if (days > 730) return `${days}d ⚠`;
    return `${days}d`;
  };

  const stats = useMemo(() => {
    if (!results) return null;
    return {
      never: results.filter(c => !c.lastCalvingDate).length,
      over2yr: results.filter(c => c.daysSince !== null && c.daysSince > 730).length,
      oneToTwo: results.filter(c => c.daysSince !== null && c.daysSince >= 365 && c.daysSince <= 730).length,
    };
  }, [results]);

  const exportCSV = () => {
    if (!sortedResults.length) return;
    const rows = [
      ['VID','Sex','Herd','Breeding Status','Last Calving Date','Days Since Last Calving','Total Calvings'].join(','),
      ...sortedResults.map(c => [
        c.vid||'', sexLabel(c.sex), c.herds?.name||'',
        c.breeding_status?.replace('_',' ')||'',
        c.lastCalvingDate||'Never',
        c.daysSince !== null ? c.daysSince : '',
        c.totalCalvings,
      ].map(v => `"${v}"`).join(','))
    ].join('\n');
    const blob = new Blob([rows], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `calving_gap_${rangeStart}_to_${rangeEnd}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast(`Exported ${sortedResults.length} records`, 'success');
  };

  return (
    <div>
      {/* Config Panel */}
      <div className="detail-card" style={{marginBottom:'24px', maxWidth:'760px'}}>
        <h3 style={{marginBottom:'6px'}}>Find Cows That Haven't Calved</h3>
        <p style={{color:'var(--ash)', fontSize:'13px', marginBottom:'20px', fontFamily:'Source Sans 3, sans-serif', fontWeight:'normal', letterSpacing:'0'}}>
          Searches active cows and heifers. Two modes are available — pick the one that fits your question.
        </p>

        {/* Mode selector */}
        <div style={{marginBottom:'20px'}}>
          <div className="form-label" style={{marginBottom:'10px', display:'block'}}>FILTER MODE</div>
          <div style={{display:'flex', flexDirection:'column', gap:'12px'}}>
            <label style={{display:'flex', alignItems:'flex-start', gap:'12px', cursor:'pointer', padding:'12px 14px', borderRadius:'5px', border: mode==='no_record_in_range' ? '1px solid var(--rust)' : '1px solid rgba(58,125,123,0.25)', background: mode==='no_record_in_range' ? 'rgba(42,157,143,0.08)' : 'transparent', transition:'all 0.15s'}}>
              <input type="radio" name="gapMode" value="no_record_in_range" checked={mode==='no_record_in_range'} onChange={() => setMode('no_record_in_range')} style={{marginTop:'2px', accentColor:'var(--rust)', flexShrink:0}} />
              <div>
                <div style={{color:'var(--cream)', fontSize:'14px', fontWeight:'600', marginBottom:'2px'}}>No record within date range</div>
                <div style={{color:'var(--ash)', fontSize:'12px', lineHeight:'1.5'}}>Shows cows with zero calving records dated between the Start and End dates. Good for checking a specific calving season (e.g. Jan 1 – Jun 30).</div>
              </div>
            </label>
            <label style={{display:'flex', alignItems:'flex-start', gap:'12px', cursor:'pointer', padding:'12px 14px', borderRadius:'5px', border: mode==='last_before_start' ? '1px solid var(--rust)' : '1px solid rgba(58,125,123,0.25)', background: mode==='last_before_start' ? 'rgba(42,157,143,0.08)' : 'transparent', transition:'all 0.15s'}}>
              <input type="radio" name="gapMode" value="last_before_start" checked={mode==='last_before_start'} onChange={() => setMode('last_before_start')} style={{marginTop:'2px', accentColor:'var(--rust)', flexShrink:0}} />
              <div>
                <div style={{color:'var(--cream)', fontSize:'14px', fontWeight:'600', marginBottom:'2px'}}>Last calving was before start date (or never calved)</div>
                <div style={{color:'var(--ash)', fontSize:'12px', lineHeight:'1.5'}}>Shows cows whose most recent calving is older than the Start date. Good for finding open cows overall — set Start Date to 1–2 years ago.</div>
              </div>
            </label>
          </div>
        </div>

        {/* Date range + herd */}
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'12px', marginBottom:'16px'}}>
          <div className="form-group">
            <label className="form-label">Start Date</label>
            <input type="date" className="form-input" value={rangeStart} onChange={e => setRangeStart(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">End Date</label>
            <input type="date" className="form-input" value={rangeEnd} onChange={e => setRangeEnd(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">Herd (optional)</label>
            <select className="form-select" value={herdFilter} onChange={e => setHerdFilter(e.target.value)}>
              <option value="">All Herds</option>
              {herds.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
          </div>
        </div>

        <button className="btn btn-primary" onClick={runFilter} disabled={loading} style={{width:'100%', padding:'11px', fontSize:'14px'}}>
          {loading ? 'Searching…' : '🔍  Find Cows'}
        </button>
      </div>

      {/* Results */}
      {results !== null && (
        <div>
          {/* Summary */}
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', flexWrap:'wrap', gap:'10px'}}>
            <div>
              <span style={{fontFamily:'Playfair Display, serif', fontSize:'22px', color:'var(--cream)', marginRight:'10px'}}>
                {results.length} cow{results.length !== 1 ? 's' : ''} found
              </span>
              <span style={{color:'var(--ash)', fontSize:'13px'}}>
                {mode === 'no_record_in_range'
                  ? `no calving between ${formatDate(rangeStart)} – ${formatDate(rangeEnd)}`
                  : `last calved before ${formatDate(rangeStart)}, or never calved`}
              </span>
            </div>
            {results.length > 0 && (
              <button className="btn btn-secondary" onClick={exportCSV}>⤓ Export CSV</button>
            )}
          </div>

          {/* Stat chips */}
          {stats && results.length > 0 && (
            <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:'12px', marginBottom:'20px'}}>
              <div className="stat-card">
                <div className="stat-label">Never Calved</div>
                <div className="stat-value" style={{color:'#e05555', fontSize:'28px'}}>{stats.never}</div>
                <div className="stat-sub">no records at all</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Gap 1–2 Years</div>
                <div className="stat-value" style={{color:'var(--hay)', fontSize:'28px'}}>{stats.oneToTwo}</div>
                <div className="stat-sub">365–730 days since last</div>
              </div>
              <div className="stat-card">
                <div className="stat-label">Gap 2+ Years</div>
                <div className="stat-value" style={{color:'var(--rust)', fontSize:'28px'}}>{stats.over2yr}</div>
                <div className="stat-sub">over 730 days since last</div>
              </div>
            </div>
          )}

          {results.length === 0 ? (
            <div className="empty-state">
              <h3>No cows match this filter</h3>
              <p>All active cows and heifers have calving records that meet the selected criteria.</p>
            </div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <SortTh col="vid" label="VID" />
                    <th>Sex</th>
                    <SortTh col="herd" label="Herd" />
                    <SortTh col="breeding" label="Breeding Status" />
                    <SortTh col="last_calving" label="Last Calving" />
                    <SortTh col="days_since" label="Days Since" />
                    <SortTh col="total" label="Total Calvings" />
                  </tr>
                </thead>
                <tbody>
                  {sortedResults.map(c => (
                    <tr key={c.id} style={{cursor:'default'}}>
                      <td className="td-mono">{c.vid || '—'}</td>
                      <td><span className={`badge badge-${c.sex}`}>{sexLabel(c.sex)}</span></td>
                      <td>{c.herds?.name || '—'}</td>
                      <td style={{fontSize:'12px', color:'var(--sage)'}}>{c.breeding_status?.replace('_',' ') || '—'}</td>
                      <td style={{fontSize:'13px', color: c.lastCalvingDate ? 'var(--ash)' : '#e05555'}}>
                        {c.lastCalvingDate ? formatDate(c.lastCalvingDate) : '— never calved —'}
                      </td>
                      <td>
                        <span className={`gap-tag ${gapClass(c.daysSince)}`}>{gapLabel(c.daysSince)}</span>
                      </td>
                      <td style={{fontFamily:'IBM Plex Mono, monospace', color:'var(--hay)', textAlign:'center'}}>{c.totalCalvings}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="pagination">
                <span className="pagination-info">
                  {sortedResults.length} cows · Days color: &nbsp;
                  <span className="gap-tag gap-ok" style={{marginRight:'6px'}}>under 400d</span>
                  <span className="gap-tag gap-warn" style={{marginRight:'6px'}}>400–730d</span>
                  <span className="gap-tag gap-critical" style={{marginRight:'6px'}}>730d+ ⚠</span>
                  <span className="gap-tag gap-never">Never</span>
                </span>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ===== HERDS PAGE =====
function HerdsPage({ toast, navigateToAnimals }) {
  const [herds, setHerds] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [editingHerd, setEditingHerd] = useState(null);
  const [newHerd, setNewHerd] = useState({ name: '', notes: '', enterprise: '', default_au: '', starting_weight: '', weight_date: '', adg: '' });
  const [form, setForm] = useState({ name: '', notes: '', enterprise: '', default_au: '', starting_weight: '', weight_date: '', adg: '' });

  const fetchHerds = async () => {
    setLoading(true);
    const { data, error } = await supabase.from('herds').select('*').order('name');
    if (error) toast('Error: ' + error.message, 'error');
    else setHerds(data || []);
    setLoading(false);
  };

  // Enterprise tags (editable list in the `enterprises` table; names should match Ambrook)
  const [enterprises, setEnterprises] = useState([]);
  const [showEnt, setShowEnt] = useState(false);
  const [newEnt, setNewEnt] = useState('');
  const [entEdits, setEntEdits] = useState({});
  const fetchEnterprises = async () => {
    const { data, error } = await supabase.from('enterprises').select('*').order('name');
    if (error) toast('Error loading enterprises: ' + error.message, 'error');
    else setEnterprises(data || []);
  };
  const activeEntNames = enterprises.filter(e => e.is_active).map(e => e.name);
  const entUseCount = (name) => herds.filter(h => h.enterprise === name).length;

  const addEnterprise = async () => {
    const name = newEnt.trim();
    if (!name) return;
    if (enterprises.some(e => e.name.toLowerCase() === name.toLowerCase())) { toast('That enterprise already exists', 'error'); return; }
    const { error } = await supabase.from('enterprises').insert({ name });
    if (error) toast('Error: ' + error.message, 'error');
    else { setNewEnt(''); fetchEnterprises(); toast('Enterprise added', 'success'); }
  };

  const renameEnterprise = async (ent) => {
    const name = (entEdits[ent.id] ?? ent.name).trim();
    if (!name || name === ent.name) return;
    if (enterprises.some(e => e.id !== ent.id && e.name.toLowerCase() === name.toLowerCase())) { toast('That name is already used', 'error'); return; }
    const { error } = await supabase.from('enterprises').update({ name }).eq('id', ent.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    // carry the rename through to every herd tagged with the old name
    const { error: hErr } = await supabase.from('herds').update({ enterprise: name }).eq('enterprise', ent.name);
    if (hErr) toast('Enterprise renamed, but herds were not updated: ' + hErr.message, 'error');
    else toast(`Renamed to "${name}"`, 'success');
    setEntEdits(x => { const y = {...x}; delete y[ent.id]; return y; });
    fetchEnterprises(); fetchHerds();
  };

  const toggleEnterprise = async (ent) => {
    const { error } = await supabase.from('enterprises').update({ is_active: !ent.is_active }).eq('id', ent.id);
    if (error) toast('Error: ' + error.message, 'error'); else fetchEnterprises();
  };

  const deleteEnterprise = async (ent) => {
    const n = entUseCount(ent.name);
    if (n > 0) { toast(`${n} herd(s) still use "${ent.name}" — retag them or archive the enterprise instead`, 'error'); return; }
    if (!confirm(`Delete enterprise "${ent.name}"?`)) return;
    const { error } = await supabase.from('enterprises').delete().eq('id', ent.id);
    if (error) toast('Error: ' + error.message, 'error'); else fetchEnterprises();
  };

  useEffect(() => { fetchHerds(); fetchEnterprises(); }, []);

  const [herdCounts, setHerdCounts] = useState({});
  useEffect(() => {
    const fetchCounts = async () => {
      const { data } = await supabase.from('animals').select('herd_id').eq('status', 'active').limit(10000);
      if (data) { const counts = {}; data.forEach(a => { if (a.herd_id) counts[a.herd_id] = (counts[a.herd_id] || 0) + 1; }); setHerdCounts(counts); }
    };
    fetchCounts();
  }, [herds]);

  const addHerd = async () => {
    if (!newHerd.name) { toast('Herd name is required', 'error'); return; }
    const payload = {
      name: newHerd.name,
      notes: newHerd.notes || null,
      enterprise: newHerd.enterprise || null,
      default_au: newHerd.default_au ? parseFloat(newHerd.default_au) : null,
      starting_weight: newHerd.starting_weight ? parseFloat(newHerd.starting_weight) : null,
      weight_date: newHerd.weight_date || null,
      adg: newHerd.adg ? parseFloat(newHerd.adg) : null
    };
    const { error } = await supabase.from('herds').insert(payload);
    if (error) toast('Error: ' + error.message, 'error');
    else { setShowAdd(false); setNewHerd({ name: '', notes: '', enterprise: '', default_au: '', starting_weight: '', weight_date: '', adg: '' }); fetchHerds(); toast('Herd created!', 'success'); }
  };

  const saveEdit = async () => {
    if (!form.name) { toast('Herd name is required', 'error'); return; }
    const payload = {
      name: form.name,
      notes: form.notes || null,
      enterprise: form.enterprise || null,
      default_au: form.default_au ? parseFloat(form.default_au) : null,
      starting_weight: form.starting_weight ? parseFloat(form.starting_weight) : null,
      weight_date: form.weight_date || null,
      adg: form.adg ? parseFloat(form.adg) : null
    };
    const { error } = await supabase.from('herds').update(payload).eq('id', editingHerd.id);
    if (error) toast('Error: ' + error.message, 'error');
    else { setEditingHerd(null); fetchHerds(); toast('Herd updated!', 'success'); }
  };

  const toggleActive = async (h) => {
    if (h.is_active && !confirm(`Archive "${h.name}"? It will disappear from Field Entry and Grazing Plan herd pickers until unarchived.`)) return;
    const { error } = await supabase.from('herds').update({ is_active: !h.is_active }).eq('id', h.id);
    if (error) toast('Error: ' + error.message, 'error');
    else { fetchHerds(); toast(h.is_active ? 'Herd archived' : 'Herd unarchived', 'success'); }
  };

  const calculateCurrentAU = (herd) => {
    if (!herd.adg || !herd.starting_weight || !herd.weight_date) {
      return herd.default_au || null;
    }
    const daysSince = Math.floor((new Date() - new Date(herd.weight_date)) / (1000 * 60 * 60 * 24));
    const currentWeight = parseFloat(herd.starting_weight) + (daysSince * parseFloat(herd.adg));
    return (currentWeight / 1000).toFixed(2);
  };

  return (
    <div>
      <div style={{display:'flex', justifyContent:'flex-end', marginBottom:'20px'}}>
        <button className="btn btn-secondary" style={{marginRight:'8px'}} onClick={() => setShowEnt(true)}>Manage Enterprises</button>
        <button className="btn btn-primary" onClick={() => setShowAdd(true)}>+ Add Herd</button>
      </div>
      {loading ? <div className="loading"><div className="spinner"></div> Loading...</div> : (
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(300px, 1fr))', gap:'16px'}}>
          {herds.map(h => (
            <div key={h.id} className="detail-card">
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'12px'}}>
                <h3 style={{fontFamily:'Playfair Display, serif', fontSize:'18px', color:'var(--cream)', fontWeight:'700', margin:0}}>{h.name}</h3>
                <span style={{fontFamily:'IBM Plex Mono', fontSize:'24px', color:'var(--hay)', fontWeight:'700'}}>{herdCounts[h.id] || 0}</span>
              </div>
              <div style={{color:'var(--ash)', fontSize:'12px', fontFamily:'IBM Plex Mono', marginBottom:'8px'}}>HEAD ACTIVE</div>
              <div style={{fontSize:'11px', fontFamily:'IBM Plex Mono', marginBottom:'8px', color: h.enterprise ? 'var(--sage)' : '#e8836a'}}>
                ENTERPRISE: {h.enterprise || 'NOT TAGGED'}
              </div>

              {calculateCurrentAU(h) && (
                <div style={{background:'rgba(58,125,123,0.2)', padding:'8px', borderRadius:'4px', marginBottom:'8px'}}>
                  <div style={{fontFamily:'IBM Plex Mono', fontSize:'11px', color:'var(--ash)', marginBottom:'4px'}}>ANIMAL UNIT</div>
                  <div style={{fontFamily:'IBM Plex Mono', fontSize:'16px', color:'var(--hay)', fontWeight:'600'}}>
                    {calculateCurrentAU(h)} AU/head
                  </div>
                  {h.adg && h.starting_weight && (
                    <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px', fontFamily:'IBM Plex Mono'}}>
                      ADG: {h.adg} lbs/day
                    </div>
                  )}
                </div>
              )}

              {h.notes && <p style={{marginTop:'10px', color:'var(--ash)', fontSize:'13px'}}>{h.notes}</p>}

              <div style={{display:'flex', gap:'8px', marginTop:'12px'}}>
                <button className="btn btn-secondary" style={{flex:1, padding:'6px', fontSize:'12px'}} onClick={() => { setForm(h); setEditingHerd(h); }}>
                  Edit
                </button>
                <button className="btn btn-ghost" style={{flex:1, padding:'6px', fontSize:'12px'}} onClick={() => navigateToAnimals(h.id)}>
                  View Animals
                </button>
                <button className="btn btn-ghost" style={{flex:1, padding:'6px', fontSize:'12px'}} onClick={() => toggleActive(h)}>
                  {h.is_active ? 'Archive' : 'Unarchive'}
                </button>
              </div>

              <div style={{marginTop:'12px', fontSize:'11px', color:'var(--ash)', fontFamily:'IBM Plex Mono'}}>{h.is_active ? '● ACTIVE' : '○ INACTIVE'}</div>
            </div>
          ))}
        </div>
      )}

      {/* MANAGE ENTERPRISES MODAL */}
      {showEnt && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowEnt(false)}>
          <div className="modal" style={{maxWidth:'560px'}}>
            <div className="modal-header">
              <h2 className="modal-title">Enterprises</h2>
              <button className="modal-close" onClick={() => setShowEnt(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'12px', color:'var(--ash)', marginBottom:'12px'}}>Names should match Ambrook exactly. Renaming here updates every herd tagged with the old name.</div>
              <div style={{display:'flex', gap:'8px', marginBottom:'16px'}}>
                <input className="form-input" style={{flex:1}} placeholder="New enterprise name" value={newEnt} onChange={e => setNewEnt(e.target.value)} onKeyDown={e => e.key === 'Enter' && addEnterprise()} />
                <button className="btn btn-primary" onClick={addEnterprise}>Add</button>
              </div>
              {enterprises.length === 0 && <div style={{color:'var(--ash)', fontSize:'13px'}}>No enterprises yet.</div>}
              {enterprises.map(ent => {
                const val = entEdits[ent.id] ?? ent.name;
                return (
                  <div key={ent.id} style={{display:'flex', gap:'6px', alignItems:'center', marginBottom:'8px', opacity: ent.is_active ? 1 : 0.55}}>
                    <input className="form-input" style={{flex:1}} value={val} onChange={e => setEntEdits(x => ({...x, [ent.id]: e.target.value}))} onKeyDown={e => e.key === 'Enter' && renameEnterprise(ent)} />
                    <span style={{fontFamily:'IBM Plex Mono', fontSize:'11px', color:'var(--ash)', minWidth:'52px', textAlign:'right'}}>{entUseCount(ent.name)} herd{entUseCount(ent.name) === 1 ? '' : 's'}</span>
                    {val.trim() !== ent.name && <button className="btn btn-primary" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => renameEnterprise(ent)}>Save</button>}
                    <button className="btn btn-ghost" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => toggleEnterprise(ent)}>{ent.is_active ? 'Archive' : 'Restore'}</button>
                    <button className="btn btn-ghost" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => deleteEnterprise(ent)}>✕</button>
                  </div>
                );
              })}
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setShowEnt(false)}>Done</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD HERD MODAL */}
      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal" style={{maxWidth:'500px'}}>
            <div className="modal-header">
              <h2 className="modal-title">Add New Herd</h2>
              <button className="modal-close" onClick={() => setShowAdd(false)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="form-group full">
                  <label className="form-label">Herd Name *</label>
                  <input className="form-input" placeholder="e.g. Old Cows, Blue Steers" value={newHerd.name} onChange={e => setNewHerd(f => ({...f, name: e.target.value}))} />
                </div>
                <div className="form-group full">
                  <label className="form-label">Enterprise (Ambrook)</label>
                  <select className="form-select" value={newHerd.enterprise || ''} onChange={e => setNewHerd(f => ({...f, enterprise: e.target.value}))}>
                    <option value="">-- Select Enterprise --</option>
                    {activeEntNames.map(en => <option key={en} value={en}>{en}</option>)}
                    {newHerd.enterprise && !activeEntNames.includes(newHerd.enterprise) && <option value={newHerd.enterprise}>{newHerd.enterprise} (archived / not in list)</option>}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Default AU (Cows/Bulls)</label>
                  <input className="form-input" type="number" step="0.01" placeholder="1.4" value={newHerd.default_au} onChange={e => setNewHerd(f => ({...f, default_au: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>For static animals (cows, bulls)</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Starting Weight (lbs)</label>
                  <input className="form-input" type="number" placeholder="600" value={newHerd.starting_weight} onChange={e => setNewHerd(f => ({...f, starting_weight: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>For yearlings with ADG</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Weight Date</label>
                  <input className="form-input" type="date" value={newHerd.weight_date} onChange={e => setNewHerd(f => ({...f, weight_date: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label className="form-label">ADG (lbs/day)</label>
                  <input className="form-input" type="number" step="0.01" placeholder="2.5" value={newHerd.adg} onChange={e => setNewHerd(f => ({...f, adg: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>Average daily gain for yearlings</div>
                </div>
                <div className="form-group full">
                  <label className="form-label">Notes</label>
                  <textarea className="form-textarea" placeholder="Any notes about this herd..." value={newHerd.notes} onChange={e => setNewHerd(f => ({...f, notes: e.target.value}))} />
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setShowAdd(false)}>Cancel</button>
              <button className="btn btn-primary" onClick={addHerd}>Create Herd</button>
            </div>
          </div>
        </div>
      )}

      {/* EDIT HERD MODAL */}
      {editingHerd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setEditingHerd(null)}>
          <div className="modal" style={{maxWidth:'500px'}}>
            <div className="modal-header">
              <h2 className="modal-title">Edit Herd</h2>
              <button className="modal-close" onClick={() => setEditingHerd(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-grid">
                <div className="form-group full">
                  <label className="form-label">Herd Name *</label>
                  <input className="form-input" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} />
                </div>
                <div className="form-group full">
                  <label className="form-label">Enterprise (Ambrook)</label>
                  <select className="form-select" value={form.enterprise || ''} onChange={e => setForm(f => ({...f, enterprise: e.target.value}))}>
                    <option value="">-- Select Enterprise --</option>
                    {activeEntNames.map(en => <option key={en} value={en}>{en}</option>)}
                    {form.enterprise && !activeEntNames.includes(form.enterprise) && <option value={form.enterprise}>{form.enterprise} (archived / not in list)</option>}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Default AU (Cows/Bulls)</label>
                  <input className="form-input" type="number" step="0.01" placeholder="1.4" value={form.default_au || ''} onChange={e => setForm(f => ({...f, default_au: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>For static animals (cows, bulls)</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Starting Weight (lbs)</label>
                  <input className="form-input" type="number" placeholder="600" value={form.starting_weight || ''} onChange={e => setForm(f => ({...f, starting_weight: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>For yearlings with ADG</div>
                </div>
                <div className="form-group">
                  <label className="form-label">Weight Date</label>
                  <input className="form-input" type="date" value={form.weight_date || ''} onChange={e => setForm(f => ({...f, weight_date: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label className="form-label">ADG (lbs/day)</label>
                  <input className="form-input" type="number" step="0.01" placeholder="2.5" value={form.adg || ''} onChange={e => setForm(f => ({...f, adg: e.target.value}))} />
                  <div style={{fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>Average daily gain for yearlings</div>
                </div>
                <div className="form-group full">
                  <label className="form-label">Notes</label>
                  <textarea className="form-textarea" value={form.notes || ''} onChange={e => setForm(f => ({...f, notes: e.target.value}))} />
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={() => setEditingHerd(null)}>Cancel</button>
              <button className="btn btn-primary" onClick={saveEdit}>Save Changes</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
// ===== PARTNERSHIPS PAGE =====
const MemberRow = ({ m, i, list, setList }) => (
  <div style={{display:'flex', gap:'10px', marginBottom:'8px', alignItems:'center'}}>
    <input className="form-input" style={{flex:2}} placeholder="Partner name" value={m.member_name} onChange={e => setList(list.map((x,j) => j===i ? {...x, member_name: e.target.value} : x))} />
    <input className="form-input" style={{flex:1}} type="number" placeholder="%" value={m.ownership_pct} onChange={e => setList(list.map((x,j) => j===i ? {...x, ownership_pct: e.target.value} : x))} />
    {list.length > 1 && <button className="btn btn-ghost" style={{padding:'8px'}} onClick={() => setList(list.filter((_,j) => j!==i))}>✕</button>}
  </div>
);

function PartnershipsPage({ toast }) {
  const [partnerships, setPartnerships] = useState([]);
  const [members, setMembers] = useState({});
  const [loading, setLoading] = useState(true);
  const [showAdd, setShowAdd] = useState(false);
  const [editingP, setEditingP] = useState(null);
  const [newP, setNewP] = useState({ name: '', description: '' });
  const [newMembers, setNewMembers] = useState([{ member_name: '', ownership_pct: '' }]);
  const [editMembers, setEditMembers] = useState([]);

  const fetchPartnerships = async () => {
    setLoading(true);
    const { data: ps } = await supabase.from('partnerships').select('*').order('name');
    const { data: ms } = await supabase.from('partnership_members').select('*').order('member_name');
    setPartnerships(ps || []);
    const mMap = {};
    (ms || []).forEach(m => { if (!mMap[m.partnership_id]) mMap[m.partnership_id] = []; mMap[m.partnership_id].push(m); });
    setMembers(mMap);
    setLoading(false);
  };

  useEffect(() => { fetchPartnerships(); }, []);

  const openEdit = (p) => { setEditingP({ ...p }); setEditMembers((members[p.id] || []).map(m => ({ ...m }))); };

  const saveEdit = async () => {
    if (!editingP.name) { toast('Partnership name is required', 'error'); return; }
    const totalPct = editMembers.reduce((sum, m) => sum + parseFloat(m.ownership_pct || 0), 0);
    if (Math.abs(totalPct - 100) > 0.01) { toast(`Percentages must total 100%. Currently: ${totalPct.toFixed(1)}%`, 'error'); return; }
    const { error: pErr } = await supabase.from('partnerships').update({ name: editingP.name, description: editingP.description || null, is_active: editingP.is_active, updated_at: new Date().toISOString() }).eq('id', editingP.id);
    if (pErr) { toast('Error updating: ' + pErr.message, 'error'); return; }
    // Build and validate the replacement rows BEFORE deleting the old ones — delete-then-insert
    // isn't atomic, so we minimize the window where a failed insert would leave the partnership empty.
    const memberRows = editMembers.filter(m => m.member_name).map(m => ({ partnership_id: editingP.id, member_name: m.member_name, ownership_pct: parseFloat(m.ownership_pct), effective_date: todayLocal() }));
    const { error: delErr } = await supabase.from('partnership_members').delete().eq('partnership_id', editingP.id);
    if (delErr) { toast('Error clearing old members: ' + delErr.message + ' — members unchanged.', 'error'); return; }
    if (memberRows.length > 0) { const { error: mErr } = await supabase.from('partnership_members').insert(memberRows); if (mErr) { toast('⚠️ CRITICAL: old members were deleted but new members failed to save (' + mErr.message + '). Re-open this partnership and re-enter member splits NOW.', 'error'); return; } }
    setEditingP(null); fetchPartnerships(); toast('Partnership updated!', 'success');
  };

  const addPartnership = async () => {
    if (!newP.name) { toast('Partnership name is required', 'error'); return; }
    const totalPct = newMembers.reduce((sum, m) => sum + parseFloat(m.ownership_pct || 0), 0);
    if (Math.abs(totalPct - 100) > 0.01) { toast(`Ownership percentages must total 100%. Currently: ${totalPct}%`, 'error'); return; }
    const { data: p, error } = await supabase.from('partnerships').insert({ name: newP.name, description: newP.description || null }).select().single();
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    const memberRows = newMembers.filter(m => m.member_name).map(m => ({ partnership_id: p.id, member_name: m.member_name, ownership_pct: parseFloat(m.ownership_pct), effective_date: todayLocal() }));
    if (memberRows.length > 0) { const { error: me } = await supabase.from('partnership_members').insert(memberRows); if (me) { toast('Error adding members: ' + me.message, 'error'); return; } }
    setShowAdd(false); setNewP({ name: '', description: '' }); setNewMembers([{ member_name: '', ownership_pct: '' }]);
    fetchPartnerships(); toast('Partnership created!', 'success');
  };

  const deletePartnership = async (p) => {
    const { count, error: countErr } = await supabase.from('animal_ownership_history').select('id', { count: 'exact', head: true }).eq('partnership_id', p.id);
    if (countErr) { toast('Error checking ownership history: ' + countErr.message, 'error'); return; }
    if (count > 0) { toast(`Can't delete — ${count} animal ownership record${count === 1 ? '' : 's'} reference "${p.name}". Archive it instead (uncheck "active" in Edit).`, 'error'); return; }
    if (!confirm(`Permanently delete "${p.name}" and its member splits? This cannot be undone.`)) return;
    const { error: mErr } = await supabase.from('partnership_members').delete().eq('partnership_id', p.id);
    if (mErr) { toast('Error deleting members: ' + mErr.message, 'error'); return; }
    const { error } = await supabase.from('partnerships').delete().eq('id', p.id);
    if (error) toast('Error: ' + error.message, 'error');
    else { fetchPartnerships(); toast('Partnership deleted', 'success'); }
  };

  const totalPct = (list) => list.reduce((s,m) => s + parseFloat(m.ownership_pct||0), 0);

  return (
    <div>
      <div style={{display:'flex', justifyContent:'flex-end', marginBottom:'20px'}}><button className="btn btn-primary" onClick={() => setShowAdd(true)}>+ Add Partnership</button></div>
      {loading ? <div className="loading"><div className="spinner"></div> Loading...</div>
      : partnerships.length === 0 ? <div className="empty-state"><h3>No partnerships yet</h3><p>Add your first ownership partnership to get started.</p></div>
      : <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
        {partnerships.map(p => (
          <div key={p.id} className="detail-card">
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:'14px'}}>
              <div><h3 style={{fontFamily:'Playfair Display, serif', fontSize:'18px', color:'var(--cream)', fontWeight:'700', margin:'0 0 4px'}}>{p.name}</h3>{p.description && <p style={{color:'var(--ash)', fontSize:'13px'}}>{p.description}</p>}</div>
              <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
                <span style={{fontSize:'11px', color: p.is_active ? 'var(--sage)' : 'var(--ash)', fontFamily:'IBM Plex Mono'}}>{p.is_active ? '● ACTIVE' : '○ INACTIVE'}</span>
                <button className="btn btn-secondary" style={{padding:'4px 12px', fontSize:'12px'}} onClick={() => openEdit(p)}>Edit</button>
                <button className="btn btn-danger" style={{padding:'4px 12px', fontSize:'12px'}} onClick={() => deletePartnership(p)}>Delete</button>
              </div>
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:'6px'}}>
              {(members[p.id] || []).map(m => <div key={m.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 12px', background:'rgba(15,28,36,0.4)', borderRadius:'4px'}}><span style={{color:'var(--cream)', fontSize:'14px'}}>{m.member_name}</span><span style={{color:'var(--hay)', fontFamily:'IBM Plex Mono', fontSize:'14px', fontWeight:'600'}}>{m.ownership_pct}%</span></div>)}
              {(members[p.id] || []).length > 0 && <div style={{textAlign:'right', fontFamily:'IBM Plex Mono', fontSize:'11px', color:'var(--ash)', marginTop:'4px'}}>TOTAL: {(members[p.id] || []).reduce((s,m) => s + parseFloat(m.ownership_pct), 0).toFixed(1)}%</div>}
            </div>
          </div>
        ))}
      </div>}

      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal" style={{maxWidth:'500px'}}>
            <div className="modal-header"><h2 className="modal-title">New Partnership</h2><button className="modal-close" onClick={() => setShowAdd(false)}>✕</button></div>
            <div className="modal-body">
              <div className="form-group" style={{marginBottom:'14px'}}><label className="form-label">Partnership Name *</label><input className="form-input" placeholder="e.g. Luke & Dan 50/50" value={newP.name} onChange={e => setNewP(f => ({...f, name: e.target.value}))} /></div>
              <div className="form-group" style={{marginBottom:'20px'}}><label className="form-label">Description</label><input className="form-input" placeholder="Optional description" value={newP.description} onChange={e => setNewP(f => ({...f, description: e.target.value}))} /></div>

              <div className="form-group" style={{marginBottom:'14px'}}><label className="form-label">Description</label><input className="form-input" value={editingP.description || ''} onChange={e => setEditingP(f => ({...f, description: e.target.value}))} /></div>
              <div className="form-group" style={{marginBottom:'20px', flexDirection:'row', alignItems:'center', gap:'10px'}}>
                <input type="checkbox" id="edit-is-active" checked={editingP.is_active !== false} onChange={e => setEditingP(f => ({...f, is_active: e.target.checked}))} style={{width:'16px', height:'16px', accentColor:'var(--rust)'}} />
                <label htmlFor="edit-is-active" className="form-label" style={{margin:0, cursor:'pointer'}}>Partnership is active</label>
              </div>
              <div className="form-label" style={{marginBottom:'10px', display:'block'}}>PARTNERS (must total 100%)</div>
              {editMembers.map((m,i) => <MemberRow key={i} m={m} i={i} list={editMembers} setList={setEditMembers} />)}
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'8px'}}>
                <button className="btn btn-ghost" onClick={() => setEditMembers(m => [...m, { member_name: '', ownership_pct: '' }])}>+ Add Partner</button>
                <span style={{fontFamily:'IBM Plex Mono', fontSize:'12px', color: Math.abs(totalPct(editMembers)-100)<0.01?'var(--sage)':'#e05555'}}>Total: {totalPct(editMembers).toFixed(1)}%</span>
              </div>
            </div>
            <div className="modal-footer"><button className="btn btn-ghost" onClick={() => setEditingP(null)}>Cancel</button><button className="btn btn-primary" onClick={saveEdit}>Save Changes</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

];
const SEX_VALUES = ['cow','heifer','bull','steer','calf_male','calf_female','horse'];
const BREEDING_VALUES = ['open','bred_spring','bred_fall','dry','nursing','unknown'];

function parseCSVDate(val) {
  if (!val) return null;
  const cleaned = val.trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(cleaned)) return cleaned;
  const parts = cleaned.split('/');
  if (parts.length === 3) { const [m, d, y] = parts; const fullYear = y.length <= 2 ? `20${y}` : y; return `${fullYear}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return null;
}

function parseCSV(text) {
  // Quote-aware: commas or line breaks inside "quoted cells" stay in the cell. Handles CRLF and Excel's BOM.
  text = String(text || '').replace(/^\uFEFF/, '');
  const records = []; let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(field); records.push(row); row = []; field = ''; }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); records.push(row); }
  const lines = records.filter(r => r.some(v => v.trim()));
  if (lines.length < 2) return { headers: [], rows: [] };
  const headers = lines[0].map(h => h.trim());
  const rows = lines.slice(1).map(vals => { const obj = {}; headers.forEach((h, i) => { obj[h] = (vals[i] || '').trim(); }); return obj; });
  return { headers, rows };
}

function validateOwner(ownerName, partnerships) {
  if (!ownerName || !ownerName.trim()) return { partnership: null, willCreate: false };
  const trimmedName = ownerName.trim();
  const existing = partnerships.find(p => p.name.toLowerCase() === trimmedName.toLowerCase());
  if (existing) return { partnership: existing, willCreate: false };
  return { partnership: { name: trimmedName }, willCreate: true };
}

function AddAnimalsImport({ toast }) {
  const [step, setStep] = useState('upload');
  const [csvData, setCsvData] = useState(null);
  const [columnMap, setColumnMap] = useState({});
  const [preview, setPreview] = useState([]);
  const [errors, setErrors] = useState([]);
  const [herds, setHerds] = useState([]);
  const [partnerships, setPartnerships] = useState([]);
  const [defaultHerd, setDefaultHerd] = useState('');
  const [defaultSex, setDefaultSex] = useState('cow');
  const [projects, setProjects] = useState([]);
  const [defaultProject, setDefaultProject] = useState('');
  const [importing, setImporting] = useState(false);
  const [importResult, setImportResult] = useState(null);
  const fileRef = useRef();

  useEffect(() => {
    supabase.from('herds').select('*').order('name').then(({ data }) => setHerds(data || []));
    supabase.from('partnerships').select('*').order('name').then(({ data }) => setPartnerships(data || []));
    supabase.from('projects').select('*').order('name').then(({ data, error }) => setProjects(error ? [] : (data || [])));
  }, []);

  const downloadTemplate = () => {
    const headers = IMPORT_COLUMNS.map(c => c.key).join(',');
    const sample = { vid: 'H607', eid: '982000123456789', sex: 'steer', herd_name: 'BlueStr', owner: 'Smith Ranch', date_of_birth: '03/15/2026', breed: 'Angus', tag_color: 'blue', purchased: 'true', purchase_date: '10/20/2026', purchase_location: 'Herreid Livestock', purchase_price_per_head: '1850', project: projects[0]?.name || '2027 Blue Steers' };
    const example = IMPORT_COLUMNS.map(c => csvCell(sample[c.key] || '')).join(',');
    const blob = new Blob([headers + '\n' + example], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'ranchsavvy_import_template.csv'; a.click();
  };

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const { headers, rows } = parseCSV(e.target.result);
      setCsvData({ headers, rows });
      const autoMap = {};
      IMPORT_COLUMNS.forEach(col => { const match = headers.find(h => h.toLowerCase().replace(/\s+/g,'_') === col.key || h.toLowerCase() === col.label.toLowerCase()); if (match) autoMap[col.key] = match; });
      setColumnMap(autoMap);
      setStep('map');
    };
    reader.readAsText(file);
  };

  const buildPreview = () => {
    const rows = csvData.rows.map((row, i) => {
      const mapped = {};
      IMPORT_COLUMNS.forEach(col => { const csvCol = columnMap[col.key]; mapped[col.key] = csvCol ? row[csvCol] : ''; });
      const rowErrors = [];
      const vid = mapped.vid ? String(mapped.vid).trim() : '';
      const eid = mapped.eid ? String(mapped.eid).trim() : '';
      const sex = mapped.sex?.toLowerCase().trim() || defaultSex;
      if (!SEX_VALUES.includes(sex)) rowErrors.push(`Invalid sex "${mapped.sex}"`);
      if (mapped.breeding_status && !BREEDING_VALUES.includes(mapped.breeding_status?.toLowerCase())) rowErrors.push(`Invalid breeding status "${mapped.breeding_status}"`);
      if (mapped.date_of_birth && !parseCSVDate(mapped.date_of_birth)) rowErrors.push(`Invalid date "${mapped.date_of_birth}"`);
      const herdName = mapped.herd_name || '';
      const herd = herds.find(h => h.name.toLowerCase() === herdName.toLowerCase());
      const defaultHerdObj = herds.find(h => h.id === defaultHerd);
      const { partnership, willCreate } = validateOwner(mapped.owner, partnerships);
      // Project: a value in the file wins over the default; must already exist (the FK would reject anything else)
      const projectRaw = String(mapped.project ?? '').trim();
      let project = defaultProject || null;
      if (projectRaw) {
        const pr = projects.find(p => normName(p.name) === normName(projectRaw));
        if (!pr) rowErrors.push(`Unknown project "${projectRaw}" — add it under Animals → Projects`);
        else if (!pr.is_active) rowErrors.push(`Project "${pr.name}" is archived`);
        else project = pr.name;
      }
      const mouth = parseMouth(mapped.mouth), udder = parseUdder(mapped.udder_score), bcs = parseBCS(mapped.condition_score), alert = parseAlert(mapped.is_cull);
      if (mouth === null) rowErrors.push(`Invalid mouth "${mapped.mouth}" (solid/broken)`);
      if (udder === null) rowErrors.push(`Invalid udder "${mapped.udder_score}" (A–F)`);
      if (bcs === null) rowErrors.push(`Invalid condition score "${mapped.condition_score}" (1–6)`);
      if (alert === null) rowErrors.push(`Invalid alert "${mapped.is_cull}" (yes/no)`);
      const scores = {};
      if (mouth) scores.mouth = mouth;
      if (udder) scores.udder_score = udder;
      if (bcs !== '' && bcs !== null) scores.condition_score = bcs;
      if (alert === true || alert === false) scores.is_cull = alert;
      return {
        rowNum: i + 1, vid, eid, sex, scores,
        herd_name: herd?.name || defaultHerdObj?.name || '—',
        herd_id: herd?.id || defaultHerd || null,
        owner_name: partnership?.name || '',
        owner_partnership_id: partnership?.id || null,
        owner_will_create: willCreate,
        owner_display: partnership ? (willCreate ? `${partnership.name} (new)` : partnership.name) : '—',
        date_of_birth: parseCSVDate(mapped.date_of_birth),
        breed: mapped.breed || '', tag_color: mapped.tag_color?.toLowerCase() || '',
        breeding_status: mapped.breeding_status?.toLowerCase() || '',
        purchased: mapped.purchased?.toLowerCase() === 'true',
        purchase_date: parseCSVDate(mapped.purchase_date),
        purchase_location: mapped.purchase_location || '',
        purchase_price_per_head: mapped.purchase_price_per_head ? parseFloat(mapped.purchase_price_per_head) : null,
        project, notes: mapped.notes || '', errors: rowErrors,
      };
    });
    setPreview(rows);
    setErrors(rows.filter(r => r.errors.length > 0));
    setStep('preview');
  };

  const runImport = async () => {
    const validRows = preview.filter(r => r.errors.length === 0);
    setImporting(true);
    try {
      const partnershipsToCreate = [...new Set(validRows.filter(r => r.owner_will_create && r.owner_name).map(r => r.owner_name))];
      const newPartnershipMap = {};
      for (const name of partnershipsToCreate) {
        const { data, error } = await supabase.from('partnerships').insert({ name }).select('id, name').single();
        if (error) throw new Error(`Failed to create partnership "${name}": ${error.message}`);
        if (data) newPartnershipMap[name] = data.id;
      }
      const insertRows = validRows.map(r => ({ vid: r.vid || null, eid: r.eid || null, sex: r.sex, herd_id: r.herd_id || null, date_of_birth: r.date_of_birth || null, breed: r.breed || null, tag_color: r.tag_color || null, breeding_status: r.breeding_status || null, purchased: r.purchased, purchase_date: r.purchase_date || null, purchase_location: r.purchase_location || null, purchase_price_per_head: r.purchase_price_per_head || null, notes: r.notes || null, status: 'active', ...(r.project ? { project: r.project } : {}), ...r.scores }));
      let imported = 0, failed = 0, ownershipInserted = 0, partnershipsCreated = Object.keys(newPartnershipMap).length;
      for (let i = 0; i < insertRows.length; i += 25) {
        const batch = insertRows.slice(i, i + 25);
        const batchPreviewRows = validRows.slice(i, i + 25);
        const { data: insertedAnimals, error } = await supabase.from('animals').insert(batch).select('id');
        if (error) { failed += batch.length; }
        else {
          imported += insertedAnimals.length;
          const ownershipRecords = [];
          insertedAnimals.forEach((animal, idx) => {
            const previewRow = batchPreviewRows[idx];
            if (previewRow.owner_name) {
              const partnershipId = previewRow.owner_partnership_id || newPartnershipMap[previewRow.owner_name];
              if (partnershipId) ownershipRecords.push({ animal_id: animal.id, partnership_id: partnershipId, effective_date: previewRow.date_of_birth || previewRow.purchase_date || todayLocal() });
            }
          });
          if (ownershipRecords.length > 0) {
            const { error: ownershipError } = await supabase.from('animal_ownership_history').insert(ownershipRecords);
            if (!ownershipError) ownershipInserted += ownershipRecords.length;
          }
        }
      }
      setImporting(false);
      setImportResult({ imported, failed, skipped: preview.length - validRows.length, ownershipInserted, partnershipsCreated });
      setStep('done');
      let msg = `Import complete: ${imported} animals added`;
      if (failed > 0) msg += `, ${failed} failed`;
      if (partnershipsCreated > 0) msg += `, ${partnershipsCreated} new partnerships created`;
      if (ownershipInserted > 0) msg += `, ${ownershipInserted} ownership records`;
      toast(msg + '!', imported > 0 ? 'success' : 'error');
    } catch (error) { setImporting(false); toast(`Import failed: ${error.message}`, 'error'); }
  };

  const reset = () => { setStep('upload'); setCsvData(null); setColumnMap({}); setPreview([]); setErrors([]); setImportResult(null); };

  return (
    <div>
      <div style={{display:'flex', gap:'0', marginBottom:'28px', background:'var(--charcoal)', borderRadius:'6px', border:'1px solid rgba(58,125,123,0.3)', overflow:'hidden'}}>
        {['upload','map','preview','done'].map((s, i) => (
          <div key={s} style={{flex:1, padding:'12px', textAlign:'center', fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', letterSpacing:'2px', textTransform:'uppercase', background: step===s?'rgba(42,157,143,0.2)':'transparent', color: step===s?'var(--hay)':'var(--ash)', borderRight: i<3?'1px solid rgba(58,125,123,0.3)':'none'}}>
            {i+1}. {s}
          </div>
        ))}
      </div>

      {step === 'upload' && (
        <div>
          <div className="detail-card" style={{marginBottom:'20px'}}>
            <h3>How to Import from Google Sheets</h3>
            <div style={{color:'var(--ash)', fontSize:'14px', lineHeight:'1.8', marginTop:'8px'}}>
              <p>1. Open your Google Sheet with animal data</p>
              <p>2. Go to <strong style={{color:'var(--cream)'}}>File → Download → Comma Separated Values (.csv)</strong></p>
              <p>3. Upload the downloaded CSV file below</p>
            </div>
          </div>
          <div className="detail-card" style={{marginBottom:'20px'}}>
            <h3>Default Settings</h3>
            <p style={{color:'var(--ash)', fontSize:'13px', marginBottom:'14px'}}>Applied to rows where the CSV doesn't specify a value.</p>
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'14px'}}>
              <div className="form-group"><label className="form-label">Default Herd</label><select className="form-select" value={defaultHerd} onChange={e => setDefaultHerd(e.target.value)}><option value="">-- None --</option>{herds.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Default Project</label><ProjectSelect projects={projects} value={defaultProject} onChange={setDefaultProject} /></div>
              <div className="form-group"><label className="form-label">Default Sex</label><select className="form-select" value={defaultSex} onChange={e => setDefaultSex(e.target.value)}>{SEX_VALUES.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
            </div>
          </div>
          <div style={{display:'flex', gap:'14px'}}>
            <div style={{flex:1, border:'2px dashed rgba(58,125,123,0.4)', borderRadius:'6px', padding:'48px 20px', textAlign:'center', cursor:'pointer', background:'var(--charcoal)'}} onClick={() => fileRef.current?.click()} onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}>
              <div style={{marginBottom:'12px', color:'var(--ash)'}}><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>
              <p style={{color:'var(--cream)', fontSize:'15px', fontWeight:'600', marginBottom:'6px'}}>Drop CSV file here or click to browse</p>
              <p style={{color:'var(--ash)', fontSize:'13px'}}>Exported from Google Sheets</p>
              <input ref={fileRef} type="file" accept=".csv" style={{display:'none'}} onChange={e => handleFile(e.target.files[0])} />
            </div>
            <div style={{display:'flex', flexDirection:'column', gap:'10px', justifyContent:'center'}}>
              <button className="btn btn-secondary" onClick={downloadTemplate} style={{whiteSpace:'nowrap'}}>⬇ Download Template</button>
              <div style={{color:'var(--ash)', fontSize:'11px', fontFamily:'IBM Plex Mono, monospace', textAlign:'center'}}>AVAILABLE<br/>COLUMNS</div>
              {IMPORT_COLUMNS.map(c => <div key={c.key} style={{fontSize:'11px', color: c.required ? 'var(--rust)' : 'var(--ash)', fontFamily:'IBM Plex Mono, monospace'}}>{c.required ? '* ' : '  '}{c.key}</div>)}
            </div>
          </div>
        </div>
      )}

      {step === 'map' && csvData && (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px'}}>
            <div><h2 style={{fontFamily:'Playfair Display, serif', fontSize:'20px', color:'var(--cream)'}}>Map Your Columns</h2><p style={{color:'var(--ash)', fontSize:'13px', marginTop:'4px'}}>{csvData.rows.length} rows detected · {csvData.headers.length} columns found</p></div>
            <button className="btn btn-ghost" onClick={reset}>← Start Over</button>
          </div>
          <div className="table-wrap" style={{marginBottom:'20px'}}>
            <table>
              <thead><tr><th>Ranch Savvy Field</th><th>Your CSV Column</th><th>Sample Value</th></tr></thead>
              <tbody>
                {IMPORT_COLUMNS.map(col => (
                  <tr key={col.key}>
                    <td><span style={{color:'var(--cream)', fontWeight:'600', fontSize:'13px'}}>{col.label}</span>{col.required && <span style={{color:'var(--rust)', marginLeft:'4px'}}>*</span>}<br/><span style={{color:'var(--ash)', fontSize:'11px', fontFamily:'IBM Plex Mono, monospace'}}>{col.hint}</span></td>

        </div>

      {step === 'preview' && (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px'}}>
            <div><h2 style={{fontFamily:'Playfair Display, serif', fontSize:'20px', color:'var(--cream)'}}>Preview Import</h2><p style={{color:'var(--ash)', fontSize:'13px', marginTop:'4px'}}><span style={{color:'var(--sage)'}}>{preview.filter(r=>r.errors.length===0).length} ready to import</span>{errors.length > 0 && <span style={{color:'#e05555', marginLeft:'12px'}}>⚠ {errors.length} rows have errors (will be skipped)</span>}</p></div>
            <button className="btn btn-ghost" onClick={() => setStep('map')}>← Back</button>
          </div>
          {errors.length > 0 && <div style={{background:'rgba(224,85,85,0.1)', border:'1px solid rgba(224,85,85,0.3)', borderRadius:'6px', padding:'14px 18px', marginBottom:'16px'}}><p style={{color:'#e05555', fontWeight:'600', marginBottom:'8px'}}>⚠ Rows with errors will be skipped:</p>{errors.map(r => <p key={r.rowNum} style={{color:'var(--ash)', fontSize:'13px'}}>Row {r.rowNum} (VID: {r.vid || 'blank'}): {r.errors.join(', ')}</p>)}</div>}
          <div className="table-wrap" style={{marginBottom:'20px'}}>
            <table>
              <thead><tr><th>#</th><th>VID</th><th>EID</th><th>Sex</th><th>Herd</th><th>Owner</th><th>DOB</th><th>Breed Status</th><th>Project</th><th>Status</th></tr></thead>
              <tbody>
                {preview.map(r => (
                  <tr key={r.rowNum} style={{opacity: r.errors.length > 0 ? 0.4 : 1}}>
                    <td style={{color:'var(--ash)', fontSize:'12px'}}>{r.rowNum}</td>
                    <td className="td-mono">{r.vid || '—'}</td>
                    <td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', color:'var(--ash)'}}>{r.eid || '—'}</td>
                    <td><span className={`badge badge-${r.sex?.includes('calf') ? 'calf' : r.sex}`}>{r.sex}</span></td>
                    <td>{r.herd_name}</td>
                    <td style={{fontSize:'12px', color:'var(--sage)'}}>{r.owner_display}</td>
                    <td style={{color:'var(--ash)', fontSize:'12px'}}>{r.date_of_birth || '—'}</td>
                    <td style={{fontSize:'12px', color:'var(--sage)'}}>{r.breeding_status || '—'}</td>
                    <td style={{fontSize:'12px', color:'var(--hay)'}}>{r.project || '—'}</td>
                    <td>{r.errors.length > 0 ? <span style={{color:'#e05555', fontSize:'11px', fontFamily:'IBM Plex Mono, monospace'}}>⚠ SKIP</span> : <span style={{color:'var(--sage)', fontSize:'11px', fontFamily:'IBM Plex Mono, monospace'}}>✓ READY</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', gap:'10px'}}>
            <button className="btn btn-ghost" onClick={() => setStep('map')}>← Remap</button>
            <button className="btn btn-primary" onClick={runImport} disabled={importing || preview.filter(r=>r.errors.length===0).length === 0}>{importing ? 'Importing...' : `Import ${preview.filter(r=>r.errors.length===0).length} Animals`}</button>
          </div>
        </div>
      )}

      {step === 'done' && importResult && (
        <div style={{textAlign:'center', padding:'60px 20px'}}>
          <div style={{marginBottom:'20px', color:'var(--sage)'}}><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg></div>
          <h2 style={{fontFamily:'Playfair Display, serif', fontSize:'32px', color:'var(--cream)', marginBottom:'16px'}}>Import Complete!</h2>
          <div style={{display:'flex', justifyContent:'center', gap:'24px', marginBottom:'32px', flexWrap:'wrap'}}>
            <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Imported</div><div className="stat-value" style={{color:'var(--sage)'}}>{importResult.imported}</div></div>
            {importResult.partnershipsCreated > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">New Partnerships</div><div className="stat-value" style={{color:'var(--rust)'}}>{importResult.partnershipsCreated}</div></div>}
            {importResult.ownershipInserted > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Ownership Records</div><div className="stat-value" style={{color:'var(--hay)'}}>{importResult.ownershipInserted}</div></div>}
            <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Skipped</div><div className="stat-value" style={{color:'var(--ash)'}}>{importResult.skipped}</div></div>
            {importResult.failed > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Failed</div><div className="stat-value" style={{color:'#e05555'}}>{importResult.failed}</div></div>}
          </div>
          <div style={{display:'flex', gap:'12px', justifyContent:'center'}}><button className="btn btn-secondary" onClick={reset}>Import Another File</button><button className="btn btn-primary" onClick={() => window.location.reload()}>View Animals →</button></div>
        </div>
      )}
    </div>
  );
}

// ===== CSV UPDATE: EXISTING ANIMALS =====
// Matches CSV rows to ACTIVE animals by VID, EID or RS ID and changes fields in place. Never inserts animals.
// Built for preg-check files: result codes (O/B, Open/Bred, days) are mapped to breeding_status, and each
// row can also write a dated preg_checks record — history the single breeding_status field can't hold.
const UPDATE_FIELDS = [
  { key: 'breeding_status', label: 'Preg Result / Breeding Status', hint: 'O/B, Open/Bred, P, days bred… mapped below' },
  { key: 'days_bred', label: 'Days Bred / Fetal Age', hint: 'Days — sets expected calving date', preg: true },
  { key: 'calving_period', label: 'Calving Period', hint: 'e.g. Early / Mid / Late, 1st cycle', preg: true },
  { key: 'mouth', label: 'Mouth', hint: 'Solid / Broken (S/B ok)', score: true },
  { key: 'udder_score', label: 'Udder Score', hint: 'A, B, C, D, F', score: true },
  { key: 'condition_score', label: 'Condition Score', hint: '1–6, half scores ok', score: true },
  { key: 'is_cull', label: 'Alert → Cull', hint: 'Tru-Test Alert — Yes checks Cull, No unchecks it' },
  { key: 'herd_name', label: 'Herd', hint: 'Moves the animal — must match a herd name' },
  { key: 'owner', label: 'Owner', hint: 'Partnership name — must already exist in Partnerships' },
  { key: 'project', label: 'Project (Ambrook)', hint: 'Must match a project under Animals → Projects' },
  { key: 'tag_color', label: 'Tag Color', hint: '' },
  { key: 'breed', label: 'Breed', hint: '' },
  { key: 'date_of_birth', label: 'Date of Birth', hint: 'MM/DD/YYYY or YYYY-MM-DD' },
  { key: 'eid', label: 'EID', hint: 'Sets EID (when matching on VID)' },
  { key: 'vid', label: 'VID', hint: 'Sets VID (when matching on EID)' },
  { key: 'notes', label: 'Notes', hint: 'Appended to existing notes' },
];
const UPDATE_FIELD_GUESS = [ // order matters: days before result so "Days Bred" isn't taken as the result
  ['days_bred', /^(days?([ _]?bred)?|fetal([ _]?age)?|dbred|days[ _]?preg(nant)?|age[ _]?of[ _]?preg.*)$/i],
  ['calving_period', /(period|calving[ _]?(group|window)|cycle)/i],
  ['mouth', /(mouth|teeth)/i],
  ['udder_score', /udder/i],
  ['condition_score', /(^bcs$|condition|body[ _]?score)/i],
  ['is_cull', /^(alert|cull|is[ _]?cull)$/i],
  ['breeding_status', /(preg|result|breeding[ _]?status|^status$|^bred$|^open$|^o\/b$)/i],
  ['herd_name', /^herd([ _]?name)?$/i],
  ['owner', /^(owner|ownership|owned[ _]?by|partnership|partner)$/i],
  ['project', /^(ambrook[ _]?)?project([ _]?name)?$/i],
  ['tag_color', /colou?r/i],
  ['breed', /^breed$/i],
  ['date_of_birth', /(birth|dob)/i],
  ['notes', /(note|comment|remark)/i],
];
const MATCH_GUESS = {
  vid: /^(vid|tag|tag[ _]?(#|no|num(ber)?)|visual([ _]?id)?|cow[ _]?(#|id|tag)?|id[ _]?#?)$/i,
  eid: /(eid|rfid|electronic|button)/i,
  id: /^(rs[ _]?id|animal[ _]?id|id)$/i,
};
const PREG_METHODS = [['ultrasound','Ultrasound'],['palpation','Palpation'],['blood','Blood test'],['','—']];
const GESTATION_DAYS = 283;

const PREG_CHECKS_SQL = `-- Run once in Supabase → SQL Editor. Creates preg-check history with the same id types as animals/herds.
do $$
declare animal_t text; herd_t text;
begin
  select format_type(atttypid, atttypmod) into animal_t from pg_attribute where attrelid = 'public.animals'::regclass and attname = 'id';
  select format_type(atttypid, atttypmod) into herd_t   from pg_attribute where attrelid = 'public.herds'::regclass   and attname = 'id';
  execute format($f$
    create table if not exists public.preg_checks (
      id bigint generated always as identity primary key,
      animal_id %s not null references public.animals(id) on delete cascade,
      herd_id %s references public.herds(id) on delete set null,  -- herd at time of check (open rate by herd)
      check_date date not null,
      result text not null check (result in ('open','bred')),
      days_bred integer check (days_bred between 0 and 300),
      calving_period text,
      expected_calving_date date,
      method text,
      technician text,
      source text,
      notes text,
      created_at timestamptz not null default now()
    )$f$, animal_t, herd_t);
end $$;
create index if not exists preg_checks_animal_idx on public.preg_checks (animal_id, check_date desc);
create index if not exists preg_checks_date_idx on public.preg_checks (check_date);
alter table public.preg_checks enable row level security;
drop policy if exists "authenticated full access" on public.preg_checks;
create policy "authenticated full access" on public.preg_checks for all to authenticated using (true) with check (true);`;

const normVid = (v) => { const s = String(v ?? '').trim().toUpperCase(); return /^\d+$/.test(s) ? String(parseInt(s, 10)) : s; };
const normEid = (v) => String(v ?? '').replace(/[\s\-.]/g, '');
const normId = (v) => String(v ?? '').trim().toLowerCase();
const normName = (v) => String(v ?? '').trim().replace(/\s+/g, ' ').toLowerCase();
const MATCH_NORM = { vid: normVid, eid: normEid, id: normId };
const MATCH_LABEL = { vid: 'VID', eid: 'EID', id: 'RS ID' };

const guessBreedingStatus = (raw, bredDefault) => {
  const v = String(raw ?? '').trim().toLowerCase().replace(/\s+/g, '_');
  if (!v) return '';
  if (BREEDING_VALUES.includes(v)) return v;
  if (['o','op','opn','open','empty','mt','neg','negative','n','no','-','x'].includes(v)) return 'open';
  if (['b','bred','p','pg','preg','pregnant','pos','positive','y','yes','+','e','m','l','early','mid','middle','late','1st','2nd','3rd','first','second','third'].includes(v)) return bredDefault;
  if (/^\d+(\.\d+)?$/.test(v)) return Number(v) > 0 ? bredDefault : 'open';
  if (v.startsWith('bred') || v.startsWith('preg')) return bredDefault;
  if (v.startsWith('open')) return 'open';
  return '';
};
const isNumeric = (v) => /^\d+(\.\d+)?$/.test(String(v ?? '').trim());
const addDays = (isoDate, n) => { const d = new Date(isoDate + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const csvCell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;

function UpdateAnimalsImport({ toast }) {
  const [step, setStep] = useState('upload');
  const [fileName, setFileName] = useState('');
  const [csvData, setCsvData] = useState(null);
  const [matchBy, setMatchBy] = useState('vid');
  const [herdScope, setHerdScope] = useState('');
  const [tagCol, setTagCol] = useState('');
  const [columnMap, setColumnMap] = useState({});
  const [bredDefault, setBredDefault] = useState('bred_spring');
  const [valueMap, setValueMap] = useState({});
  const [recordPreg, setRecordPreg] = useState(true);
  const [checkDate, setCheckDate] = useState(todayLocal());
  const [method, setMethod] = useState('ultrasound');
  const [technician, setTechnician] = useState('');
  const [herds, setHerds] = useState([]);
  const [partnerships, setPartnerships] = useState([]);
  const [projects, setProjects] = useState([]);
  const [ownerNow, setOwnerNow] = useState(null); // animal_id -> latest ownership row { id, partnership_id, effective_date }
  const [ownerDefault, setOwnerDefault] = useState('');
  const [ownerDate, setOwnerDate] = useState(todayLocal());
  const [projectDate, setProjectDate] = useState(todayLocal());
  const [undoing, setUndoing] = useState(false);
  const [animals, setAnimals] = useState(null);
  const [pregTableOk, setPregTableOk] = useState(null);
  const [scoresOk, setScoresOk] = useState(null);        // animals has the cow-score columns
  const [pregScoresOk, setPregScoresOk] = useState(false); // preg_checks has mouth/udder/BCS columns
  const [showScoreSql, setShowScoreSql] = useState(false);
  const [showSql, setShowSql] = useState(false);
  const [preview, setPreview] = useState([]);
  const [missing, setMissing] = useState([]);
  const [showMissing, setShowMissing] = useState(false);
  const [filter, setFilter] = useState('all');
  const [applying, setApplying] = useState(false);
  const [progress, setProgress] = useState('');
  const [result, setResult] = useState(null);
  const fileRef = useRef();

  const herdName = (id) => herds.find(h => String(h.id) === String(id))?.name || '—';
  const ownerName = (id) => id == null ? '' : (partnerships.find(p => String(p.id) === String(id))?.name || '(unknown owner)');

  const checkPregTable = useCallback(async () => {
    const { error } = await supabase.from('preg_checks').select('id').limit(1);
    setPregTableOk(!error);
    if (error) setRecordPreg(false);
  }, []);
  const checkScoreCols = useCallback(async () => {
    const [{ error: aErr }, { error: pErr }] = await Promise.all([
      supabase.from('animals').select(COW_SCORE_COLS).limit(1),
      supabase.from('preg_checks').select('mouth, udder_score, condition_score').limit(1),
    ]);
    setScoresOk(!aErr);
    setPregScoresOk(!pErr);
  }, []);

  useEffect(() => {
    supabase.from('herds').select('*').order('name').then(({ data }) => setHerds(data || []));
    supabase.from('partnerships').select('*').order('name').then(({ data }) => setPartnerships(data || []));
    supabase.from('projects').select('*').order('name').then(({ data, error }) => setProjects(error ? [] : (data || [])));
    checkPregTable();
    checkScoreCols();
    (async () => {
