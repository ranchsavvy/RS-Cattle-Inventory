                        <td style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'16px', color: ts.color, textAlign:'center', fontWeight:'700'}}>{ts.sign}</td>
                        <td className="td-mono">{t.vid}</td>
                        <td>{t.sex && t.sex !== '—' ? <span className={`badge badge-${t.sex}`}>{t.sex}</span> : <span style={{color:'var(--ash)'}}>—</span>}</td>
                        <td style={{fontSize:'13px', color:'var(--ash)'}}>{t.herd}</td>
                        <td style={{fontSize:'12px', color:'var(--ash)', maxWidth:'200px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{t.notes || '—'}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              <div className="pagination">
                <span className="pagination-info">
                  {results.transactions.length} events &nbsp;·&nbsp;
                  <span style={{color:'var(--sky)'}}>▲ {results.purchases} purchases</span> &nbsp;
                  <span style={{color:'var(--sage)'}}>▲ {results.births} births</span> &nbsp;
                  <span style={{color:'var(--hay)'}}>▼ {results.sales} sales</span> &nbsp;
                  <span style={{color:'#e05555'}}>▼ {results.deaths} deaths</span>
                </span>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ===== HEAD COUNT REPORT =====
// One total head count for Animal Inventory–style filters, as of any date. Never lists individual animals.
//
// How a past date is rebuilt (end of day):
//   • On hand = arrived on/before the date AND (still active OR status_date is after the date)
//       arrival = purchase_date → date_of_birth (raised, not purchased) → day the record was entered (created_at)
//   • Owner   = latest animal_ownership_history row effective on/before the date. If every row is dated later
//               (owner assigned after the fact via Bulk Edit), the first owner on file is used.
//   • Herd, sex/class, breed status, tag color = CURRENT values. Nothing records history on those fields yet
//     (herd_history is never written; Bulk Edit and Animal Detail overwrite in place).
// Today (or a future date) = current records — identical to Animal Inventory with Status = active.

const hcDateOnly = (d) => (d ? String(d).split('T')[0] : null);

// created_at is a UTC timestamp — convert to the local calendar date (same reason todayLocal exists)
const hcLocalDate = (ts) => {
  if (!ts) return null;
  const d = new Date(ts);
  if (isNaN(d.getTime())) return null;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

const hcTagColor = (c) => (c || '').trim().toLowerCase();
const hcCap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const HC_TAG_ORDER = ['yellow','red','blue','green','orange','white','black','pink','purple'];
const HC_SEXES = ['cow','heifer','bull','steer','calf_male','calf_female','horse'];
const HC_BREEDING = ['open','bred_spring','bred_fall','dry','nursing','unknown'];

const hcArrival = (a) => {
  const purchase = hcDateOnly(a.purchase_date);
  if (purchase) return { date: purchase, basis: 'purchase' };
  const dob = hcDateOnly(a.date_of_birth);
  if (!a.purchased && dob) return { date: dob, basis: 'birth' };
  return { date: hcLocalDate(a.created_at) || '0000-01-01', basis: 'entered' };
};

// recs = one animal's ownership rows, sorted by effective date ascending: [{ partnership_id, date }]
const hcOwnerAsOf = (recs, D) => {
  if (!recs || recs.length === 0) return { id: null, fallback: false };
  let id = null;
  for (const r of recs) { if (r.date <= D) id = r.partnership_id; else break; }
  return id ? { id, fallback: false } : { id: recs[0].partnership_id, fallback: true };
};

// f = { asOf, herds, sexes, breeding, owners, tagColors, dobFrom, dobTo }. Empty array = no filter on that field.
// Returns the total plus counts behind the data-gap notes shown under it.
const hcCount = (animals, ownershipByAnimal, f, today) => {
  const isCurrent = !f.asOf || f.asOf >= today;
  const D = isCurrent ? '9999-12-31' : f.asOf;
  const r = { total: 0, isCurrent, arrivedUnknown: 0, noExitDate: 0, missingDob: 0, ownerFallback: 0 };
  for (const a of animals) {
    // 1. Attribute filters (current values) + owner as of the date
    if (f.herds.length && !(f.herds.includes(a.herd_id) || (!a.herd_id && f.herds.includes('NO_HERD')))) continue;
    if (f.projects?.length && !f.projects.includes(a.project || 'NO_PROJECT')) continue;
    if (f.enterprises?.length && !f.enterprises.includes(f.entOfHerd?.[String(a.herd_id)] || 'NO_ENT')) continue;
    if (f.sexes.length && !f.sexes.includes(a.sex)) continue;
    if (f.breeding.length && !f.breeding.includes(a.breeding_status || 'NOT_SET')) continue;
    if (f.tagColors.length && !f.tagColors.includes(hcTagColor(a.tag_color) || 'NO_TAG')) continue;
    const owner = hcOwnerAsOf(ownershipByAnimal[a.id], D);
    if (f.owners.length && !f.owners.includes(owner.id || 'NO_OWNER')) continue;
    // 2. Birth date range — an animal with no DOB can't match a range
    let dobMissing = false;
    if (f.dobFrom || f.dobTo) {
      const dob = hcDateOnly(a.date_of_birth);
      if (!dob) dobMissing = true;
      else if ((f.dobFrom && dob < f.dobFrom) || (f.dobTo && dob > f.dobTo)) continue;
    }
    // 3. On hand at end of day?
    if (isCurrent) {
      if (a.status !== 'active') continue;
    } else {
      const exit = a.status === 'active' ? null : hcDateOnly(a.status_date);
      if (exit && exit <= D) continue;                        // sold / dead / archived on or before the date
      const arrival = hcArrival(a);
      if (arrival.date > D) {                                 // not here yet — unless its dates are just missing
        if (arrival.basis === 'entered' && !dobMissing) r.arrivedUnknown++;
        continue;
      }
      if (!exit && a.status !== 'active') {                   // gone now, but no exit date to place it in time
        if (!dobMissing) r.noExitDate++;
        continue;
      }
    }
    if (dobMissing) { r.missingDob++; continue; }
    r.total++;
    if (owner.fallback) r.ownerFallback++;
  }
  return r;
};

const HcCheck = ({ checked, onChange, muted, children }) => (
  <label className={`hc-check${muted ? ' muted' : ''}`}>
    <input type="checkbox" checked={checked} onChange={onChange} />
    {children}
  </label>
);

function HeadCountReport({ toast, herds, partnerships, projects = [] }) {
  const today = todayLocal();
  const [animals, setAnimals] = useState([]);
  const [ownershipByAnimal, setOwnershipByAnimal] = useState({});
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState('');
  const [asOfDate, setAsOfDate] = useState(today);
  const [herdFilter, setHerdFilter] = useState([]);
  const [sexFilter, setSexFilter] = useState([]);
  const [breedingStatusFilter, setBreedingStatusFilter] = useState([]);
  const [ownerFilter, setOwnerFilter] = useState([]);
  const [tagColorFilter, setTagColorFilter] = useState([]);
  const [projectFilter, setProjectFilter] = useState([]);
  const [entFilter, setEntFilter] = useState([]);
  const [dobStartDate, setDobStartDate] = useState('');
  const [dobEndDate, setDobEndDate] = useState('');
  const entOfHerd = useMemo(() => Object.fromEntries(herds.map(h => [String(h.id), h.enterprise || null])), [herds]);

  const loadData = useCallback(async () => {
    setLoading(true);
    setLoadError('');
    // .range() pagination ordered on a unique key so pages can't skip or repeat rows.
    // Don't add .limit() here — see the 1,000-row note.
    const fetchAll = async (table, columns) => {
      const PAGE = 1000;
      let rows = [];
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await supabase.from(table).select(columns).order('id', { ascending: true }).range(from, from + PAGE - 1);
        if (error) throw new Error(`${table}: ${error.message}`);
        rows = rows.concat(data || []);
        if (!data || data.length < PAGE) return rows;
      }
    };
    try {
      const [animalRows, ownerRows] = await Promise.all([
        fetchAll('animals', 'id, sex, herd_id, project, date_of_birth, tag_color, breeding_status, status, status_date, purchased, purchase_date, created_at'),
        fetchAll('animal_ownership_history', 'id, animal_id, partnership_id, effective_date'),
      ]);
      const byAnimal = {};
      ownerRows.forEach(o => {
        (byAnimal[o.animal_id] = byAnimal[o.animal_id] || []).push({ partnership_id: o.partnership_id, date: hcDateOnly(o.effective_date) || '' });
      });
      Object.values(byAnimal).forEach(list => list.sort((x, y) => x.date.localeCompare(y.date)));
      setAnimals(animalRows);
      setOwnershipByAnimal(byAnimal);
    } catch (err) {
      setLoadError(err.message);
      toast('Error loading head count data: ' + err.message, 'error');
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  // Only offer tag colors that actually exist in the data (CSV import allows free text)
  const tagColorOptions = useMemo(() => {
    const present = new Set(animals.map(a => hcTagColor(a.tag_color)).filter(Boolean));
    return [...HC_TAG_ORDER.filter(c => present.has(c)), ...[...present].filter(c => !HC_TAG_ORDER.includes(c)).sort()];
  }, [animals]);

  const result = useMemo(() => hcCount(animals, ownershipByAnimal, {
    asOf: asOfDate, herds: herdFilter, sexes: sexFilter, breeding: breedingStatusFilter,
    owners: ownerFilter, tagColors: tagColorFilter, dobFrom: dobStartDate, dobTo: dobEndDate,
    projects: projectFilter, enterprises: entFilter, entOfHerd,
  }, today), [animals, ownershipByAnimal, asOfDate, today, herdFilter, sexFilter, breedingStatusFilter, ownerFilter, tagColorFilter, dobStartDate, dobEndDate, projectFilter, entFilter, entOfHerd]);

  const toggle = (setArr, val) => setArr(prev => prev.includes(val) ? prev.filter(v => v !== val) : [...prev, val]);
  const anyFilter = projectFilter.length > 0 || entFilter.length > 0 || herdFilter.length > 0 || sexFilter.length > 0 || breedingStatusFilter.length > 0 || ownerFilter.length > 0 || tagColorFilter.length > 0 || !!dobStartDate || !!dobEndDate;
  const clearFilters = () => { setProjectFilter([]); setEntFilter([]); setHerdFilter([]); setSexFilter([]); setBreedingStatusFilter([]); setOwnerFilter([]); setTagColorFilter([]); setDobStartDate(''); setDobEndDate(''); };

  // Plain-language echo of the filters so a screenshot or printout documents what was counted
  const herdName = (id) => id === 'NO_HERD' ? 'No herd' : (herds.find(h => h.id === id)?.name || 'Unknown herd');
  const ownerName = (id) => id === 'NO_OWNER' ? 'No owner' : (partnerships.find(p => p.id === id)?.name || 'Unknown owner');
  const breedLabel = (bs) => bs === 'NOT_SET' ? 'Not set' : hcCap(bs.replace('_', ' '));

    ['Enterprise', listOrAll(entFilter, v => v === 'NO_ENT' ? 'Not tagged' : v)],
    ['Herd', listOrAll(herdFilter, herdName)],
    ['Sex / class', listOrAll(sexFilter, sexLabel)],
    ['Breed status', listOrAll(breedingStatusFilter, breedLabel)],
    ['Owner', listOrAll(ownerFilter, ownerName)],
    ['Tag color', listOrAll(tagColorFilter, tagLabel)],

  const dobBackwards = dobStartDate && dobEndDate && dobStartDate > dobEndDate;

  return (
    <div className="hc-layout">

        <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:'12px'}}>
          <h3>Filters</h3>

                </HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">ENTERPRISE</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              <HcCheck muted checked={entFilter.includes('NO_ENT')} onChange={() => toggle(setEntFilter, 'NO_ENT')}>Herd not tagged</HcCheck>
              {enterpriseNames(herds).map(e => (
                <HcCheck key={e} checked={entFilter.includes(e)} onChange={() => toggle(setEntFilter, e)}>{e}</HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">HERD</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              <HcCheck muted checked={herdFilter.includes('NO_HERD')} onChange={() => toggle(setHerdFilter, 'NO_HERD')}>No herd assigned</HcCheck>
              {herds.map(h => (
                <HcCheck key={h.id} checked={herdFilter.includes(h.id)} onChange={() => toggle(setHerdFilter, h.id)}>
                  {h.name}{h.is_active === false && <span style={{color:'var(--ash)'}}> (archived)</span>}
                </HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">SEX/CLASS</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              {HC_SEXES.map(s => (
                <HcCheck key={s} checked={sexFilter.includes(s)} onChange={() => toggle(setSexFilter, s)}>{sexLabel(s)}</HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">BREED STATUS</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              <HcCheck muted checked={breedingStatusFilter.includes('NOT_SET')} onChange={() => toggle(setBreedingStatusFilter, 'NOT_SET')}>Not set</HcCheck>
              {HC_BREEDING.map(bs => (
                <HcCheck key={bs} checked={breedingStatusFilter.includes(bs)} onChange={() => toggle(setBreedingStatusFilter, bs)}>{breedLabel(bs)}</HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">OWNER</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              <HcCheck muted checked={ownerFilter.includes('NO_OWNER')} onChange={() => toggle(setOwnerFilter, 'NO_OWNER')}>No owner assigned</HcCheck>
              {partnerships.map(p => (
                <HcCheck key={p.id} checked={ownerFilter.includes(p.id)} onChange={() => toggle(setOwnerFilter, p.id)}>
                  {p.name}{p.is_active === false && <span style={{color:'var(--ash)'}}> (inactive)</span>}
                </HcCheck>
              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">TAG COLOR</span>
            <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
              <HcCheck muted checked={tagColorFilter.includes('NO_TAG')} onChange={() => toggle(setTagColorFilter, 'NO_TAG')}>No tag color</HcCheck>
              {tagColorOptions.map(c => (
                <HcCheck key={c} checked={tagColorFilter.includes(c)} onChange={() => toggle(setTagColorFilter, c)}>
                  <span style={{width:'12px', height:'12px', borderRadius:'50%', background:c, border:'1px solid rgba(154,175,184,0.5)', flexShrink:0}}></span>

              ))}
            </div>
          </div>
          <div>
            <span className="hc-group-label">DATE OF BIRTH</span>
            <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
              <div>
                <label htmlFor="hc-dob-from" style={{display:'block', fontSize:'12px', color:'var(--ash)', marginBottom:'4px'}}>From</label>
                <input id="hc-dob-from" type="date" className="form-input" value={dobStartDate} onChange={e => setDobStartDate(e.target.value)} style={{width:'100%', padding:'6px 8px', fontSize:'13px'}} />
              </div>
              <div>
                <label htmlFor="hc-dob-to" style={{display:'block', fontSize:'12px', color:'var(--ash)', marginBottom:'4px'}}>To</label>
                <input id="hc-dob-to" type="date" className="form-input" value={dobEndDate} onChange={e => setDobEndDate(e.target.value)} style={{width:'100%', padding:'6px 8px', fontSize:'13px'}} />
              </div>
              {dobBackwards && <span style={{fontSize:'12px', color:'#e05555'}}>From is after To — nothing can match.</span>}
            </div>
          </div>
        </div>
      </div>

      {/* ── Result ── */}
      <div className="detail-card hc-result">
        <label className="form-label" htmlFor="hc-asof">Inventory date</label>
        <div style={{display:'flex', gap:'8px', marginTop:'6px'}}>
          <input id="hc-asof" type="date" className="form-input" value={asOfDate} max={today} onChange={e => setAsOfDate(e.target.value)} style={{flex:1, minWidth:0}} />
          <button className="btn btn-ghost" onClick={() => setAsOfDate(today)} disabled={asOfDate === today}>Today</button>
        </div>

        {loading ? (
          <div className="loading" style={{padding:'40px 0'}}><div className="spinner"></div> Loading animals...</div>
        ) : loadError ? (
          <div style={{marginTop:'20px'}}>
            <div className="hc-note" style={{borderLeftColor:'#e05555'}}>Couldn't load animal records: {loadError}</div>
            <button className="btn btn-secondary" onClick={loadData} style={{marginTop:'12px'}}>Try again</button>
          </div>
        ) : (
          <>
            <div className="hc-count">{result.total.toLocaleString('en-US')}</div>
            <div className="hc-count-label">{isPast ? `head on hand end of day ${formatDate(asOfDate)}` : 'head on hand now'}</div>
            <div style={{borderTop:'1px solid rgba(58,125,123,0.2)', paddingTop:'4px'}}>
              {summary.map(([k, v]) => (
                <div key={k} className="detail-row">
                  <span className="detail-key">{k}</span>
                  <span className="detail-val" style={{maxWidth:'65%', fontWeight: v === 'All' ? 400 : 600, color: v === 'All' ? 'var(--ash)' : 'var(--cream)'}}>{v}</span>
                </div>
              ))}
            </div>
            {isPast && <div className="hc-note">On-hand status and owner are rebuilt for this date. Herd (and so enterprise), project, sex/class, breed status and tag color are each animal's current values — those fields don't keep history yet.</div>}
            {isPast && result.arrivedUnknown > 0 && <div className="hc-note">{result.arrivedUnknown.toLocaleString('en-US')} head that match have no purchase or birth date and were entered after this date, so they're left out. If they were here, add a purchase date or DOB to their records.</div>}
            {isPast && result.noExitDate > 0 && <div className="hc-note">{result.noExitDate.toLocaleString('en-US')} head that match are sold, dead or archived with no exit date on file, so they're left out.</div>}
            {isPast && ownerFilter.length > 0 && result.ownerFallback > 0 && <div className="hc-note">{result.ownerFallback.toLocaleString('en-US')} head are counted under their first owner on file — that owner was assigned after this date.</div>}
            {result.missingDob > 0 && <div className="hc-note">{result.missingDob.toLocaleString('en-US')} head that otherwise match have no birth date on file and are left out of the birth date range.</div>}
          </>
        )}
      </div>
    </div>
  );
}

// ===== REPORT SCOPES =====
// One scope value for reports: '' (all) | 'herd:<id>' | 'ent:<enterprise name>' | 'proj:<project name>'.
// Enterprise is a herd tag, so it resolves through each animal's CURRENT herd (herd moves aren't recorded).
// Project rides on the animal itself, so it holds through herd moves.
const splitScope = (scope) => { const i = (scope || '').indexOf(':'); return i < 0 ? ['', ''] : [scope.slice(0, i), scope.slice(i + 1)]; };
const entHerdIds = (name, herds) => herds.filter(h => h.enterprise === name).map(h => String(h.id));
const scopeMatcher = (scope, herds) => {
  const [k, v] = splitScope(scope);
  if (k === 'herd') return a => !!a && String(a.herd_id) === v;
  if (k === 'ent') { const ids = new Set(entHerdIds(v, herds)); return a => !!a && ids.has(String(a.herd_id)); }
  if (k === 'proj') return a => !!a && a.project === v;
  return () => true;
};
// Same scope pushed into a Supabase query on the animals table, so big tables aren't pulled just to be filtered
const scopeQuery = (q, scope, herds) => {
  const [k, v] = splitScope(scope);
  if (k === 'herd') return q.eq('herd_id', v);
  if (k === 'ent') return q.in('herd_id', entHerdIds(v, herds));
  if (k === 'proj') return q.eq('project', v);
  return q;
};
const scopeLabel = (scope, herds) => {
  const [k, v] = splitScope(scope);
  if (k === 'herd') return `Herd: ${herds.find(h => String(h.id) === v)?.name || 'Unknown'}`;
  if (k === 'ent') return `Enterprise: ${v}`;
  if (k === 'proj') return `Project: ${v}`;
  return 'All cattle';
};
const enterpriseNames = (herds) => [...new Set(herds.map(h => h.enterprise).filter(Boolean))].sort();

function ScopeSelect({ value, onChange, herds, projects }) {
  const ents = enterpriseNames(herds);
  return (
    <select className="form-select" value={value} onChange={e => onChange(e.target.value)}>
      <option value="">All Cattle</option>
      {projects.length > 0 && <optgroup label="Project (Ambrook)">{projects.map(p => <option key={p.id} value={`proj:${p.name}`}>{p.name}{p.is_active ? '' : ' (archived)'}</option>)}</optgroup>}
      {ents.length > 0 && <optgroup label="Enterprise (by current herd)">{ents.map(e => <option key={e} value={`ent:${e}`}>{e}</option>)}</optgroup>}
      <optgroup label="Herd">{herds.map(h => <option key={h.id} value={`herd:${h.id}`}>{h.name}</option>)}</optgroup>
    </select>
  );
}

// ===== HEAD DAYS REPORT =====
// Head days by project, enterprise or herd for a date range — the denominator for per-head-day costs in Ambrook.
//   • Counted in nights: the arrival day counts, the exit day doesn't. An animal bought the 1st and sold the 11th = 10 head days.
//   • Arrival = purchase date → birth date (raised) → day entered (same rule as the Head Count report).
//   • Exit = status date for sold / dead / archived. Gone with no exit date = left out and flagged.
//   • Head at start/end are end-of-day counts the day before Start and on End, so Start + In − Out = End.
const hdDay = (iso) => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
const hdDiff = (a, b) => Math.round((hdDay(b) - hdDay(a)) / 86400000);   // whole days from a to b
const HD_BEGIN = '0000-01-01';

// Paginated read of a whole table, ordered on id so pages can't skip or repeat rows
const fetchAllRows = async (table, columns) => {
  const PAGE = 1000; let rows = [];
  for (let from = 0; ; from += PAGE) {
    const { data, error } = await supabase.from(table).select(columns).order('id', { ascending: true }).range(from, from + PAGE - 1);
    if (error) throw new Error(`${table}: ${error.message}`);
    rows = rows.concat(data || []);
    if (!data || data.length < PAGE) return rows;
  }
};
// project_history rows grouped per animal, in the order they took effect
const groupProjectHistory = (rows) => {
  const by = {};
  rows.forEach(h => (by[h.animal_id] = by[h.animal_id] || []).push({ ...h, effective_date: hcDateOnly(h.effective_date) }));
  Object.values(by).forEach(l => l.sort((x, y) => x.effective_date.localeCompare(y.effective_date) || x.id - y.id));
  return by;
};

// One animal's time on hand, cut into project segments: [{ project, from, to, fromProject, toProject, inKind, outKind }]
//   from = first day in the segment; to = day it ended (exclusive) or null if still running.
//   inKind:  'purchase' | 'birth' | 'entered' (segment starts on arrival) or 'transfer'
//   outKind: 'sold' | 'dead' | 'archived' (segment ends at exit) or 'transfer' or null (still there)
// Animals that are gone with no exit date return null — the caller counts and skips them.
const projectSegments = (a, hist) => {
  const arr = hcArrival(a);
  const exit = a.status === 'active' ? null : hcDateOnly(a.status_date);
  if (a.status !== 'active' && !exit) return null;
  // Raw membership over all time. No history = whatever is on the animal now (tagged before history existed).
  let raw;
  if (!hist || !hist.length) raw = [{ project: a.project || null, from: HD_BEGIN, to: null, fromProject: null, toProject: null }];
  else {
    raw = [{ project: hist[0].from_project || null, from: HD_BEGIN, to: hist[0].effective_date, fromProject: null, toProject: hist[0].to_project || null }];
    hist.forEach((h, i) => raw.push({ project: h.to_project || null, from: h.effective_date, to: hist[i + 1]?.effective_date || null,
      fromProject: h.from_project || null, toProject: hist[i + 1] ? (hist[i + 1].to_project || null) : null }));
  }
  const out = [];
  for (const r of raw) {
    const from = r.from > arr.date ? r.from : arr.date;
    let to = r.to;
    if (exit && (to === null || exit <= to)) to = exit;
    if (to !== null && to <= from) continue;                   // never on hand while in this project
    const prev = out[out.length - 1];
    if (prev && prev.project === r.project && prev.to === from) { prev.to = to; prev.outKind = to === null ? null : (exit && to === exit ? a.status : 'transfer'); prev.toProject = r.toProject; continue; }
    out.push({ project: r.project, from, to, fromProject: r.fromProject, toProject: r.toProject,
      inKind: from === arr.date ? arr.basis : 'transfer',
      outKind: to === null ? null : (exit && to === exit ? a.status : 'transfer') });
  }
  return out;
};

// Where one time-segment sits against a period [S, E] (E inclusive). Start + In − Out = End holds by construction.
const periodPart = (from, to, S, E) => {
  const endNext = addDays(E, 1);
  const lo = from > S ? from : S, hi = to !== null && to < endNext ? to : endNext;
  return {
    days: Math.max(0, hdDiff(lo, hi)),
    atStart: from < S && (to === null || to >= S),
    atEnd: from <= E && (to === null || to > E),
    came: from >= S && from <= E,
    went: to !== null && to >= S && to <= E,
  };
};

function HeadDaysReport({ toast, herds, projects }) {
  const today = todayLocal();
  const [animals, setAnimals] = useState(null);
  const [loadError, setLoadError] = useState('');
  const [startDate, setStartDate] = useState(`${today.slice(0, 4)}-01-01`);
  const [endDate, setEndDate] = useState(today);
  const [groupBy, setGroupBy] = useState('project');
  const [scope, setScope] = useState('');
  const [history, setHistory] = useState({});

  const loadData = useCallback(async () => {
    setLoadError(''); setAnimals(null);
    try {
      const [rows, hist] = await Promise.all([
        fetchAllRows('animals', 'id, vid, eid, sex, herd_id, project, status, status_date, purchased, purchase_date, date_of_birth, created_at'),
        fetchAllRows('project_history', 'id, animal_id, from_project, to_project, effective_date'),
      ]);
      setHistory(groupProjectHistory(hist));
      setAnimals(rows);
    } catch (err) {
      setLoadError(err.message);
      toast("Couldn't load animals for head days: " + err.message, 'error');
    }
  }, []);
  useEffect(() => { loadData(); }, [loadData]);

  const herdById = useMemo(() => Object.fromEntries(herds.map(h => [String(h.id), h])), [herds]);
  const groupOf = (a) => {
    if (groupBy === 'project') return a.project || '(no project)';
    const h = herdById[String(a.herd_id)];
    if (groupBy === 'enterprise') return h?.enterprise || (h ? '(herd not tagged)' : '(no herd)');
    return h?.name || '(no herd)';
  };

  const report = useMemo(() => {
    if (!animals || !startDate || !endDate || startDate > endDate) return null;
    const end = endDate > today ? today : endDate;
    const periodDays = hdDiff(startDate, addDays(end, 1));
    const inScope = scopeMatcher(scope, herds);
    const [sk, sv] = splitScope(scope);
    const byProject = groupBy === 'project' || sk === 'proj';   // project days follow project history, not just today's tag
    const groups = {}, detail = [];
    const notes = { noExit: 0, entered: 0 };
    for (const a of animals) {
      if (sk !== 'proj' && !inScope(a)) continue;
      const segs = projectSegments(a, history[a.id]);
      if (!segs) { if (hcArrival(a).date <= end) notes.noExit++; continue; }
      // Time units to count: project segments, or the whole stay (enterprise/herd use the current herd)
      let units;
      if (byProject) {
        units = (sk === 'proj' ? segs.filter(x => x.project === sv) : segs)
          .map(x => ({ key: groupBy === 'project' ? (x.project || '(no project)') : groupOf(a), from: x.from, to: x.to, kind: x.inKind }));
      } else {
        const first = segs[0], last = segs[segs.length - 1];
        units = first ? [{ key: groupOf(a), from: first.from, to: last.to, kind: first.inKind }] : [];
      }
      for (const u of units) {
        const pp = periodPart(u.from, u.to, startDate, end);
        if (!pp.days && !pp.atStart && !pp.came && !pp.went) continue;
        if (u.kind === 'entered' && pp.came) notes.entered++;
        const g = groups[u.key] = groups[u.key] || { key: u.key, headDays: 0, start: 0, in: 0, out: 0, end: 0, head: 0 };
        g.headDays += pp.days; g.head++;
        if (pp.atStart) g.start++; if (pp.came) g.in++; if (pp.went) g.out++; if (pp.atEnd) g.end++;
        detail.push({ group: u.key, vid: a.vid || '', eid: a.eid || '', sex: a.sex, herd: herdById[String(a.herd_id)]?.name || '', project: a.project || '',
          arrival: u.from, basis: u.kind, exit: u.to || '', status: a.status, days: pp.days });
      }
    }
    const rows = Object.values(groups).sort((x, y) => (x.key.startsWith('(') - y.key.startsWith('(')) || y.headDays - x.headDays);
    const total = rows.reduce((t, g) => ({ headDays: t.headDays + g.headDays, start: t.start + g.start, in: t.in + g.in, out: t.out + g.out, end: t.end + g.end, head: t.head + g.head }),
      { headDays: 0, start: 0, in: 0, out: 0, end: 0, head: 0 });
    detail.sort((x, y) => x.group.localeCompare(y.group) || String(x.vid).localeCompare(String(y.vid), undefined, { numeric: true }));
    return { rows, total, detail, notes, periodDays, end, clipped: end !== endDate };
  }, [animals, history, startDate, endDate, groupBy, scope, herds, today]);

  const GROUP_LABEL = { project: 'Project', enterprise: 'Enterprise', herd: 'Herd' };
  const n0 = (v) => Math.round(v).toLocaleString('en-US');
  const n1 = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

  const exportCSV = (withDetail) => {
    if (!report) return;
    const L = [
      ['Ranch Savvy — Head Days'], [`Period`, `${startDate} to ${report.end}`, `${report.periodDays} days`],
      ['Grouped by', GROUP_LABEL[groupBy]], ['Scope', scopeLabel(scope, herds)], ['Generated', new Date().toLocaleString()], [],
      [GROUP_LABEL[groupBy], 'Head Days', 'Avg Head', 'Head at Start', 'In', 'Out', 'Head at End'],
      ...report.rows.map(g => [g.key, g.headDays, (g.headDays / report.periodDays).toFixed(1), g.start, g.in, g.out, g.end]),
      ['TOTAL', report.total.headDays, (report.total.headDays / report.periodDays).toFixed(1), report.total.start, report.total.in, report.total.out, report.total.end],
    ];
    if (groupBy !== 'project') L.push([], ['Note: enterprise/herd uses each animal\'s current herd — herd moves are not recorded.']);
    if (withDetail) {
      L.push([], ['DETAIL'], [GROUP_LABEL[groupBy], 'VID', 'EID', 'Sex', 'Current Herd', 'Current Project', 'In From', 'In By', 'Out On', 'Status', 'Head Days In Period']);
      report.detail.forEach(d => L.push([d.group, d.vid, d.eid, d.sex, d.herd, d.project, d.arrival, d.basis, d.exit, d.status, d.days]));
    }
    const blob = new Blob([L.map(r => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `ranch_savvy_head_days_${groupBy}_${startDate}_${report.end}.csv`; link.click();
    URL.revokeObjectURL(url);
  };

  const mono = { fontFamily: 'IBM Plex Mono, monospace' };
  return (
    <div>
      <div className="detail-card" style={{marginBottom:'24px'}}>
        <h3 style={{marginBottom:'16px'}}>Head Days</h3>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(170px, 1fr))', gap:'14px', alignItems:'end'}}>
          <div className="form-group" style={{margin:0}}><label className="form-label">Start Date</label><input className="form-input" type="date" value={startDate} max={today} onChange={e => setStartDate(e.target.value)} /></div>
          <div className="form-group" style={{margin:0}}><label className="form-label">End Date</label><input className="form-input" type="date" value={endDate} max={today} onChange={e => setEndDate(e.target.value)} /></div>
          <div className="form-group" style={{margin:0}}><label className="form-label">Group By</label>
            <select className="form-select" value={groupBy} onChange={e => setGroupBy(e.target.value)}>
              <option value="project">Project (Ambrook)</option><option value="enterprise">Enterprise (Ambrook)</option><option value="herd">Herd</option>
            </select>
          </div>
          <div className="form-group" style={{margin:0}}><label className="form-label">Limit To</label><ScopeSelect value={scope} onChange={setScope} herds={herds} projects={projects} /></div>
        </div>
        {startDate > endDate && <p style={{color:'#e05555', fontSize:'13px', marginTop:'12px'}}>Start date is after end date.</p>}
      </div>

      {loadError ? (
        <div className="detail-card"><div className="hc-note" style={{borderLeftColor:'#e05555'}}>Couldn't load animals: {loadError}</div><button className="btn btn-secondary" style={{marginTop:'12px'}} onClick={loadData}>Try again</button></div>
      ) : !animals ? (
        <div className="loading"><div className="spinner"></div> Loading animals...</div>
      ) : report && (
        <>
          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Head Days</div><div className="stat-value">{n0(report.total.headDays)}</div><div className="stat-sub">{report.periodDays} days in period</div></div>
            <div className="stat-card"><div className="stat-label">Avg Head</div><div className="stat-value">{n1(report.total.headDays / report.periodDays)}</div><div className="stat-sub">head days ÷ days</div></div>
            <div className="stat-card"><div className="stat-label">Head In / Out</div><div className="stat-value">{report.total.in} / {report.total.out}</div><div className="stat-sub">arrived / left in period</div></div>
            <div className="stat-card"><div className="stat-label">Head Start → End</div><div className="stat-value">{report.total.start} → {report.total.end}</div><div className="stat-sub">{formatDate(startDate)} → {formatDate(report.end)}</div></div>
          </div>

          <div style={{display:'flex', gap:'10px', margin:'0 0 12px'}}>
            <button className="btn btn-secondary" onClick={() => exportCSV(false)}>⤓ Export Summary CSV</button>
            <button className="btn btn-ghost" onClick={() => exportCSV(true)}>⤓ Export With Animal Detail</button>
          </div>

          {report.rows.length === 0 ? (
            <div className="empty-state"><h3>No cattle on hand in this period</h3><p>{scopeLabel(scope, herds)} · {formatDate(startDate)} → {formatDate(report.end)}</p></div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>{GROUP_LABEL[groupBy]}</th><th style={{textAlign:'right'}}>Head Days</th><th style={{textAlign:'right'}}>Avg Head</th><th style={{textAlign:'right'}}>Start</th><th style={{textAlign:'right'}}>In</th><th style={{textAlign:'right'}}>Out</th><th style={{textAlign:'right'}}>End</th><th style={{textAlign:'right'}}>% of Head Days</th></tr></thead>
                <tbody>
                  {report.rows.map(g => (
                    <tr key={g.key} style={{cursor:'default'}}>
                      <td style={{color: g.key.startsWith('(') ? 'var(--ash)' : 'var(--hay)', fontStyle: g.key.startsWith('(') ? 'italic' : 'normal'}}>{g.key}</td>
                      <td className="td-mono" style={{textAlign:'right'}}>{n0(g.headDays)}</td>
                      <td className="td-mono" style={{textAlign:'right'}}>{n1(g.headDays / report.periodDays)}</td>
                      <td className="td-mono" style={{textAlign:'right'}}>{g.start}</td>
                      <td className="td-mono" style={{textAlign:'right', color:'var(--sky)'}}>{g.in}</td>
                      <td className="td-mono" style={{textAlign:'right', color:'var(--hay)'}}>{g.out}</td>
                      <td className="td-mono" style={{textAlign:'right'}}>{g.end}</td>
                      <td className="td-mono" style={{textAlign:'right', color:'var(--ash)'}}>{report.total.headDays ? (100 * g.headDays / report.total.headDays).toFixed(1) + '%' : '—'}</td>
                    </tr>
                  ))}
                  <tr style={{cursor:'default', borderTop:'2px solid rgba(58,125,123,0.4)'}}>
                    <td style={{...mono, fontSize:'12px', fontWeight:700}}>TOTAL</td>
                    <td className="td-mono" style={{textAlign:'right', fontWeight:700}}>{n0(report.total.headDays)}</td>
                    <td className="td-mono" style={{textAlign:'right', fontWeight:700}}>{n1(report.total.headDays / report.periodDays)}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{report.total.start}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{report.total.in}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{report.total.out}</td>
                    <td className="td-mono" style={{textAlign:'right'}}>{report.total.end}</td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
          )}

          <div style={{marginTop:'16px'}}>
            <div className="hc-note">Head days are counted in nights: the arrival day counts, the exit day doesn't. Arrival is purchase date, then birth date for raised cattle, then the day the record was entered.</div>
            {groupBy === 'project' && <div className="hc-note">Project days follow each animal's project history, so head transferred between projects are split on the transfer date. In/Out include transfers.</div>}
            {groupBy !== 'project' && <div className="hc-note">Enterprise and herd use each animal's <strong>current</strong> herd. Herd moves aren't recorded yet, so cattle that changed herds during the period have all their days counted where they are now.</div>}
            {report.clipped && <div className="hc-note">End date is after today — counted through {formatDate(report.end)}.</div>}
            {report.notes.noExit > 0 && <div className="hc-note">{report.notes.noExit} head are sold, dead or archived with no exit date, so they're left out. Give them a status date to count them.</div>}
            {report.notes.entered > 0 && <div className="hc-note">{report.notes.entered} head have no purchase or birth date, so their arrival is the day they were entered in RanchSavvy. Add purchase dates if they were here earlier.</div>}
          </div>
        </>
      )}
    </div>
  );
}

// ===== PROJECT / OWNER HEAD DAYS REPORT =====
// Same report for an owner: animal_ownership_history is turned into the project-history shape. Like the Head Count
// report, an animal's first owner on file is treated as owning it from arrival (owners are often assigned after the fact).
const ownershipAsHistory = (rows) => {
  const by = {};
  rows.forEach(o => (by[o.animal_id] = by[o.animal_id] || []).push({ id: o.id, owner: String(o.partnership_id), effective_date: hcDateOnly(o.effective_date) || HD_BEGIN }));
  Object.values(by).forEach(l => l.sort((x, y) => x.effective_date.localeCompare(y.effective_date) || x.id - y.id));
  Object.keys(by).forEach(k => {
    by[k] = by[k].map((o, i, l) => ({ id: o.id, effective_date: o.effective_date, to_project: o.owner, from_project: i ? l[i - 1].owner : o.owner }));
  });
  return by;
};

// One project, one period (defaults to last month): beginning inventory, every head in and out — purchases, births,
// transfers from/to other projects, sales, deaths — ending inventory, and head days. Built from project_history,
// so cattle are counted in whichever project they were in on each day.
const PRJ_EVENT = {
  purchase: { label: 'Purchased',     sign: '+', color: 'var(--sky)' },
  birth:    { label: 'Born',          sign: '+', color: 'var(--sage)' },
  entered:  { label: 'Entered (no date)', sign: '+', color: 'var(--ash)' },
  tin:      { label: 'Transfer In',   sign: '+', color: 'var(--sky)' },
  sold:     { label: 'Sold',          sign: '−', color: 'var(--hay)' },
  dead:     { label: 'Died',          sign: '−', color: '#e05555' },
  archived: { label: 'Archived',      sign: '−', color: 'var(--ash)' },
  tout:     { label: 'Transfer Out',  sign: '−', color: 'var(--hay)' },
};
const PRJ_IN = ['purchase', 'birth', 'entered', 'tin'], PRJ_OUT = ['sold', 'dead', 'archived', 'tout'];
const lastMonthRange = (today) => {
  const y = +today.slice(0, 4), m = +today.slice(5, 7);           // m is this month, 1-12
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  const start = `${py}-${String(pm).padStart(2, '0')}-01`;
  return { start, end: addDays(`${y}-${String(m).padStart(2, '0')}-01`, -1) };
};

function ProjectHeadDaysReport({ toast, herds, projects, partnerships = [] }) {
  const today = todayLocal();
  const lm = lastMonthRange(today);
  const [dim, setDim] = useState('project');           // 'project' | 'owner'
  const [project, setProject] = useState('');           // the selected project name, or owner (partnership) id
  const [startDate, setStartDate] = useState(lm.start);
  const [endDate, setEndDate] = useState(lm.end);
  const [data, setData] = useState(null);           // { animals, history }
  const [loadError, setLoadError] = useState('');
  const [exitInfo, setExitInfo] = useState({});     // animal_id -> { sale, death } for event notes

  const loadData = useCallback(async () => {
    setLoadError(''); setData(null);
    try {
      const [animals, hist, owners] = await Promise.all([
        fetchAllRows('animals', 'id, vid, eid, sex, herd_id, project, status, status_date, purchased, purchase_date, purchase_location, purchase_price_per_head, date_of_birth, created_at'),
        fetchAllRows('project_history', 'id, animal_id, from_project, to_project, effective_date'),
        fetchAllRows('animal_ownership_history', 'id, animal_id, partnership_id, effective_date'),
      ]);
      setData({ animals, history: groupProjectHistory(hist), ownerHist: ownershipAsHistory(owners) });
    } catch (err) {
      setLoadError(err.message);
    }
  }, []);
  useEffect(() => { loadData(); }, [loadData]);

  // Project or owner view: same timeline logic, different history
  const isOwner = dim === 'owner';
  const options = isOwner
    ? partnerships.map(p => ({ value: String(p.id), label: p.name + (p.is_active === false ? ' (inactive)' : ''), active: p.is_active !== false }))
    : projects.map(p => ({ value: p.name, label: p.name + (p.is_active ? '' : ' (archived)'), active: !!p.is_active }));
  const histFor = (a) => (isOwner ? data.ownerHist : data.history)[a.id];
  const animalFor = (a) => (isOwner ? { ...a, project: null } : a);   // no ownership rows = no owner
  const ownerName = (id) => partnerships.find(p => String(p.id) === String(id))?.name || 'unknown owner';
  const subjectName = isOwner ? ownerName(project) : project;
  const otherName = (v) => (v ? (isOwner ? ownerName(v) : v) : (isOwner ? 'no owner' : 'no project'));
  const DIM = isOwner ? 'Owner' : 'Project';
  const switchDim = (d) => { if (d !== dim) { setDim(d); setProject(''); } };

  // Default to the active project / owner with the most cattle in its history, so the report shows on the first click
  useEffect(() => {
    if (project || !data || !options.length) return;
    const counts = {};
    data.animals.forEach(a => { const ps = new Set([isOwner ? null : a.project, ...(histFor(a) || []).map(h => h.to_project)]); ps.forEach(p => { if (p) counts[p] = (counts[p] || 0) + 1; }); });
    const pick = [...options].sort((x, y) => (y.active - x.active) || (counts[y.value] || 0) - (counts[x.value] || 0))[0];
    if (pick) setProject(pick.value);
  }, [data, projects, partnerships, project, dim]);

  const herdName = (id) => herds.find(h => String(h.id) === String(id))?.name || '';
  const valid = !!project && !!startDate && !!endDate && startDate <= endDate;

  const report = useMemo(() => {
    if (!data || !valid) return null;
    const end = endDate > today ? today : endDate;
    const periodDays = hdDiff(startDate, addDays(end, 1));
    const events = [], animalsOut = [];
    const t = { headDays: 0, start: 0, end: 0, noExit: 0 };
    const counts = Object.fromEntries(Object.keys(PRJ_EVENT).map(k => [k, 0]));
    for (const a of data.animals) {
      const segs = projectSegments(animalFor(a), histFor(a));
      if (!segs) {
        const touched = (!isOwner && a.project === project) || (histFor(a) || []).some(h => h.to_project === project);
        if (touched && hcArrival(a).date <= end) t.noExit++;
        continue;
      }
      let days = 0, atStart = false, atEnd = false, touched = false;
      for (const sg of segs.filter(x => x.project === project)) {
        const pp = periodPart(sg.from, sg.to, startDate, end);
        if (!pp.days && !pp.atStart && !pp.came && !pp.went) continue;
        touched = true;
        days += pp.days;
        if (pp.atStart) { atStart = true; t.start++; }
        if (pp.atEnd) { atEnd = true; t.end++; }
        const base = { animalId: a.id, vid: a.vid || '', eid: a.eid || '', sex: a.sex, herd: herdName(a.herd_id) };
        if (pp.came) {
          const kind = sg.inKind === 'transfer' ? 'tin' : sg.inKind;
          counts[kind]++;
          const note = kind === 'tin' ? `from ${otherName(sg.fromProject)}`
            : kind === 'purchase' ? [a.purchase_price_per_head ? `$${Number(a.purchase_price_per_head).toLocaleString()}/hd` : '', a.purchase_location || ''].filter(Boolean).join(' · ') : '';
          events.push({ ...base, date: sg.from, kind, note });
        }
        if (pp.went) {
          const kind = sg.outKind === 'transfer' ? 'tout' : sg.outKind;
          counts[kind] = (counts[kind] || 0) + 1;
          events.push({ ...base, date: sg.to, kind, note: kind === 'tout' ? `to ${otherName(sg.toProject)}` : '' });
        }
      }
      t.headDays += days;
      if (touched) animalsOut.push({ animalId: a.id, vid: a.vid || '', eid: a.eid || '', sex: a.sex, herd: herdName(a.herd_id), status: a.status, atStart, atEnd, days });
    }
    const order = (k) => Object.keys(PRJ_EVENT).indexOf(k);
    events.sort((x, y) => x.date.localeCompare(y.date) || order(x.kind) - order(y.kind) || String(x.vid).localeCompare(String(y.vid), undefined, { numeric: true }));
    animalsOut.sort((x, y) => String(x.vid).localeCompare(String(y.vid), undefined, { numeric: true }));
    const totIn = PRJ_IN.reduce((n, k) => n + counts[k], 0), totOut = PRJ_OUT.reduce((n, k) => n + counts[k], 0);
    return { endDay: end, periodDays, events, animals: animalsOut, counts, totIn, totOut, ...t, clipped: end !== endDate };
  }, [data, project, dim, partnerships, startDate, endDate, today, valid]);

  // Sale location / death cause for the out events, fetched only for the head in this report
  useEffect(() => {
    if (!report) return;
    const ids = [...new Set(report.events.filter(e => e.kind === 'sold' || e.kind === 'dead').map(e => e.animalId))].filter(id => !(id in exitInfo));
    if (!ids.length) return;
    (async () => {
      const [sales, deaths] = await Promise.all([
        chunkedIn(ids, (chunk) => supabase.from('sale_animals').select('animal_id, sale_records(sale_date, sale_location, sale_type)').in('animal_id', chunk)),
        chunkedIn(ids, (chunk) => supabase.from('death_records').select('animal_id, death_date, cause_of_death').in('animal_id', chunk)),
      ]);
      const info = Object.fromEntries(ids.map(id => [id, {}]));
      (sales.data || []).forEach(x => { if (info[x.animal_id]) info[x.animal_id].sale = [x.sale_records?.sale_location, x.sale_records?.sale_type].filter(Boolean).join(' · '); });
      (deaths.data || []).forEach(x => { if (info[x.animal_id]) info[x.animal_id].death = x.cause_of_death || ''; });
      setExitInfo(prev => ({ ...prev, ...info }));
    })();
  }, [report]);
  const noteFor = (e) => e.note || (e.kind === 'sold' ? exitInfo[e.animalId]?.sale : e.kind === 'dead' ? exitInfo[e.animalId]?.death : '') || '';

  const exportCSV = () => {
    if (!report) return;
    const r = report, calcEnd = r.start + r.totIn - r.totOut;
    const L = [
      [`Ranch Savvy — ${DIM} Head Days`], [DIM, subjectName], ['Period', `${startDate} to ${r.endDay}`, `${r.periodDays} days`], ['Generated', new Date().toLocaleString()], [],
      ['SUMMARY', 'Head'],
      [`Beginning inventory (on hand end of ${addDays(startDate, -1)})`, r.start],
      ...PRJ_IN.filter(k => r.counts[k] || k !== 'entered').map(k => [`+ ${PRJ_EVENT[k].label}`, r.counts[k]]),
      ...PRJ_OUT.filter(k => r.counts[k] || k !== 'archived').map(k => [`− ${PRJ_EVENT[k].label}`, r.counts[k]]),
      [`Ending inventory (on hand end of ${r.endDay})`, r.end],
      ['Check: beginning + in − out', calcEnd, calcEnd === r.end ? 'reconciled' : 'DOES NOT RECONCILE'],
      [],
      ['Total head days', r.headDays],
      ['Average head', (r.headDays / r.periodDays).toFixed(1)],
      ...(r.noExit ? [['Head left out (gone with no exit date)', r.noExit]] : []),
      [],
      ['EVENTS'], ['Date', 'Event', '+/−', 'VID', 'EID', 'Sex', 'Current Herd', 'Detail'],
      ...r.events.map(e => [e.date, PRJ_EVENT[e.kind].label, PRJ_EVENT[e.kind].sign === '+' ? '+1' : '-1', e.vid, e.eid, e.sex, e.herd, noteFor(e)]),
      [],
      ['ANIMALS'], ['VID', 'EID', 'Sex', 'Current Herd', 'Status Now', 'In Beginning Inventory', 'In Ending Inventory', 'Head Days In Period'],
      ...r.animals.map(a => [a.vid, a.eid, a.sex, a.herd, a.status, a.atStart ? 'Y' : '', a.atEnd ? 'Y' : '', a.days]),
    ];
    const blob = new Blob([L.map(row => row.map(csvCell).join(',')).join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = `${subjectName.replace(/[^\w-]+/g, '_')}_head_days_${startDate}_${r.endDay}.csv`; link.click();
    URL.revokeObjectURL(url);
  };

  const n0 = (v) => Math.round(v).toLocaleString('en-US');
  const r = report;
  const calcEnd = r ? r.start + r.totIn - r.totOut : 0;
  return (
    <div>
      <div className="detail-card" style={{marginBottom:'20px'}}>
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(170px, 1fr))', gap:'14px', alignItems:'end'}}>
          <div className="form-group" style={{margin:0}}><label className="form-label">Report By</label>
            <div style={{display:'flex', borderRadius:'4px', overflow:'hidden', border:'1px solid rgba(58,125,123,0.4)'}}>
              {[['project', 'Project'], ['owner', 'Owner']].map(([d, l]) => (
                <button key={d} onClick={() => switchDim(d)} style={{flex:1, padding:'9px', border:'none', cursor:'pointer', fontFamily:'IBM Plex Mono, monospace', fontSize:'12px', letterSpacing:'1px', textTransform:'uppercase', background: dim === d ? 'var(--rust)' : 'transparent', color: dim === d ? 'var(--cream)' : 'var(--ash)'}}>{l}</button>
              ))}
            </div>
          </div>
          <div className="form-group" style={{margin:0}}><label className="form-label">{DIM}</label>
            <select className="form-select" value={project} onChange={e => setProject(e.target.value)}>
              {!options.length && <option value="">{isOwner ? 'No owners yet — add them under Partnerships' : 'No projects yet — add them under Animals → Projects'}</option>}
              {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
          </div>
          <div className="form-group" style={{margin:0}}><label className="form-label">Start</label><input className="form-input" type="date" value={startDate} max={today} onChange={e => setStartDate(e.target.value)} /></div>
          <div className="form-group" style={{margin:0}}><label className="form-label">End</label><input className="form-input" type="date" value={endDate} max={today} onChange={e => setEndDate(e.target.value)} /></div>
        </div>
        <div style={{display:'flex', gap:'8px', marginTop:'12px', flexWrap:'wrap', alignItems:'center'}}>
          <button className="btn btn-ghost" style={{padding:'5px 12px', fontSize:'12px'}} onClick={() => { setStartDate(lm.start); setEndDate(lm.end); }}>Last month</button>
          <button className="btn btn-ghost" style={{padding:'5px 12px', fontSize:'12px'}} onClick={() => { setStartDate(today.slice(0, 8) + '01'); setEndDate(today); }}>Month to date</button>
          <button className="btn btn-ghost" style={{padding:'5px 12px', fontSize:'12px'}} onClick={() => { setStartDate(today.slice(0, 4) + '-01-01'); setEndDate(today); }}>Year to date</button>
          {r && <button className="btn btn-primary" style={{marginLeft:'auto'}} onClick={exportCSV}>⤓ Export Report</button>}
        </div>
        {startDate > endDate && <p style={{color:'#e05555', fontSize:'13px', marginTop:'10px'}}>Start is after end.</p>}
      </div>

      {loadError ? (
        <div className="detail-card">
          <div className="hc-note" style={{borderLeftColor:'#e05555'}}>Couldn't load project data: {loadError}</div>
          {/project/.test(loadError) && <>
            <p style={{fontSize:'13px', color:'var(--ash)', margin:'12px 0 8px'}}>Project history isn't set up yet. Run this in Supabase → SQL Editor (safe to re-run), then try again.</p>
            <textarea readOnly value={PROJECTS_SQL} onFocus={e => e.target.select()} style={{width:'100%', height:'200px', fontFamily:'IBM Plex Mono', fontSize:'11px', color:'var(--cream)', background:'var(--charcoal)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'4px', padding:'8px'}} />
            <button className="btn btn-ghost" style={{marginTop:'6px'}} onClick={() => { navigator.clipboard?.writeText(PROJECTS_SQL); toast('SQL copied', 'success'); }}>Copy SQL</button>
          </>}
          <button className="btn btn-secondary" style={{marginTop:'12px', marginLeft:'8px'}} onClick={loadData}>Try again</button>
        </div>
      ) : !data ? (
        <div className="loading"><div className="spinner"></div> Loading project data...</div>
      ) : r && (
        <>
          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Head Days</div><div className="stat-value">{n0(r.headDays)}</div><div className="stat-sub">{r.periodDays} days · avg {(r.headDays / r.periodDays).toFixed(1)} hd</div></div>
            <div className="stat-card"><div className="stat-label">Beginning</div><div className="stat-value">{r.start}</div><div className="stat-sub">end of {formatDate(addDays(startDate, -1))}</div></div>
            <div className="stat-card"><div className="stat-label">In / Out</div><div className="stat-value"><span style={{color:'var(--sky)'}}>+{r.totIn}</span> <span style={{color:'var(--hay)'}}>−{r.totOut}</span></div><div className="stat-sub">incl. transfers</div></div>
            <div className="stat-card"><div className="stat-label">Ending</div><div className="stat-value">{r.end}</div><div className="stat-sub">end of {formatDate(r.endDay)}</div></div>

          <div className="detail-card" style={{marginBottom:'16px'}}>
            <h3>Inventory Reconciliation</h3>
            <div className="detail-row"><span className="detail-key">Beginning inventory</span><span className="detail-val td-mono">{r.start}</span></div>

            {PRJ_OUT.filter(k => r.counts[k] || k !== 'archived').map(k => <div key={k} className="detail-row"><span className="detail-key">− {PRJ_EVENT[k].label}</span><span className="detail-val td-mono" style={{color: r.counts[k] ? PRJ_EVENT[k].color : 'var(--ash)'}}>{r.counts[k]}</span></div>)}
            <div className="detail-row" style={{borderTop:'1px solid rgba(58,125,123,0.4)'}}><span className="detail-key" style={{fontWeight:700}}>Ending inventory</span><span className="detail-val td-mono" style={{fontWeight:700}}>{r.end}</span></div>
            <div style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', marginTop:'8px', color: calcEnd === r.end ? 'var(--sage)' : 'var(--hay)'}}>{calcEnd === r.end ? '✓ RECONCILED' : `⚠ ${r.start} + ${r.totIn} − ${r.totOut} = ${calcEnd}, ending shows ${r.end}`}</div>
          </div>

          {r.events.length === 0 ? (
            <div className="empty-state"><h3>No head in or out</h3><p>{r.start ? `${r.start} head carried through ${formatDate(startDate)} – ${formatDate(r.endDay)} with no changes.` : `Nothing ${isOwner ? 'owned by' : 'in'} ${subjectName} during this period.`}</p></div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Date</th><th>Event</th><th style={{textAlign:'center'}}>+/−</th><th>VID</th><th>EID</th><th>Sex</th><th>Herd</th><th>Detail</th></tr></thead>
                <tbody>
                  {r.events.map((e, i) => (
                    <tr key={i} style={{cursor:'default'}}>
                      <td className="td-mono" style={{fontSize:'12px'}}>{e.date}</td>
                      <td style={{color: PRJ_EVENT[e.kind].color, fontSize:'12px', fontFamily:'IBM Plex Mono, monospace'}}>{PRJ_EVENT[e.kind].label.toUpperCase()}</td>
                      <td style={{textAlign:'center', fontWeight:700, color: PRJ_EVENT[e.kind].color}}>{PRJ_EVENT[e.kind].sign}</td>
                      <td className="td-mono">{e.vid || '—'}</td>
                      <td style={{fontFamily:'IBM Plex Mono', fontSize:'11px', color:'var(--ash)'}}>{e.eid || '—'}</td>
                      <td style={{fontSize:'12px'}}>{sexLabel(e.sex)}</td>
                      <td style={{fontSize:'12px', color:'var(--ash)'}}>{e.herd || '—'}</td>
                      <td style={{fontSize:'12px', color:'var(--ash)'}}>{noteFor(e) || '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div style={{marginTop:'16px'}}>
            <div className="hc-note">Head days are nights {isOwner ? 'owned' : 'in the project'}: the day an animal arrives or transfers in counts, the day it leaves or transfers out doesn't. The export adds a per-animal list with each head's days.</div>
            {isOwner && <div className="hc-note">Owner transfers come from ownership changes and their effective dates. An animal's first owner on file counts from the day it arrived, since owners are often assigned after the fact. Head days are whole head per owner, not split by partnership shares.</div>}
            {r.clipped && <div className="hc-note">End date is after today — counted through {formatDate(r.endDay)}.</div>}
            {r.noExit > 0 && <div className="hc-note">{r.noExit} head tied to this project are sold, dead or archived with no exit date, so they're left out. Give them a status date to count them.</div>}
            {r.counts.entered > 0 && <div className="hc-note">{r.counts.entered} head have no purchase or birth date, so they arrive on the day they were entered in RanchSavvy. Add purchase dates to fix their head days.</div>}
          </div>
        </>
      )}
    </div>
  );
}

    const { data: calvingData, error: calvRepErr } = await chunkedIn(scopeAnimals.map(a => a.id), (chunk) => supabase.from('calving_records').select('*').in('dam_id', chunk).gte('calving_date', startDate).lte('calving_date', endDate).order('calving_date', { ascending: false }).limit(10000));
    if (calvRepErr) { toast('Error loading calving records: ' + calvRepErr.message, 'error'); return; }
    calvingData?.sort((a, b) => (b.calving_date || '').localeCompare(a.calving_date || ''));
    const rows = [`Ranch Savvy - Calving Records Report`, `${reportScope === 'herd' ? 'Herd' : 'Owner'}: ${scopeName}`, `Period: ${startDate} to ${endDate}`, ``, `Calving Date,Dam VID,Calf Sex,Calf Status,Udder Score,Calving Ease,Notes`];
    calvingData?.forEach(c => { const dam = scopeAnimals.find(a => a.id === c.dam_id); rows.push([c.calving_date, dam?.vid || '', c.calf_sex, c.calf_status, c.udder_score || '', c.calving_ease?.replace(/_/g, ' ') || '', `"${(c.notes || '').replace(/"/g, '""')}"`].join(',')); });

    const blob = new Blob([rows.join('\n')], { type: 'text/csv' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `ranch_savvy_calving_${scopeName}_${startDate}_${endDate}.csv`; a.click(); URL.revokeObjectURL(url);

            fontSize:'12px', fontWeight:'700', fontFamily:'IBM Plex Mono, monospace',
            letterSpacing:'1.5px', textTransform:'uppercase', transition:'color 0.15s',
          }}>
            {tab.label}
          </button>
        ))}
      </div>

      {activeTab === 'project_days' && (
        <ProjectHeadDaysReport toast={toast} herds={herds} projects={projects} partnerships={partnerships} />

      {activeTab === 'inventory_change' && (
        <InventoryChangeReport toast={toast} herds={herds} projects={projects} />
      )}

      {activeTab === 'head_count' && (

      )}

      {activeTab === 'head_days' && (
        <HeadDaysReport toast={toast} herds={herds} projects={projects} />
      )}

      {activeTab === 'calving' && (
        <div>
          <div className="detail-card" style={{maxWidth:'600px'}}>
            <h3>Calving Records Export</h3>
            <div className="form-group"><label className="form-label">Report Scope</label><select className="form-select" value={reportScope} onChange={e => setReportScope(e.target.value)}><option value="herd">By Herd</option><option value="owner">By Owner</option></select></div>
            {reportScope === 'herd' && <div className="form-group"><label className="form-label">Select Herd</label><select className="form-select" value={selectedHerd} onChange={e => setSelectedHerd(e.target.value)}><option value="">Choose a herd...</option>{herds.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}</select></div>}
            {reportScope === 'owner' && <div className="form-group"><label className="form-label">Select Owner</label><select className="form-select" value={selectedOwner} onChange={e => setSelectedOwner(e.target.value)}><option value="">Choose an owner...</option>{partnerships.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
            <div className="form-grid">
              <div className="form-group"><label className="form-label">Start Date</label><input className="form-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></div>
              <div className="form-group"><label className="form-label">End Date</label><input className="form-input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></div>
            </div>
            <button className="btn btn-primary" onClick={generateReport} disabled={generating} style={{marginTop:'8px', width:'100%'}}>{generating ? 'Generating...' : '⤓ Export Calving CSV'}</button>

      )}

      {activeTab === 'summary' && (
        <div>
          <div className="detail-card" style={{maxWidth:'600px'}}>

            <div className="form-group"><label className="form-label">Report Scope</label><select className="form-select" value={reportScope} onChange={e => setReportScope(e.target.value)}><option value="herd">By Herd</option><option value="owner">By Owner</option></select></div>
            {reportScope === 'herd' && <div className="form-group"><label className="form-label">Select Herd</label><select className="form-select" value={selectedHerd} onChange={e => setSelectedHerd(e.target.value)}><option value="">Choose a herd...</option>{herds.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}</select></div>}
            {reportScope === 'owner' && <div className="form-group"><label className="form-label">Select Owner</label><select className="form-select" value={selectedOwner} onChange={e => setSelectedOwner(e.target.value)}><option value="">Choose an owner...</option>{partnerships.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
            <div className="form-grid">
              <div className="form-group"><label className="form-label">Start Date</label><input className="form-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></div>
              <div className="form-group"><label className="form-label">End Date</label><input className="form-input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></div>

            <button className="btn btn-primary" onClick={generateSummaryReport} disabled={generating} style={{marginTop:'8px', width:'100%'}}>{generating ? 'Generating...' : '⤓ Export Summary CSV'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ===== LOGS PAGE =====
// SF-ENGINE-START
// ===== STOCK FLOW PLANNING — calculation engine (pure functions, no React / Supabase) =====
// A plan is a list of CLASSES (old cows, H1, steer calves...) and MOVEMENTS (sales, purchases, class transfers,
// transfers out of the division). Breeding classes run the breeding-statistics waterfall
// (open → deaths → live → dry → wet → culls → exposed → open → pregnant & kept), and their wet count
// becomes calf births. Everything is kept fractional and only rounded for display, same as the spreadsheet.
const SF_REASONS = ['cull', 'open', 'dry', 'other'];
const SF_KIND_LABEL = { breeding: 'Breeding females', bulls: 'Bulls', growing: 'Calves / growing' };
const SF_MOVE_LABEL = { sale: 'Sale', purchase: 'Purchase', transfer: 'Class transfer', out_div: 'Transfer out of division', in_div: 'Transfer in from division' };
const SF_QTY_LABEL = { fixed: 'Fixed head', auto: 'Auto (breeding stats)', pk: 'Pregnant & kept', remaining: 'All remaining' };
const sfNum = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sfHas = (v) => v !== '' && v !== null && v !== undefined && isFinite(parseFloat(v));
const sfMi = (v) => { const n = parseInt(v, 10); return isFinite(n) ? Math.min(11, Math.max(0, n)) : 0; };
const sfId = () => Math.random().toString(36).slice(2, 10);
const sfMonthList = (startMonth) => {
  const [y, m] = String(startMonth || '2026-12').split('-').map(Number);
  return Array.from({ length: 12 }, (_, i) => {
    const d = new Date(y, m - 1 + i, 1);
    return { key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, label: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) };
  });
};
const sfAddMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
const sfPerHead = (mv) => sfNum(mv.perHead) > 0 ? sfNum(mv.perHead) : sfNum(mv.weight) * sfNum(mv.price) / 100;
const sfShare = (c) => sfHas(c?.sharePct) ? sfNum(c.sharePct) / 100 : 1;

function computeStockFlow(data) {
  const classes = data.classes || [];
  const byId = Object.fromEntries(classes.map(c => [c.id, c]));
  const months = sfMonthList(data.startMonth);
  const warnings = [];
  const R = {};
  const blankFlows = () => Array.from({ length: 12 }, () => ({ in: 0, out: 0 }));

  // ── 1. Breeding waterfall + empty result shells ──
  classes.forEach(c => {
    const r = R[c.id] = { open: sfNum(c.open), births: 0, purchases: 0, sales: { cull: 0, open: 0, dry: 0, other: 0 }, salesTotal: 0,
      deaths: 0, xferOut: 0, xferIn: 0, outDiv: 0, inDiv: 0, bornMonth: null, flows: blankFlows() };
    if (c.kind === 'breeding') {
      r.wfDeaths = r.open * sfNum(c.deathPct) / 100;
      r.live = r.open - r.wfDeaths;
      r.dry = r.live * sfNum(c.dryPct) / 100;
      r.wet = r.live - r.dry;
      r.culls = r.wet * sfNum(c.cullPct) / 100;
      r.exposed = r.wet - r.culls;
      r.opens = r.exposed * sfNum(c.openPct) / 100;
      r.pk = r.exposed - r.opens;
    }
  });

  // ── 2. Births: a calving class's wet cows become calves in its linked heifer / steer calf classes ──
  const birthsBySire = {};
  classes.forEach(c => {
    if (c.kind !== 'breeding' || !c.calves) return;
    const r = R[c.id], cm = sfMi(c.calvingMonth), hp = sfHas(c.heiferPct) ? sfNum(c.heiferPct) / 100 : 0.5;
    const give = (cid, n) => {
      if (!cid || !R[cid]) { if (n > 0.01) warnings.push(`${c.name}: ${cid ? 'linked calf class is missing' : 'no calf class linked'} — ${Math.round(n)} calves not tracked`); return; }
      R[cid].births += n; R[cid].bornMonth = R[cid].bornMonth === null ? cm : Math.min(R[cid].bornMonth, cm);
      R[cid].flows[cm].in += n;
    };
    give(c.heiferClassId, r.wet * hp);
    give(c.steerClassId, r.wet * (1 - hp));
    const sg = c.sireGroup || 'Unspecified';
    birthsBySire[sg] = (birthsBySire[sg] || 0) + r.wet;
  });

  // ── 3. Movements. Breeding culls/opens/drys always leave as sales: add a virtual unpriced row if none was set up ──
  const moves = (data.moves || []).filter(m => byId[m.classId]).map(m => ({ ...m, qty: 0 }));
  classes.forEach(c => {
    if (c.kind !== 'breeding') return;
    const r = R[c.id];
    [['cull', r.culls], ['open', r.opens], ['dry', r.dry]].forEach(([reason, n]) => {
      if (n > 0.0001 && !moves.some(m => m.classId === c.id && m.type === 'sale' && m.reason === reason && m.qtyMode === 'auto'))
        moves.push({ id: `v-${c.id}-${reason}`, classId: c.id, type: 'sale', reason, qtyMode: 'auto', month: 11, virtual: true, qty: 0 });
    });
  });
  const isIn = (m, cid) => (m.type === 'transfer' && m.toClassId === cid);
  const outTypes = ['sale', 'transfer', 'out_div'];
  const deathOf = (c, r, purch) => {
    if (c.kind === 'breeding') return r.wfDeaths;
    if (sfHas(c.deathQty)) return sfNum(c.deathQty);
    return (r.open + r.births + purch) * sfNum(c.deathPct) / 100;
  };
  // Resolve quantities. "All remaining" depends on other rows (incl. transfers in), so iterate until stable.
  for (let pass = 0; pass < 12; pass++) {
    let changed = false;
    moves.forEach(m => {
      const c = byId[m.classId], r = R[c.id];
      let q = 0;
      const mode = m.qtyMode || 'fixed';
      if (mode === 'fixed') q = sfNum(m.qtyFixed);
      else if (mode === 'auto') q = c.kind === 'breeding' ? ({ cull: r.culls, open: r.opens, dry: r.dry }[m.reason] || 0) : 0;
      else if (mode === 'pk') q = c.kind === 'breeding' ? r.pk : 0;
      else if (mode === 'remaining') {
        const purch = moves.filter(x => x.classId === c.id && (x.type === 'purchase' || x.type === 'in_div')).reduce((s, x) => s + x.qty, 0);
        const xin = moves.filter(x => isIn(x, c.id)).reduce((s, x) => s + x.qty, 0);
        const otherOut = moves.filter(x => x !== m && x.classId === c.id && outTypes.includes(x.type)).reduce((s, x) => s + x.qty, 0);
        q = Math.max(0, r.open + r.births + purch + xin - deathOf(c, r, purch) - otherOut);
      }
      if (Math.abs(q - m.qty) > 1e-9) { m.qty = q; changed = true; }
    });
    if (!changed) break;
  }

  // ── 4. Roll movements into class totals, monthly flows and dollars ──
  const divs = {};
  const divOf = (c) => c?.division || 'Unassigned';
  const D = (name) => divs[name] = divs[name] || { name, openValue: 0, closeValue: 0, sales: 0, purchases: 0, outDiv: 0, inDiv: 0, otherIncome: 0, costs: 0,
    my: { openValue: 0, closeValue: 0, sales: 0, purchases: 0, outDiv: 0, inDiv: 0 }, auMonths: 0, breedingOpen: 0, head: 0 };
  (data.divisions || []).forEach(D);
  const cash = { sales: Array(12).fill(0), purchases: Array(12).fill(0), income: Array(12).fill(0), costs: Array(12).fill(0) };
  const cashByDiv = {};
  const CD = (n) => cashByDiv[n] = cashByDiv[n] || { sales: Array(12).fill(0), purchases: Array(12).fill(0), income: Array(12).fill(0), costs: Array(12).fill(0) };
  moves.forEach(m => {
    const c = byId[m.classId], r = R[c.id], mo = sfMi(m.month), q = m.qty;
    m.perHeadCalc = sfPerHead(m); m.gross = q * m.perHeadCalc; m.unpriced = q > 0.01 && !(m.perHeadCalc > 0);
    const dv = D(divOf(c)), sh = sfShare(c);
    if (m.type === 'sale') {
      r.sales[SF_REASONS.includes(m.reason) ? m.reason : 'other'] += q; r.salesTotal += q; r.flows[mo].out += q;
      dv.sales += m.gross; dv.my.sales += m.gross * sh; cash.sales[mo] += m.gross; CD(dv.name).sales[mo] += m.gross;
    } else if (m.type === 'purchase') {
      r.purchases += q; r.flows[mo].in += q;
      dv.purchases += m.gross; dv.my.purchases += m.gross * sh; cash.purchases[mo] += m.gross; CD(dv.name).purchases[mo] += m.gross;
    } else if (m.type === 'transfer') {
      const t = byId[m.toClassId];
      if (!t) { warnings.push(`${c.name}: transfer has no destination class — ${Math.round(q)} head drop out of the plan`); r.xferOut += q; r.flows[mo].out += q; return; }
      const rt = R[t.id];
      r.flows[mo].out += q; rt.flows[mo].in += q;
      if (divOf(t) !== divOf(c)) {        // crossing divisions: valued like a sale/purchase between enterprises
        r.outDiv += q; rt.inDiv += q; m.crossDiv = true;
        dv.outDiv += m.gross; dv.my.outDiv += m.gross * sh;
        const dt = D(divOf(t)); dt.inDiv += m.gross; dt.my.inDiv += m.gross * sfShare(t);
      } else { r.xferOut += q; rt.xferIn += q; }
    } else if (m.type === 'out_div') {
      r.outDiv += q; r.flows[mo].out += q; dv.outDiv += m.gross; dv.my.outDiv += m.gross * sh;
    } else if (m.type === 'in_div') {
      r.inDiv += q; r.flows[mo].in += q; dv.inDiv += m.gross; dv.my.inDiv += m.gross * sh;
    }
  });

  // ── 5. Deaths (spread evenly over the months the class has cattle unless a month is set) and close ──
  classes.forEach(c => {
    const r = R[c.id];
    r.deaths = deathOf(c, r, r.purchases + r.inDiv);
    const first = r.bornMonth !== null && r.open < 0.0001 ? r.bornMonth : 0;
    if (sfHas(c.deathMonth)) r.flows[sfMi(c.deathMonth)].out += r.deaths;
    else for (let i = first; i < 12; i++) r.flows[i].out += r.deaths / (12 - first);
    r.close = r.open + r.births + r.purchases + r.xferIn + r.inDiv - r.salesTotal - r.deaths - r.xferOut - r.outDiv;
    if (r.close < -0.5) warnings.push(`${c.name}: more head leave than the class has — closes at ${Math.round(r.close)}`);
    // monthly head (end of month) and AU-months (average of start & end of month)
    let h = r.open; r.headEnd = []; r.auMonths = [];
    const au = sfNum(c.au), auFrom = sfMi(c.auStartMonth);
    for (let i = 0; i < 12; i++) {
      const start = h; h = h + r.flows[i].in - r.flows[i].out;
      r.headEnd.push(h); r.auMonths.push(i >= auFrom ? Math.max(0, (start + h) / 2) * au : 0);
      if (h < -0.5) warnings.push(`${c.name}: head count goes negative in ${months[i].label} — check movement months`);
    }
    const dv = D(divOf(c)), sh = sfShare(c);
    r.openValue = r.open * sfNum(c.value);
    r.closeValue = r.close * (sfHas(c.closeValue) ? sfNum(c.closeValue) : sfNum(c.value));
    dv.openValue += r.openValue; dv.closeValue += r.closeValue;
    dv.my.openValue += r.openValue * sh; dv.my.closeValue += r.closeValue * sh;
    dv.auMonths += r.auMonths.reduce((s, x) => s + x, 0);
    if (c.kind === 'breeding') dv.breedingOpen += r.open;
    dv.head += r.open;
  });

  // ── 6. Other income / direct costs ledger ──
  (data.ledger || []).forEach(l => {
    const dv = D(l.division || 'Unassigned'), amt = sfNum(l.amount), inc = l.kind === 'income';
    if (inc) dv.otherIncome += amt; else dv.costs += amt;
    const put = (arr, a2) => { if (l.month === 'spread' || !sfHas(l.month)) for (let i = 0; i < 12; i++) arr[i] += a2 / 12; else arr[sfMi(l.month)] += a2; };
    put(inc ? cash.income : cash.costs, amt); put(inc ? CD(dv.name).income : CD(dv.name).costs, amt);
  });

  // ── 7. Trading account and gross margin per division ──
  const opp = sfNum(data.oppRate) / 100;
  Object.values(divs).forEach(d => {
    d.grossProduct = d.closeValue + d.sales + d.otherIncome + d.outDiv - d.inDiv - d.openValue - d.purchases;
    d.oppInterest = d.openValue * opp;
    d.directCosts = d.costs + d.oppInterest;
    d.grossMargin = d.grossProduct - d.directCosts;
    d.avgAU = d.auMonths / 12;
    d.my.grossProduct = d.my.closeValue + d.my.sales + d.otherIncome + d.my.outDiv - d.my.inDiv - d.my.openValue - d.my.purchases;
    d.my.oppInterest = d.my.openValue * opp;
    d.my.grossMargin = d.my.grossProduct - d.costs - d.my.oppInterest;
  });

  // ── 8. Breeding summary, per division (stocker heifers shouldn't dilute the cow herd's index) ──
  const breedStats = (inDiv) => {
    const breeding = classes.filter(c => c.kind === 'breeding' && inDiv(c));
    const calfIds = new Set(breeding.filter(c => c.calves).flatMap(c => [c.heiferClassId, c.steerClassId]).filter(id => id && R[id]));
    const born = breeding.filter(c => c.calves).reduce((s, c) => s + R[c.id].wet, 0);
    const calfDeaths = [...calfIds].reduce((s, id) => s + R[id].deaths, 0);
    const breedingOpen = breeding.reduce((s, c) => s + R[c.id].open, 0);
    const exposed = breeding.reduce((s, c) => s + R[c.id].exposed, 0);
    const bulls = classes.filter(c => c.kind === 'bulls' && inDiv(c)).reduce((s, c) => s + R[c.id].open, 0);
    return { born, weaned: born - calfDeaths, breedingOpen, exposed, bulls,
      indexBorn: breedingOpen ? born / breedingOpen : 0, indexWeaned: breedingOpen ? (born - calfDeaths) / breedingOpen : 0 };
  };
  const breedingByDiv = {};
  [...new Set(classes.filter(c => c.kind === 'breeding').map(divOf))].forEach(n => { breedingByDiv[n] = breedStats(c => divOf(c) === n); });
  const auTotal = Array.from({ length: 12 }, (_, i) => classes.reduce((s, c) => s + R[c.id].auMonths[i], 0));

  return { months, classes: R, moves, divisions: divs, cash, cashByDiv, warnings: [...new Set(warnings)], auTotal,
    breeding: { ...breedStats(() => true), birthsBySire, byDiv: breedingByDiv } };
}

// Monthly in/out per class, so plan-to-date can be compared with what RS shows actually happened.
const sfPlannedToDate = (r, idx) => {
  let inn = 0, out = 0;
  for (let i = 0; i <= Math.min(idx, 11); i++) { inn += r.flows[i].in; out += r.flows[i].out; }
  return { in: inn, out, head: idx < 0 ? r.open : r.headEnd[Math.min(idx, 11)] };
};

// A summary frozen when the plan is locked as the original budget.
const sfSnapshot = (res) => ({
  byClass: Object.fromEntries(Object.entries(res.classes).map(([id, r]) => [id, { open: r.open, births: r.births, purchases: r.purchases, sales: r.salesTotal, deaths: r.deaths, close: r.close }])),
  divisions: Object.fromEntries(Object.values(res.divisions).map(d => [d.name, { sales: d.sales, grossProduct: d.grossProduct, grossMargin: d.grossMargin }])),
  auTotal: res.auTotal,
});
