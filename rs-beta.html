// ===== STOCK FLOW PLANNING — UI =====
// Plans live in one table (stock_plans, inputs as jsonb). RS inventory stays the official record:
// the Plan vs Actual tab reads animals/calvings/preg checks live and never writes to them.
const STOCK_PLANS_SQL = `-- Run once in Supabase → SQL Editor. Stores stock flow plans (inputs as jsonb). Safe to re-run.
create table if not exists public.stock_plans (
  id bigint generated always as identity primary key,
  name text not null,
  plan_year integer,
  start_month text not null,
  status text not null default 'draft' check (status in ('draft','active','closed')),
  data jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
alter table public.stock_plans enable row level security;
drop policy if exists "authenticated full access" on public.stock_plans;
create policy "authenticated full access" on public.stock_plans for all to authenticated using (true) with check (true);`;

const sf0 = (n) => Math.round(n || 0).toLocaleString('en-US');
const sf1 = (n) => (Math.round((n || 0) * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const sf$ = (n) => (n < -0.5 ? '−' : '') + '$' + Math.round(Math.abs(n || 0)).toLocaleString('en-US');
const sfPct = (n) => ((n || 0) * 100).toFixed(1) + '%';
const SF_SEXES = ['cow', 'heifer', 'bull', 'steer', 'calf_female', 'calf_male'];
const sfPlanYear = (startMonth) => Number(sfAddMonths(startMonth, 11).slice(0, 4));
const sfDownload = (name, rows) => {
  const blob = new Blob([rows.map(r => r.map(csvCell).join(',')).join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
};
const SF_DEFAULT_RATES = { deathPct: 1, dryPct: 3, cullPct: 5, openPct: 8 };
const sfNewClass = (o = {}) => ({ id: sfId(), name: 'New class', division: 'Cow/Calf', kind: 'growing', open: 0, deathPct: 1, deathQty: '', au: 1, auStartMonth: 0,
  value: '', closeValue: '', sharePct: 100, herdIds: [], sexes: [], ...o });
const sfNewBreedingSet = (name, division, extra = {}) => {
  const cow = sfNewClass({ name, division, kind: 'breeding', ...SF_DEFAULT_RATES, calves: true, calvingMonth: 5, heiferPct: 50, sireGroup: '', au: 1, ...extra });
  const hfr = sfNewClass({ name: `${name} – hfr calves`, division, deathPct: 2, au: 0.5, auStartMonth: 10, herdIds: [...(cow.herdIds || [])], sexes: cow.herdIds?.length ? ['calf_female'] : [] });
  const str = sfNewClass({ name: `${name} – str calves`, division, deathPct: 2, au: 0.5, auStartMonth: 10, herdIds: [...(cow.herdIds || [])], sexes: cow.herdIds?.length ? ['calf_male'] : [] });
  cow.heiferClassId = hfr.id; cow.steerClassId = str.id;
  return [cow, hfr, str];
};

// Number box that lets you type "1." or clear the field without fighting React
function SfNum({ value, onChange, width = 64, placeholder, disabled, title }) {
  const [txt, setTxt] = useState(value ?? '');
  const [focus, setFocus] = useState(false);
  useEffect(() => { if (!focus) setTxt(value === null || value === undefined ? '' : String(value)); }, [value, focus]);
  return <input className="sf-in" style={{ width }} value={txt} disabled={disabled} placeholder={placeholder} title={title}
    onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
    onChange={e => { const v = e.target.value.replace(/[,$]/g, ''); if (!/^-?\d*\.?\d*$/.test(v)) return; setTxt(v); onChange(v === '' || v === '-' || v === '.' ? '' : parseFloat(v)); }} />;
}
function SfMonthSel({ value, onChange, months, allowSpread, allowBlank }) {
  return <select className="sf-sel" value={value ?? ''} onChange={e => onChange(e.target.value === '' || e.target.value === 'spread' ? e.target.value : Number(e.target.value))}>
    {allowBlank && <option value="">{allowBlank}</option>}
    {allowSpread && <option value="spread">Spread 12 mo</option>}
    {months.map((m, i) => <option key={i} value={i}>{m.label}</option>)}

}

      fontSize: '11px', fontWeight: 700, fontFamily: 'IBM Plex Mono, monospace', letterSpacing: '1.5px', textTransform: 'uppercase' }}>{t.label}</button>)}

);
const SfStat = ({ label, value, sub }) => (
  <div className="stat-card"><div className="stat-label">{label}</div><div className="stat-value" style={{ fontSize: '24px' }}>{value}</div>{sub && <div className="stat-sub">{sub}</div>}</div>

function PlanningPage({ toast }) {
  const [ready, setReady] = useState(null);           // null = loading, false = table missing
  const [plans, setPlans] = useState([]);
  const [herds, setHerds] = useState([]);
  const [plan, setPlan] = useState(null);             // { id, name, status, data }
  const [dirty, setDirty] = useState(false);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState('breeding');
  const [showNew, setShowNew] = useState(false);

  const loadPlans = async () => {
    const { data, error } = await supabase.from('stock_plans').select('id, name, plan_year, start_month, status, updated_at').order('plan_year', { ascending: false }).order('name');
    if (error) { if (/relation|does not exist|schema cache|stock_plans/i.test(error.message)) setReady(false); else toast('Error loading plans: ' + error.message, 'error'); return []; }
    setReady(true); setPlans(data || []); return data || [];
  };
  const openPlan = async (id) => {
    if (dirty && !confirm('You have unsaved changes to this plan. Discard them?')) return;
    const { data, error } = await supabase.from('stock_plans').select('*').eq('id', id).single();
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    const d = data.data || {};
    setPlan({ id: data.id, name: data.name, status: data.status, data: { classes: [], moves: [], ledger: [], divisions: [], oppRate: 10, ...d, startMonth: d.startMonth || data.start_month } });
    setDirty(false);
  };
  useEffect(() => {
    supabase.from('herds').select('*').order('name').then(({ data }) => setHerds(data || []));
    loadPlans().then(list => { const act = list.find(p => p.status === 'active') || list[0]; if (act) openPlan(act.id); });
  }, []);

  const upd = (fn) => { setPlan(p => { const d = JSON.parse(JSON.stringify(p.data)); fn(d); return { ...p, data: d }; }); setDirty(true); };
  const setMeta = (k, v) => { setPlan(p => ({ ...p, [k]: v })); setDirty(true); };
  const res = useMemo(() => plan ? computeStockFlow(plan.data) : null, [plan]);

  const save = async () => {
    if (!plan.name.trim()) { toast('Give the plan a name', 'error'); return; }
    setSaving(true);
    const row = { name: plan.name.trim(), status: plan.status, start_month: plan.data.startMonth, plan_year: sfPlanYear(plan.data.startMonth), data: plan.data, updated_at: new Date().toISOString() };
    // only one active plan at a time — it is the one the rest of the suite should read
    if (plan.status === 'active') await supabase.from('stock_plans').update({ status: 'draft' }).eq('status', 'active').neq('id', plan.id);
    const { error } = await supabase.from('stock_plans').update(row).eq('id', plan.id);
    setSaving(false);
    if (error) { toast('Save failed: ' + error.message, 'error'); return; }
    setDirty(false); loadPlans(); toast('Plan saved', 'success');
  };
  const createPlan = async (name, startMonth, data) => {
    const { data: row, error } = await supabase.from('stock_plans').insert({ name, start_month: startMonth, plan_year: sfPlanYear(startMonth), status: 'draft', data: { ...data, startMonth } }).select().single();
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    setShowNew(false); setDirty(false); await loadPlans(); await openPlanForce(row.id); toast('Plan created', 'success');
  };
  const openPlanForce = async (id) => { setDirty(false); const { data } = await supabase.from('stock_plans').select('*').eq('id', id).single(); if (data) setPlan({ id: data.id, name: data.name, status: data.status, data: { ...data.data, startMonth: data.data?.startMonth || data.start_month } }); };
  const deletePlan = async () => {
    if (!confirm(`Delete the plan "${plan.name}"? This can't be undone. RS inventory records are not affected.`)) return;
    const { error } = await supabase.from('stock_plans').delete().eq('id', plan.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    setPlan(null); setDirty(false); const list = await loadPlans(); if (list[0]) openPlanForce(list[0].id); toast('Plan deleted', 'success');
  };
  const lockOriginal = () => {
    if (plan.data.original && !confirm(`An original budget was locked on ${plan.data.original.lockedAt}. Replace it with the plan as it stands now?`)) return;
    upd(d => { d.original = { lockedAt: todayLocal(), ...sfSnapshot(res) }; });
    toast('Original budget locked — save to keep it', 'success');
  };

  if (ready === null) return <div className="loading"><div className="spinner"></div> Loading...</div>;
  if (ready === false) return (
    <div className="detail-card" style={{ maxWidth: '760px' }}>
      <div className="sf-h" style={{ marginTop: 0 }}>One-time setup</div>
      <div className="sf-note">Stock flow plans need one new table. Copy this into Supabase → SQL Editor, run it, then reload this page. It doesn't touch any existing table.</div>
      <pre style={{ background: 'var(--soil)', padding: '14px', borderRadius: '4px', fontSize: '11px', overflowX: 'auto', color: 'var(--cream)', whiteSpace: 'pre-wrap' }}>{STOCK_PLANS_SQL}</pre>
      <div style={{ display: 'flex', gap: '8px', marginTop: '12px' }}>
        <button className="btn btn-secondary" onClick={() => { navigator.clipboard.writeText(STOCK_PLANS_SQL); toast('SQL copied', 'success'); }}>Copy SQL</button>
        <button className="btn btn-primary" onClick={() => { setReady(null); loadPlans(); }}>I ran it — reload</button>
      </div>
    </div>
  );

  const TABS = [
    { id: 'setup', label: 'Setup' }, { id: 'breeding', label: 'Breeding Stats' }, { id: 'moves', label: 'Movements & Prices' },
    { id: 'flow', label: 'Stock Flow' }, { id: 'monthly', label: 'Head & AU' }, { id: 'cash', label: 'Cash Flow' },
    { id: 'econ', label: 'Economics' }, { id: 'actual', label: 'Plan vs Actual' },
  ];

  return (
    <div>
      <div style={{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap', marginBottom: '18px' }}>
        <select className="filter-select" value={plan?.id || ''} onChange={e => e.target.value && openPlan(Number(e.target.value))} style={{ minWidth: '240px' }}>
          {!plan && <option value="">— Select a plan —</option>}
          {plans.map(p => <option key={p.id} value={p.id}>{p.name}{p.status === 'active' ? '  ★ active' : p.status === 'closed' ? '  (closed)' : ''}</option>)}
        </select>
        <button className="btn btn-secondary" onClick={() => setShowNew(true)}>+ New Plan</button>
        {plan && <>
          <button className="btn btn-primary" disabled={!dirty || saving} style={{ opacity: dirty ? 1 : 0.5 }} onClick={save}>{saving ? 'Saving…' : dirty ? 'Save Changes' : 'Saved'}</button>
          <button className="btn btn-ghost" onClick={lockOriginal} title="Freeze today's numbers as the original budget to compare against later">{plan.data.original ? `Original locked ${formatDate(plan.data.original.lockedAt)}` : 'Lock as Original Budget'}</button>
          <button className="btn btn-danger" style={{ marginLeft: 'auto' }} onClick={deletePlan}>Delete</button>
        </>}
      </div>

      {!plan ? <div className="empty-state" style={{ padding: '40px', textAlign: 'center', color: 'var(--ash)' }}>No plans yet. Start one with <b>+ New Plan</b> — from your RS herds, from the 2022 Cattle Economics template, or blank.</div> : <>
        {res.warnings.length > 0 && <div className="sf-warn">{res.warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}</div>}
        <SfTabs tabs={TABS} active={tab} onChange={setTab} />
        {tab === 'setup' && <SfSetup plan={plan} res={res} upd={upd} setMeta={setMeta} herds={herds} />}
        {tab === 'breeding' && <SfBreeding plan={plan} res={res} upd={upd} />}
        {tab === 'moves' && <SfMoves plan={plan} res={res} upd={upd} />}
        {tab === 'flow' && <SfFlow plan={plan} res={res} />}
        {tab === 'monthly' && <SfMonthly plan={plan} res={res} />}
        {tab === 'cash' && <SfCash plan={plan} res={res} />}
        {tab === 'econ' && <SfEcon plan={plan} res={res} />}
        {tab === 'actual' && <SfActual plan={plan} res={res} upd={upd} herds={herds} toast={toast} />}
      </>}

      {showNew && <SfNewPlanModal plans={plans} current={plan} currentRes={res} herds={herds} onCreate={createPlan} onClose={() => setShowNew(false)} toast={toast} />}
    </div>
  );
}

function SfNewPlanModal({ plans, current, currentRes, herds, onCreate, onClose, toast }) {
  const now = new Date();
  const [source, setSource] = useState(current ? 'roll' : 'herds');
  const [startMonth, setStartMonth] = useState(current ? sfAddMonths(current.data.startMonth, 12) : `${now.getFullYear()}-12`);
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    if (source === 'template') { setName('2022 Cattle Economics (template)'); setStartMonth('2021-12'); }
    else { const sm = source === 'roll' && current ? sfAddMonths(current.data.startMonth, 12) : startMonth; if (source === 'roll' && current) setStartMonth(sm); setName(`${sfPlanYear(sm)} Stock Flow Plan`); }
  }, [source]);
  useEffect(() => { if (source !== 'template') setName(`${sfPlanYear(startMonth)} Stock Flow Plan`); }, [startMonth]);

  const build = async () => {
    setBusy(true);
    let data;
    if (source === 'template') data = sfTemplate2022();
    else if (source === 'blank') data = { oppRate: 10, divisions: ['Cow/Calf', 'Stocker'], classes: [], moves: [], ledger: [] };
    else if (source === 'roll') {
      data = JSON.parse(JSON.stringify(current.data)); delete data.original;
      data.classes.forEach(c => { c.open = Math.round(currentRes.classes[c.id]?.close || 0); if (sfHas(c.closeValue)) c.value = c.closeValue; });
    } else {
      // From RS herds: one class per herd with cattle. Opening = head on the plan's first day; cattle entered in RS
      // after that day come in as purchase movements in the month they were added (a future start uses today's count).
      const start = startMonth + '-01', past = start <= todayLocal(), months = sfMonthList(startMonth);
      const { data: an, error } = await supabase.from('animals').select('herd_id, sex, status, status_date, created_at, purchased').limit(10000);
      if (error) { toast('Error reading inventory: ' + error.message, 'error'); setBusy(false); return; }
      const byHerd = {}, addedByHerd = {};
      (an || []).forEach(a => {
        if (!a.herd_id) return;
        const k = String(a.herd_id), created = (a.created_at || '').slice(0, 10), sd = a.status_date || '';
        const atStart = past ? created < start && (a.status === 'active' || (sd && sd >= start)) : a.status === 'active';
        if (atStart) (byHerd[k] = byHerd[k] || {})[a.sex] = (byHerd[k][a.sex] || 0) + 1;
        else if (past && created >= start) { const mi = months.findIndex(m => m.key === created.slice(0, 7)); if (mi >= 0) { (addedByHerd[k] = addedByHerd[k] || []).push({ sex: a.sex, mi }); byHerd[k] = byHerd[k] || {}; } }
      });
      const classes = [], moves = [];
      const addPurchases = (h, cls, sexes) => {
        const per = {};
        (addedByHerd[String(h.id)] || []).filter(x => !sexes.length || sexes.includes(x.sex)).forEach(x => { per[x.mi] = (per[x.mi] || 0) + 1; });
        Object.entries(per).forEach(([mi, q]) => moves.push({ id: sfId(), classId: cls.id, type: 'purchase', reason: '', qtyMode: 'fixed', qtyFixed: q, month: Number(mi), weight: '', price: '', perHead: '', toClassId: '', note: 'Entered in RS after plan start' }));
      };
      herds.filter(h => h.is_active !== false && byHerd[String(h.id)]).forEach(h => {
        if (!Object.keys(byHerd[String(h.id)]).length && !(addedByHerd[String(h.id)] || []).length) return;
        const sx = { ...byHerd[String(h.id)] }; (addedByHerd[String(h.id)] || []).forEach(x => { sx[x.sex] = (sx[x.sex] || 0) + 0.0001; });
        const n = (k) => Math.round(sx[k] || 0), females = (sx.cow || 0) + (sx.heifer || 0), total = Object.values(sx).reduce((s, v) => s + v, 0);
        const division = h.enterprise || 'Unassigned', au = sfHas(h.default_au) ? Number(h.default_au) : null;
        if (females / total >= 0.6) {
          const set = sfNewBreedingSet(h.name, division, { open: n('cow') + n('heifer'), herdIds: [String(h.id)], sexes: ['cow', 'heifer'], au: au ?? 1 });
          set[1].open = n('calf_female'); set[2].open = n('calf_male');
          classes.push(...set); addPurchases(h, set[0], ['cow', 'heifer']); addPurchases(h, set[1], ['calf_female']); addPurchases(h, set[2], ['calf_male']);
          if (sx.bull) { const b = sfNewClass({ name: `${h.name} – bulls`, division, kind: 'bulls', open: n('bull'), au: 1.5, herdIds: [String(h.id)], sexes: ['bull'] }); classes.push(b); addPurchases(h, b, ['bull']); }
        } else {
          const kind = (sx.bull || 0) / total >= 0.6 ? 'bulls' : 'growing';
          const c = sfNewClass({ name: h.name, division, kind, open: Math.round(total), au: au ?? (kind === 'bulls' ? 1.5 : 0.7), herdIds: [String(h.id)] });
          classes.push(c); addPurchases(h, c, []);
        }
      });
      data = { oppRate: 10, divisions: [...new Set(classes.map(c => c.division))], classes, moves, ledger: [] };
    }
    await onCreate(name.trim() || 'Stock Flow Plan', startMonth, data);
    setBusy(false);
  };

  const opts = [
    ['herds', 'From my RS herds', 'One class per active herd, opening head = live RS count. Cow herds get linked heifer/steer calf classes and default rates you then adjust.'],
    ...(current ? [['roll', `Roll forward "${current.name}"`, 'Same classes, rates, prices and movements; each class opens with last plan\'s projected close.']] : []),
    ['template', '2022 Cattle Economics template', 'Your 2022 workbook rebuilt as a plan — useful to check the math against the sheet.'],
    ['blank', 'Blank', 'Start empty.'],
  ];
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header"><div className="modal-title">New Stock Flow Plan</div><button className="modal-close" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          {opts.map(([id, label, desc]) => (
            <label key={id} style={{ display: 'flex', gap: '10px', padding: '10px', marginBottom: '6px', borderRadius: '4px', cursor: 'pointer', border: `1px solid ${source === id ? 'var(--hay)' : 'rgba(58,125,123,0.3)'}` }}>
              <input type="radio" checked={source === id} onChange={() => setSource(id)} />
              <div><div style={{ fontWeight: 700 }}>{label}</div><div style={{ fontSize: '12px', color: 'var(--ash)' }}>{desc}</div></div>
            </label>
          ))}
          <div className="form-grid" style={{ marginTop: '14px' }}>
            <div className="form-group"><label className="form-label">Plan year starts</label><input type="month" className="form-input" value={startMonth} disabled={source === 'template'} onChange={e => setStartMonth(e.target.value)} /></div>
            <div className="form-group"><label className="form-label">Plan name</label><input className="form-input" value={name} onChange={e => setName(e.target.value)} /></div>
          </div>
          <div className="sf-note">Start the year where your count is cleanest — right after fall preg check and weaning works well ("pregnant & kept" is the opening number).</div>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={busy} onClick={build}>{busy ? 'Building…' : 'Create Plan'}</button></div>
      </div>
    </div>
  );
}

// ── SETUP: plan settings, classes, RS herd mapping, other income & direct costs ──
function SfSetup({ plan, res, upd, setMeta, herds }) {
  const d = plan.data, months = res.months;
  const [mapFor, setMapFor] = useState(null);
  const divisions = [...new Set([...(d.divisions || []), ...d.classes.map(c => c.division)].filter(Boolean))];
  const setC = (id, k, v) => upd(x => { const c = x.classes.find(c => c.id === id); c[k] = v; });
  const move = (i, dir) => upd(x => { const j = i + dir; if (j < 0 || j >= x.classes.length) return; [x.classes[i], x.classes[j]] = [x.classes[j], x.classes[i]]; });
  const removeClass = (c) => {
    const n = d.moves.filter(m => m.classId === c.id || m.toClassId === c.id).length;
    if (!confirm(`Remove class "${c.name}"${n ? ` and its ${n} movement(s)` : ''}?`)) return;
    upd(x => {
      x.classes = x.classes.filter(k => k.id !== c.id);
      x.moves = x.moves.filter(m => m.classId !== c.id && m.toClassId !== c.id);
      x.classes.forEach(k => { if (k.heiferClassId === c.id) k.heiferClassId = ''; if (k.steerClassId === c.id) k.steerClassId = ''; });
    });
  };
  const herdName = (id) => herds.find(h => String(h.id) === String(id))?.name || '?';
  const mappedLabel = (c) => !(c.herdIds || []).length ? 'Not mapped' : c.herdIds.map(herdName).join(', ') + ((c.sexes || []).length ? ` · ${c.sexes.map(sexLabel).join('/')}` : '');
  const addLedger = () => upd(x => { x.ledger.push({ id: sfId(), division: divisions[0] || 'Cow/Calf', kind: 'cost', label: '', amount: '', month: 'spread' }); });
  const setL = (id, k, v) => upd(x => { x.ledger.find(l => l.id === id)[k] = v; });

  return (
    <div>
      <div className="detail-card" style={{ display: 'flex', gap: '18px', flexWrap: 'wrap', alignItems: 'flex-end' }}>
        <div className="form-group" style={{ minWidth: '260px' }}><label className="form-label">Plan name</label><input className="form-input" value={plan.name} onChange={e => setMeta('name', e.target.value)} /></div>
        <div className="form-group"><label className="form-label">Year starts</label><input type="month" className="form-input" value={d.startMonth} onChange={e => e.target.value && upd(x => { x.startMonth = e.target.value; })} /></div>
        <div className="form-group"><label className="form-label">Status</label>
          <select className="form-select" value={plan.status} onChange={e => setMeta('status', e.target.value)}>
            <option value="draft">Draft</option><option value="active">Active (the working plan)</option><option value="closed">Closed</option>
          </select></div>
        <div className="form-group"><label className="form-label">Opportunity interest %</label><SfNum value={d.oppRate} width={80} onChange={v => upd(x => { x.oppRate = v; })} /></div>
        <div className="form-group" style={{ minWidth: '260px' }}><label className="form-label">Divisions (comma separated)</label>
          <input className="form-input" defaultValue={(d.divisions || []).join(', ')} key={(d.divisions || []).join('|')}
            onBlur={e => upd(x => { x.divisions = e.target.value.split(',').map(s => s.trim()).filter(Boolean); })} /></div>
        <div className="sf-note" style={{ flexBasis: '100%', margin: 0 }}>Plan year: {months[0].label} – {months[11].label}. Match division names to your Ambrook enterprises so the gross margins line up with the books.</div>
      </div>

      <div className="sf-h">Classes of stock</div>
      <div className="sf-note">Year open is head on hand the first day of the plan (for breeding classes, the pregnant & kept count). Breeding rates and calf links are on the Breeding Stats tab. AU counts from the "AU from" month — set calves to start at weaning if their grass is counted with the cow. Map each class to RS herds (and sexes, when calves run in the cow herd) so Plan vs Actual can read the inventory.</div>
      <div className="table-wrap sf-scroll">
        <table className="sf-table"><thead><tr>
          <th></th><th>Class</th><th>Division</th><th>Kind</th><th>Year open</th><th>Deaths</th><th>AU / hd</th><th>AU from</th><th>$/hd open</th><th>$/hd close</th><th>My share %</th><th>RS mapping</th><th></th>
        </tr></thead><tbody>
          {d.classes.map((c, i) => (
            <tr key={c.id}>
              <td style={{ whiteSpace: 'nowrap' }}><button className="btn-icon" onClick={() => move(i, -1)}>↑</button><button className="btn-icon" onClick={() => move(i, 1)}>↓</button></td>
              <td><input className="sf-in" style={{ width: '170px', textAlign: 'left' }} value={c.name} onChange={e => setC(c.id, 'name', e.target.value)} /></td>
              <td><select className="sf-sel" value={c.division} onChange={e => setC(c.id, 'division', e.target.value)}>{[...new Set([...divisions, c.division])].map(v => <option key={v}>{v}</option>)}</select></td>
              <td><select className="sf-sel" value={c.kind} onChange={e => upd(x => { const k = x.classes.find(k => k.id === c.id); k.kind = e.target.value; if (k.kind === 'breeding') Object.entries(SF_DEFAULT_RATES).forEach(([a, b]) => { if (!sfHas(k[a])) k[a] = b; }); })}>
                {Object.entries(SF_KIND_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></td>
              <td><SfNum value={c.open} onChange={v => setC(c.id, 'open', v)} /></td>
              <td style={{ whiteSpace: 'nowrap' }}>{c.kind === 'breeding'
                ? <span className="sf-calc">{c.deathPct || 0}% (breeding tab)</span>
                : <><SfNum value={c.deathPct} width={46} title="Death loss %" onChange={v => setC(c.id, 'deathPct', v)} /> % or <SfNum value={c.deathQty} width={40} placeholder="hd" title="Fixed head — overrides %" onChange={v => setC(c.id, 'deathQty', v)} /></>}</td>
              <td><SfNum value={c.au} width={50} onChange={v => setC(c.id, 'au', v)} /></td>
              <td><SfMonthSel value={c.auStartMonth ?? 0} months={months} onChange={v => setC(c.id, 'auStartMonth', v)} /></td>
              <td><SfNum value={c.value} width={70} onChange={v => setC(c.id, 'value', v)} /></td>
              <td><SfNum value={c.closeValue} width={70} placeholder="same" onChange={v => setC(c.id, 'closeValue', v)} /></td>
              <td><SfNum value={c.sharePct} width={56} onChange={v => setC(c.id, 'sharePct', v)} /></td>
              <td><button className="btn btn-ghost" style={{ padding: '3px 8px', fontSize: '11px', maxWidth: '200px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: (c.herdIds || []).length ? 'var(--sage)' : 'var(--ash)' }} onClick={() => setMapFor(c.id)}>{mappedLabel(c)}</button></td>
              <td><button className="btn-icon" onClick={() => removeClass(c)}>✕</button></td>
            </tr>
          ))}
        </tbody></table>
      </div>
      <div style={{ display: 'flex', gap: '8px', marginTop: '10px' }}>
        <button className="btn btn-secondary" onClick={() => upd(x => { x.classes.push(...sfNewBreedingSet('New cow herd', divisions[0] || 'Cow/Calf')); })}>+ Breeding class (with calf classes)</button>
        <button className="btn btn-ghost" onClick={() => upd(x => { x.classes.push(sfNewClass({ division: divisions[0] || 'Cow/Calf' })); })}>+ Growing / stocker class</button>
        <button className="btn btn-ghost" onClick={() => upd(x => { x.classes.push(sfNewClass({ name: 'Bulls', kind: 'bulls', au: 1.5, division: divisions[0] || 'Cow/Calf' })); })}>+ Bulls</button>
      </div>

      <div className="sf-h">Other income & direct costs</div>
      <div className="sf-note">Feed, health, freight, bull lease income and the like, by division. These feed the gross margin and the cash flow; leave month on "Spread" if it's paid evenly. Opportunity interest is figured on opening inventory value and is non-cash.</div>
      <div className="table-wrap"><table className="sf-table"><thead><tr><th>Division</th><th>Type</th><th>Item</th><th>Amount</th><th>Month</th><th></th></tr></thead><tbody>
        {(d.ledger || []).map(l => (
          <tr key={l.id}>
            <td><select className="sf-sel" value={l.division} onChange={e => setL(l.id, 'division', e.target.value)}>{[...new Set([...divisions, l.division])].map(v => <option key={v}>{v}</option>)}</select></td>
            <td><select className="sf-sel" value={l.kind} onChange={e => setL(l.id, 'kind', e.target.value)}><option value="cost">Direct cost</option><option value="income">Other income</option></select></td>
            <td><input className="sf-in" style={{ width: '260px', textAlign: 'left' }} value={l.label} onChange={e => setL(l.id, 'label', e.target.value)} /></td>
            <td><SfNum value={l.amount} width={100} onChange={v => setL(l.id, 'amount', v)} /></td>
            <td><SfMonthSel value={l.month} months={months} allowSpread onChange={v => setL(l.id, 'month', v)} /></td>
            <td><button className="btn-icon" onClick={() => upd(x => { x.ledger = x.ledger.filter(k => k.id !== l.id); })}>✕</button></td>
          </tr>
        ))}
      </tbody></table></div>
      <button className="btn btn-ghost" style={{ marginTop: '10px' }} onClick={addLedger}>+ Line</button>

      {mapFor && <SfMapModal cls={d.classes.find(c => c.id === mapFor)} herds={herds} onClose={() => setMapFor(null)}
        onSave={(herdIds, sexes) => { upd(x => { const c = x.classes.find(c => c.id === mapFor); c.herdIds = herdIds; c.sexes = sexes; }); setMapFor(null); }} />}
    </div>
  );
}

function SfMapModal({ cls, herds, onSave, onClose }) {
  const [ids, setIds] = useState((cls.herdIds || []).map(String));
  const [sexes, setSexes] = useState(cls.sexes || []);
  const tog = (arr, set, v) => set(arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v]);
  const list = [...herds].sort((a, b) => (b.is_active !== false) - (a.is_active !== false) || a.name.localeCompare(b.name));
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header"><div className="modal-title">RS mapping — {cls.name}</div><button className="modal-close" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-label">Herds</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(190px, 1fr))', gap: '4px', marginBottom: '16px' }}>
            {list.map(h => <label key={h.id} style={{ fontSize: '13px', color: h.is_active === false ? 'var(--ash)' : 'var(--cream)', cursor: 'pointer' }}>
              <input type="checkbox" checked={ids.includes(String(h.id))} onChange={() => tog(ids, setIds, String(h.id))} /> {h.name}{h.enterprise ? <span style={{ color: 'var(--ash)', fontSize: '11px' }}> · {h.enterprise}</span> : ''}</label>)}
          </div>
          <div className="form-label">Only these sexes (leave all unchecked for every animal in the herds)</div>
          <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
            {SF_SEXES.map(s => <label key={s} style={{ fontSize: '13px', cursor: 'pointer' }}><input type="checkbox" checked={sexes.includes(s)} onChange={() => tog(sexes, setSexes, s)} /> {sexLabel(s)}</label>)}
          </div>
          <div className="sf-note" style={{ marginTop: '14px' }}>An animal counts toward the first class (top to bottom on Setup) whose herds and sexes match it. Actuals use each animal's current herd, so a cow that moved herds mid-year reports under her new class.</div>
        </div>
        <div className="modal-footer"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={() => onSave(ids, sexes)}>Save Mapping</button></div>
      </div>
    </div>
  );
}

// ── BREEDING STATISTICS: the waterfall, one column per breeding class ──
function SfBreeding({ plan, res, upd }) {
  const d = plan.data, months = res.months;
  const cols = d.classes.filter(c => c.kind === 'breeding');
  const growing = d.classes.filter(c => c.kind === 'growing');
  const setC = (id, k, v) => upd(x => { x.classes.find(c => c.id === id)[k] = v; });
  if (!cols.length) return <div className="sf-note">No breeding classes yet — add one on Setup, or change a class's kind to Breeding females.</div>;
  const R = res.classes;
  const pctRow = (label, key, calcKey) => (
    <tr><td>{label}</td>{cols.map(c => <React.Fragment key={c.id}><td className="n"><SfNum value={c[key]} width={50} onChange={v => setC(c.id, key, v)} />%</td><td className="n">{sf1(R[c.id][calcKey])}</td></React.Fragment>)}</tr>
  );
  const calcRow = (label, key, bold) => (
    <tr className={bold ? 'sub' : ''}><td>{label}</td>{cols.map(c => <React.Fragment key={c.id}><td></td><td className="n">{sf1(R[c.id][key])}</td></React.Fragment>)}</tr>
  );
  return (
    <div>
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead><tr><th></th>{cols.map(c => <th key={c.id} colSpan={2} style={{ textAlign: 'center' }}>{c.name}<div style={{ color: 'var(--sage)', letterSpacing: '1px' }}>{c.division}</div></th>)}</tr></thead>
        <tbody>
          <tr><td>Sire group</td>{cols.map(c => <td key={c.id} colSpan={2} className="n"><input className="sf-in" style={{ width: '110px' }} placeholder="e.g. Angus" value={c.sireGroup || ''} onChange={e => setC(c.id, 'sireGroup', e.target.value)} /></td>)}</tr>
          <tr className="sub"><td>Pregnant & kept — count inventory</td>{cols.map(c => <td key={c.id} colSpan={2} className="n"><SfNum value={c.open} width={70} onChange={v => setC(c.id, 'open', v)} /></td>)}</tr>
          {pctRow('Deaths — projection', 'deathPct', 'wfDeaths')}
          {calcRow('Number live', 'live')}
          {pctRow('Expected dry', 'dryPct', 'dry')}
          {calcRow('Number wet', 'wet')}
          {pctRow('Expected culls', 'cullPct', 'culls')}
          {calcRow('Number exposed', 'exposed')}
          {pctRow('Expected open', 'openPct', 'opens')}
          {calcRow('Pregnant & kept (next year)', 'pk', true)}
          <tr><td>Calves this plan year?</td>{cols.map(c => <td key={c.id} colSpan={2} className="n"><input type="checkbox" checked={!!c.calves} onChange={e => setC(c.id, 'calves', e.target.checked)} /> {c.calves ? `${sf0(R[c.id].wet)} calves` : 'no'}</td>)}</tr>
          <tr><td>Calving month</td>{cols.map(c => <td key={c.id} colSpan={2} className="n">{c.calves ? <SfMonthSel value={c.calvingMonth ?? 0} months={months} onChange={v => setC(c.id, 'calvingMonth', v)} /> : '—'}</td>)}</tr>
          <tr><td>% heifer calves</td>{cols.map(c => <td key={c.id} colSpan={2} className="n">{c.calves ? <><SfNum value={c.heiferPct ?? 50} width={46} onChange={v => setC(c.id, 'heiferPct', v)} />%</> : '—'}</td>)}</tr>
          {[['heiferClassId', 'Heifer calves go to'], ['steerClassId', 'Steer calves go to']].map(([k, label]) => (
            <tr key={k}><td>{label}</td>{cols.map(c => <td key={c.id} colSpan={2} className="n">{c.calves ? <select className="sf-sel" value={c[k] || ''} onChange={e => setC(c.id, k, e.target.value)}><option value="">— none —</option>{growing.map(g => <option key={g.id} value={g.id}>{g.name}</option>)}</select> : '—'}</td>)}</tr>
          ))}
        </tbody></table></div>
      <div className="sf-note">Dry = lost calves / didn't calve (of live). Culls are taken from wet cows, opens from those exposed — same order as the workbook. Cull, open and dry head become sales automatically; price them on Movements & Prices.</div>

      {Object.entries(res.breeding.byDiv).map(([div, b]) => (
        <div key={div}>
          <div className="sf-h">{div}</div>
          <div className="stats-row" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(170px, 1fr))' }}>
            <SfStat label="Breeding herd (open)" value={sf0(b.breedingOpen)} sub={b.born > 0 ? '' : `${sf0(b.exposed)} exposed · ${sf0(b.exposed - cols.filter(c => c.division === div).reduce((s, c) => s + R[c.id].opens, 0))} bred`} />
            {b.born > 0 && <>
              <SfStat label="Calves born" value={sf0(b.born)} sub={cols.filter(c => c.division === div && c.calves).map(c => `${c.sireGroup || c.name} ${sf0(R[c.id].wet)}`).join(' · ')} />
              <SfStat label="Calves weaned" value={sf0(b.weaned)} sub="after calf death loss" />
              <SfStat label="Breeding herd index" value={sfPct(b.indexBorn)} sub={`${sfPct(b.indexWeaned)} on weaned`} />
            </>}
            {b.bulls > 0 && <SfStat label="Females exposed / bull" value={sf1(b.exposed / b.bulls)} sub={`${sf0(b.bulls)} bulls at open`} />}
          </div>
        </div>
      ))}
    </div>
  );
}

// ── MOVEMENTS & PRICES: every sale, purchase and transfer, with month, weight and price ──
function SfMoves({ plan, res, upd }) {
  const d = plan.data, months = res.months;
  const cls = Object.fromEntries(d.classes.map(c => [c.id, c]));
  const resolved = Object.fromEntries(res.moves.map(m => [m.id, m]));
  const setM = (id, k, v) => upd(x => {
    const m = x.moves.find(m => m.id === id); m[k] = v;
    if (k === 'type') { const c = x.classes.find(c => c.id === m.classId); if (!modesFor(c, m).includes(m.qtyMode)) m.qtyMode = 'fixed'; if (m.type === 'sale' && !m.reason) m.reason = 'other'; }
  });
  const [addCls, setAddCls] = useState(d.classes[0]?.id || '');
  const [addType, setAddType] = useState('sale');
  const add = () => { if (!addCls) return; upd(x => { x.moves.push({ id: sfId(), classId: addCls, type: addType, reason: addType === 'sale' ? 'other' : '', qtyMode: 'fixed', qtyFixed: '', month: 11, weight: '', price: '', perHead: '', toClassId: '', note: '' }); }); };
  const adopt = (v) => upd(x => { x.moves.push({ id: sfId(), classId: v.classId, type: 'sale', reason: v.reason, qtyMode: 'auto', qtyFixed: '', month: 11, weight: '', price: '', perHead: '', toClassId: '', note: '' }); });
  const virtual = res.moves.filter(m => m.virtual);
  const modesFor = (c, m) => ['fixed', 'remaining', ...(c?.kind === 'breeding' ? (m.type === 'sale' ? ['auto'] : []).concat(m.type === 'transfer' ? ['pk'] : []) : [])];
  const groups = d.classes.map(c => ({ c, rows: d.moves.filter(m => m.classId === c.id) })).filter(g => g.rows.length);

  return (
    <div>
      {virtual.length > 0 && <div className="sf-warn" style={{ background: 'rgba(168,218,220,0.08)', borderColor: 'rgba(168,218,220,0.4)', color: 'var(--hay)' }}>
        Breeding-stat sales with no price yet (counted in the stock flow, $0 in the economics):
        <div style={{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '6px' }}>{virtual.map(v => <button key={v.id} className="btn btn-ghost" style={{ padding: '3px 8px', fontSize: '11px' }} onClick={() => adopt(v)}>+ {cls[v.classId]?.name} {v.reason} ({sf0(v.qty)} hd)</button>)}</div>
      </div>}
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead><tr>
        <th>Type</th><th>Reason / to</th><th>Head basis</th><th>Head</th><th>Month</th><th>Wt (lb)</th><th>$/cwt</th><th>or $/hd</th><th>$/hd</th><th>Gross</th><th>Note</th><th></th>
      </tr></thead><tbody>
        {groups.map(({ c, rows }) => (
          <React.Fragment key={c.id}>
            <tr className="sub"><td colSpan={12}>{c.name} <span style={{ color: 'var(--ash)', fontWeight: 400 }}>· {c.division}</span></td></tr>
            {rows.map(m => { const r = resolved[m.id] || {}; return (
              <tr key={m.id}>
                <td><select className="sf-sel" value={m.type} onChange={e => setM(m.id, 'type', e.target.value)}>{Object.entries(SF_MOVE_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select></td>
                <td>{m.type === 'sale' ? <select className="sf-sel" value={m.reason || 'other'} onChange={e => setM(m.id, 'reason', e.target.value)}>{SF_REASONS.map(x => <option key={x} value={x}>{x}</option>)}</select>
                  : m.type === 'transfer' ? <select className="sf-sel" value={m.toClassId || ''} onChange={e => setM(m.id, 'toClassId', e.target.value)}><option value="">— to class —</option>{d.classes.filter(k => k.id !== c.id).map(k => <option key={k.id} value={k.id}>{k.name}{k.division !== c.division ? ` (${k.division})` : ''}</option>)}</select>
                  : <span className="sf-calc">—</span>}</td>
                <td><select className="sf-sel" value={m.qtyMode || 'fixed'} onChange={e => setM(m.id, 'qtyMode', e.target.value)}>{modesFor(c, m).map(k => <option key={k} value={k}>{SF_QTY_LABEL[k]}</option>)}</select></td>
                <td className="n">{(m.qtyMode || 'fixed') === 'fixed' ? <SfNum value={m.qtyFixed} width={56} onChange={v => setM(m.id, 'qtyFixed', v)} /> : <span className="sf-calc">{sf1(r.qty)}</span>}</td>
                <td><SfMonthSel value={m.month ?? 11} months={months} onChange={v => setM(m.id, 'month', v)} /></td>
                <td><SfNum value={m.weight} width={56} onChange={v => setM(m.id, 'weight', v)} /></td>
                <td><SfNum value={m.price} width={56} onChange={v => setM(m.id, 'price', v)} /></td>
                <td><SfNum value={m.perHead} width={64} onChange={v => setM(m.id, 'perHead', v)} /></td>
                <td className="n">{r.perHeadCalc ? sf$(r.perHeadCalc) : '—'}</td>
                <td className="n" style={{ color: r.unpriced ? '#e8836a' : undefined }}>{m.type === 'transfer' && !r.crossDiv ? <span className="sf-calc">no $</span> : r.unpriced ? 'unpriced' : sf$(r.gross)}</td>
                <td><input className="sf-in" style={{ width: '150px', textAlign: 'left' }} value={m.note || ''} onChange={e => setM(m.id, 'note', e.target.value)} /></td>
                <td><button className="btn-icon" onClick={() => upd(x => { x.moves = x.moves.filter(k => k.id !== m.id); })}>✕</button></td>
              </tr>
            ); })}
          </React.Fragment>
        ))}
      </tbody></table></div>
      <div style={{ display: 'flex', gap: '8px', marginTop: '10px', alignItems: 'center' }}>
        <select className="filter-select" value={addCls} onChange={e => setAddCls(e.target.value)}>{d.classes.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <select className="filter-select" value={addType} onChange={e => setAddType(e.target.value)}>{Object.entries(SF_MOVE_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}</select>
        <button className="btn btn-secondary" onClick={add}>+ Add Movement</button>
      </div>
      <div className="sf-note" style={{ marginTop: '14px' }}>
        <b>Head basis:</b> Auto = the breeding-stat cull/open/dry count · Pregnant & kept = bred heifers moving up · All remaining = whatever is left in the class after every other movement and death (calves shipped, heifers kept) · Fixed = a number you type.
        A transfer to a class in another division is valued at its price (it's revenue to one division and cost to the other); a transfer within a division carries no dollars. Use "or $/hd" for bulls bought by the head.
      </div>
    </div>
  );
}

// ── STOCK FLOW: open + in − out = close, by division ──
const SF_FLOW_COLS = [
  ['open', 'Year open'], ['births', 'Births'], ['purchases', 'Purch'], ['xferIn', 'Xfer in'], ['inDiv', 'In from div'],
  ['s_cull', 'Sold cull'], ['s_open', 'Sold open'], ['s_dry', 'Sold dry'], ['s_other', 'Sold other'], ['deaths', 'Deaths'], ['xferOut', 'Xfer out'], ['outDiv', 'Out of div'], ['close', 'Year close'],
];
const sfFlowVal = (r, k) => k.startsWith('s_') ? r.sales[k.slice(2)] : r[k];
function SfFlow({ plan, res }) {
  const d = plan.data;
  const divs = [...new Set(d.classes.map(c => c.division))];
  const total = (list) => Object.fromEntries(SF_FLOW_COLS.map(([k]) => [k, list.reduce((s, c) => s + (sfFlowVal(res.classes[c.id], k) || 0), 0)]));
  const exportCsv = () => sfDownload(`stock_flow_${plan.name}.csv`, [['Division', 'Class', ...SF_FLOW_COLS.map(x => x[1])],
    ...d.classes.map(c => [c.division, c.name, ...SF_FLOW_COLS.map(([k]) => (Math.round((sfFlowVal(res.classes[c.id], k) || 0) * 10) / 10))])]);
  const Row = ({ label, vals, cls: cn }) => <tr className={cn}><td>{label}</td>{SF_FLOW_COLS.map(([k]) => <td key={k} className="n" style={k === 'close' || k === 'open' ? { fontWeight: 700 } : undefined}>{vals[k] ? sf0(vals[k]) : '—'}</td>)}</tr>;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: '10px' }}><button className="btn btn-ghost" onClick={exportCsv}>Export CSV</button></div>
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead><tr><th>Class of stock</th>{SF_FLOW_COLS.map(([k, l]) => <th key={k} style={{ textAlign: 'right' }}>{l}</th>)}</tr></thead><tbody>
        {divs.map(dv => { const list = d.classes.filter(c => c.division === dv); return (
          <React.Fragment key={dv}>
            {list.map(c => <Row key={c.id} label={c.name} vals={Object.fromEntries(SF_FLOW_COLS.map(([k]) => [k, sfFlowVal(res.classes[c.id], k)]))} cls={res.classes[c.id].close < -0.5 ? 'neg' : ''} />)}
            {divs.length > 1 && <Row label={`${dv} total`} vals={total(list)} cls="sub" />}
          </React.Fragment>
        ); })}
        <Row label="Total" vals={total(d.classes)} cls="tot" />
      </tbody></table></div>
      <div className="sf-note">Totals are true head on hand — cattle transferred out of a division leave the close. (The 2022 workbook's total row skipped the "out of div" column, so it showed 1,035 at close instead of about 670.)</div>
    </div>
  );
}

// ── HEAD & AU BY MONTH: the bridge to the grazing plan ──
function SfMonthly({ plan, res }) {
  const d = plan.data, months = res.months;
  const [view, setView] = useState('au');
  const [div, setDiv] = useState('');
  const list = d.classes.filter(c => !div || c.division === div);
  const val = (c, i) => view === 'au' ? res.classes[c.id].auMonths[i] : res.classes[c.id].headEnd[i];
  const tot = (i) => list.reduce((s, c) => s + val(c, i), 0);
  const exportCsv = () => sfDownload(`head_au_${plan.name}.csv`, [
    ['Head at month end'], ['Class', 'Division', 'AU/hd', ...months.map(m => m.key)], ...d.classes.map(c => [c.name, c.division, c.au, ...res.classes[c.id].headEnd.map(x => Math.round(x * 10) / 10)]),
    [], ['AU-months (mid-month head × AU factor)'], ['Class', 'Division', 'AU/hd', ...months.map(m => m.key), 'Total'],
    ...d.classes.map(c => [c.name, c.division, c.au, ...res.classes[c.id].auMonths.map(x => Math.round(x * 10) / 10), Math.round(res.classes[c.id].auMonths.reduce((s, x) => s + x, 0))]),
    ['Total', '', '', ...res.auTotal.map(x => Math.round(x)), Math.round(res.auTotal.reduce((s, x) => s + x, 0))]]);
  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '12px', alignItems: 'center' }}>
        <select className="filter-select" value={view} onChange={e => setView(e.target.value)}><option value="au">AU-months</option><option value="head">Head at month end</option></select>
        <select className="filter-select" value={div} onChange={e => setDiv(e.target.value)}><option value="">All divisions</option>{[...new Set(d.classes.map(c => c.division))].map(v => <option key={v}>{v}</option>)}</select>
        <button className="btn btn-ghost" style={{ marginLeft: 'auto' }} onClick={exportCsv}>Export CSV (for grazing plan)</button>
      </div>
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead><tr><th>Class</th>{view === 'au' && <th style={{ textAlign: 'right' }}>AU/hd</th>}{months.map(m => <th key={m.key} style={{ textAlign: 'right' }}>{m.label}</th>)}{view === 'au' && <th style={{ textAlign: 'right' }}>Year</th>}</tr></thead><tbody>
        {list.map(c => <tr key={c.id}><td>{c.name}</td>{view === 'au' && <td className="n sf-calc">{c.au || '—'}</td>}{months.map((m, i) => <td key={i} className="n">{Math.abs(val(c, i)) > 0.05 ? sf0(val(c, i)) : '—'}</td>)}{view === 'au' && <td className="n" style={{ fontWeight: 700 }}>{sf0(res.classes[c.id].auMonths.reduce((s, x) => s + x, 0))}</td>}</tr>)}
        <tr className="tot"><td>Total</td>{view === 'au' && <td></td>}{months.map((m, i) => <td key={i} className="n">{sf0(tot(i))}</td>)}{view === 'au' && <td className="n">{sf0(months.reduce((s, m, i) => s + tot(i), 0))}</td>}</tr>
      </tbody></table></div>
      <div className="sf-note">AU-months use the average of start- and end-of-month head × the class AU factor, starting at each class's "AU from" month. Divide a pasture's carrying capacity in AUMs by these to see how many days the plan needs from it; the year total is the forage demand to line up against your grazing plan.</div>
    </div>
  );
}

// ── CASH FLOW: cattle sales, purchases, other income and direct costs by month ──
function SfCash({ plan, res }) {
  const months = res.months, d = plan.data;
  const [div, setDiv] = useState('');
  const src = div ? (res.cashByDiv[div] || { sales: Array(12).fill(0), purchases: Array(12).fill(0), income: Array(12).fill(0), costs: Array(12).fill(0) }) : res.cash;
  const head = Array(12).fill(0);
  res.moves.forEach(m => { const c = d.classes.find(k => k.id === m.classId); if (m.type === 'sale' && (!div || c?.division === div)) head[sfMi(m.month)] += m.qty; });
  const net = months.map((_, i) => src.sales[i] + src.income[i] - src.purchases[i] - src.costs[i]);
  let run = 0; const cum = net.map(n => (run += n));
  const rows = [['Cattle sales', src.sales, 1], ['Other income', src.income, 1], ['Cattle purchases', src.purchases, -1], ['Direct costs', src.costs, -1]];
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const exportCsv = () => sfDownload(`cash_flow_${plan.name}${div ? '_' + div : ''}.csv`, [['', ...months.map(m => m.key), 'Total'],
    ['Head sold', ...head.map(x => Math.round(x)), Math.round(sum(head))], ...rows.map(([l, a, s]) => [l, ...a.map(x => Math.round(x * s)), Math.round(sum(a) * s)]),
    ['Net cash', ...net.map(Math.round), Math.round(sum(net))], ['Cumulative', ...cum.map(Math.round), '']]);
  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
        <select className="filter-select" value={div} onChange={e => setDiv(e.target.value)}><option value="">All divisions</option>{[...new Set(d.classes.map(c => c.division))].map(v => <option key={v}>{v}</option>)}</select>
        <button className="btn btn-ghost" style={{ marginLeft: 'auto' }} onClick={exportCsv}>Export CSV</button>
      </div>
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead><tr><th></th>{months.map(m => <th key={m.key} style={{ textAlign: 'right' }}>{m.label}</th>)}<th style={{ textAlign: 'right' }}>Total</th></tr></thead><tbody>
        <tr><td className="sf-calc">Head sold</td>{head.map((h, i) => <td key={i} className="n sf-calc">{h > 0.05 ? sf0(h) : '—'}</td>)}<td className="n sf-calc">{sf0(sum(head))}</td></tr>
        {rows.map(([l, a, s]) => <tr key={l}><td>{l}</td>{a.map((x, i) => <td key={i} className="n">{Math.abs(x) > 0.5 ? sf$(x * s) : '—'}</td>)}<td className="n" style={{ fontWeight: 700 }}>{sf$(sum(a) * s)}</td></tr>)}
        <tr className="tot"><td>Net cash</td>{net.map((x, i) => <td key={i} className="n" style={{ color: x < -0.5 ? '#e8836a' : undefined }}>{sf$(x)}</td>)}<td className="n">{sf$(sum(net))}</td></tr>
        <tr><td className="sf-calc">Cumulative</td>{cum.map((x, i) => <td key={i} className="n sf-calc" style={{ color: x < -0.5 ? '#e8836a' : undefined }}>{sf$(x)}</td>)}<td></td></tr>
      </tbody></table></div>
      <div className="sf-note">Cattle cash at 100% ownership. Transfers between divisions and opportunity interest are non-cash and left out. Overhead, debt service and living aren't in a stock flow plan — add them in your whole-ranch cash flow.</div>
    </div>
  );
}

  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '14px', alignItems: 'center' }}>
        <select className="filter-select" value={mine ? 'my' : 'all'} onChange={e => setMine(e.target.value === 'my')}><option value="all">100% ownership</option><option value="my">My share (class share %)</option></select>
        <span className="sf-note" style={{ margin: 0 }}>{mine ? 'Values, sales, purchases and transfers are taken at each class\'s share %. Direct costs stay at 100% — you carry the expenses on share cattle.' : 'Every head at full value, regardless of who owns it.'}</span>
      </div>

              <div className="table-wrap"><table className="sf-table"><thead><tr><th>Valuation</th><th style={{ textAlign: 'right' }}>$/hd</th><th style={{ textAlign: 'right' }}>Open #</th><th style={{ textAlign: 'right' }}>Open $</th><th style={{ textAlign: 'right' }}>Close #</th><th style={{ textAlign: 'right' }}>Close $</th></tr></thead><tbody>
                {list.map(c => { const r = res.classes[c.id], sh = mine ? sfShare(c) : 1; return <tr key={c.id}><td>{c.name}{mine && sh !== 1 ? <span className="sf-calc"> · {c.sharePct}%</span> : ''}</td><td className="n">{c.value ? sf$(c.value) : '—'}{sfHas(c.closeValue) && c.closeValue !== c.value ? ` → ${sf$(c.closeValue)}` : ''}</td><td className="n">{sf0(r.open * sh)}</td><td className="n">{sf$(r.openValue * sh)}</td><td className="n">{sf0(r.close * sh)}</td><td className="n">{sf$(r.closeValue * sh)}</td></tr>; })}
                <tr className="tot"><td>Total</td><td></td><td></td><td className="n">{sf$(v.openValue)}</td><td></td><td className="n">{sf$(v.closeValue)}</td></tr>
              </tbody></table></div>
              <div className="table-wrap"><table className="sf-table"><tbody>

                <L label="Closing inventory value" v={v.closeValue} />
                <L sign="+" label="Sales" v={v.sales} />
                <L sign="+" label="Other income" v={v.otherIncome} />
                <L sign="+" label="Transfers out" v={v.outDiv} />
                <L sign="−" label="Transfers in" v={v.inDiv} />
                <L sign="−" label="Opening inventory value" v={v.openValue} />
                <L sign="−" label="Purchases" v={v.purchases} />
                <L label="= Gross product" v={v.grossProduct} bold />

                <L label={`Opportunity interest (${sfNum(d.oppRate)}% of opening value)`} v={mine ? dv.my.oppInterest : dv.oppInterest} />
