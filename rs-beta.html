// ── PLAN vs ACTUAL: read RS inventory live, compare to plan-to-date, forecast the close ──
function SfActual({ plan, res, upd, herds, toast }) {
  const d = plan.data, months = res.months;
  const [act, setAct] = useState(null);
  const [loading, setLoading] = useState(false);
  const start = months[0].key + '-01';
  const endDate = (() => { const [y, m] = months[11].key.split('-').map(Number); const e = new Date(y, m, 0); return `${e.getFullYear()}-${String(e.getMonth() + 1).padStart(2, '0')}-${String(e.getDate()).padStart(2, '0')}`; })();
  const today = todayLocal(), asOf = today < endDate ? today : endDate;
  const curIdx = asOf < start ? -1 : months.findIndex(m => m.key === asOf.slice(0, 7));
  const mapped = d.classes.filter(c => (c.herdIds || []).length);

  const load = async () => {
    const herdIds = [...new Set(mapped.flatMap(c => c.herdIds.map(String)))];
    if (!herdIds.length) { setAct({ none: true }); return; }
    setLoading(true);
    try {
      const { data: an, error } = await chunkedIn(herdIds, ch => supabase.from('animals').select('id, herd_id, sex, status, status_date, created_at, purchased').in('herd_id', ch).limit(10000));
      if (error) throw new Error(error.message);
      const classOf = (a) => d.classes.find(c => (c.herdIds || []).map(String).includes(String(a.herd_id)) && (!(c.sexes || []).length || c.sexes.includes(a.sex)));
      const A = Object.fromEntries(d.classes.map(c => [c.id, { open: 0, now: 0, sold: 0, dead: 0, added: 0, purchased: 0, births: 0, preg: 0, pregOpen: 0 }]));
      const idClass = {};
      (an || []).forEach(a => {
        const c = classOf(a); if (!c) return; const t = A[c.id]; idClass[a.id] = c.id;
        const created = (a.created_at || '').slice(0, 10), sd = a.status_date || '';
        if (created < start && (a.status === 'active' || (sd && sd >= start))) t.open++;
        if (a.status === 'active') t.now++;
        if (a.status === 'sold' && sd >= start && sd <= asOf) t.sold++;
        if (a.status === 'dead' && sd >= start && sd <= asOf) t.dead++;
        if (created >= start && created <= asOf) { t.added++; if (a.purchased) t.purchased++; }
      });
      const ids = Object.keys(idClass);
      const { data: cv } = await chunkedIn(ids, ch => supabase.from('calving_records').select('dam_id, calf_status, calving_date').in('dam_id', ch).gte('calving_date', start).lte('calving_date', asOf).limit(10000));
      (cv || []).forEach(r => { if (r.calf_status === 'alive' && idClass[r.dam_id]) A[idClass[r.dam_id]].births++; });
      const { data: pc, error: pcErr } = await chunkedIn(ids, ch => supabase.from('preg_checks').select('animal_id, check_date, result').in('animal_id', ch).gte('check_date', start).lte('check_date', asOf).order('check_date', { ascending: false }).limit(10000));
      if (!pcErr) { const seen = new Set(); (pc || []).forEach(p => { if (seen.has(p.animal_id)) return; seen.add(p.animal_id); const t = A[idClass[p.animal_id]]; if (!t) return; t.preg++; if (p.result === 'open') t.pregOpen++; }); }
      setAct({ A, pregAvailable: !pcErr, loadedAt: new Date().toLocaleTimeString() });
    } catch (e) { toast('Error reading RS: ' + e.message, 'error'); }
    setLoading(false);
  };
  useEffect(() => { load(); }, [plan.id]);

  const applyOpen = () => { if (!confirm('Set each mapped class\'s Year Open to the RS head count on the first day of the plan?')) return;
    upd(x => x.classes.forEach(c => { if ((c.herdIds || []).length && act.A[c.id]) c.open = act.A[c.id].open; })); toast('Opening counts updated from RS — save to keep', 'success'); };
  const applyPreg = (c) => { const t = act.A[c.id]; upd(x => { x.classes.find(k => k.id === c.id).openPct = Math.round(t.pregOpen / t.preg * 1000) / 10; }); toast(`${c.name}: open % set from ${t.preg} preg checks`, 'success'); };

  const orig = d.original?.byClass || {};
  const V = ({ plan: p, act: a }) => { const diff = a - p; return <><td className="n sf-calc">{sf0(p)}</td><td className="n">{a === null ? '—' : sf0(a)}</td><td className="n" style={{ color: a === null || Math.abs(diff) < 0.5 ? 'var(--ash)' : diff > 0 ? 'var(--sage)' : '#e8836a' }}>{a === null || Math.abs(diff) < 0.5 ? '' : (diff > 0 ? '+' : '') + sf0(diff)}</td></>; };

  return (
    <div>
      <div style={{ display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '12px', flexWrap: 'wrap' }}>
        <div className="sf-note" style={{ margin: 0 }}>As of <b>{formatDate(asOf)}</b> — {curIdx < 0 ? 'plan year hasn\'t started' : `month ${curIdx + 1} of 12`}. RS is the official record; nothing here writes to inventory.{act?.loadedAt ? ` Read ${act.loadedAt}.` : ''}</div>
        <button className="btn btn-ghost" style={{ marginLeft: 'auto' }} disabled={loading} onClick={load}>{loading ? 'Reading RS…' : 'Refresh from RS'}</button>
        {act?.A && <button className="btn btn-secondary" onClick={applyOpen}>Use RS opening counts</button>}
      </div>
      {!mapped.length && <div className="sf-warn">No classes are mapped to RS herds yet. Map them on Setup → RS mapping.</div>}
      <div className="table-wrap sf-scroll"><table className="sf-table"><thead>
        <tr><th rowSpan={2}>Class</th><th colSpan={3} style={{ textAlign: 'center' }}>Year open</th><th colSpan={3} style={{ textAlign: 'center' }}>Births to date</th><th colSpan={3} style={{ textAlign: 'center' }}>Sold to date</th><th colSpan={3} style={{ textAlign: 'center' }}>Died to date</th><th colSpan={3} style={{ textAlign: 'center' }}>Head now</th><th colSpan={3} style={{ textAlign: 'center' }}>Year close</th><th rowSpan={2}>Preg check open %</th></tr>
        <tr>{['Plan', 'RS', '±', 'Plan', 'RS', '±', 'Plan', 'RS', '±', 'Plan', 'RS', '±', 'Plan', 'RS', '±'].map((h, i) => <th key={i} style={{ textAlign: 'right' }}>{h}</th>)}<th style={{ textAlign: 'right' }}>Original</th><th style={{ textAlign: 'right' }}>Plan</th><th style={{ textAlign: 'right' }}>Forecast</th></tr>
      </thead><tbody>
        {d.classes.map(c => {
          const r = res.classes[c.id], t = act?.A?.[c.id], isMapped = (c.herdIds || []).length > 0, a = isMapped && t ? t : null;
          // planned to date by type, from the resolved movements and the month schedule
          let pb = 0, ps = 0, pd = 0; const upto = Math.min(curIdx, 11);
          res.moves.forEach(m => { if (m.classId === c.id && m.type === 'sale' && sfMi(m.month) <= upto) ps += m.qty; });
          if (c.kind === 'breeding' && c.calves && sfMi(c.calvingMonth) <= upto) pb = r.wet;
          const first = r.bornMonth !== null && r.open < 0.0001 ? r.bornMonth : 0;
          if (sfHas(c.deathMonth)) pd = sfMi(c.deathMonth) <= upto ? r.deaths : 0; else pd = upto < first ? 0 : r.deaths * (upto - first + 1) / (12 - first);
          const ptd = sfPlannedToDate(r, upto);
          let remIn = 0, remOut = 0; for (let i = upto + 1; i < 12; i++) { remIn += r.flows[i].in; remOut += r.flows[i].out; }
          const forecast = a ? a.now + remIn - remOut : null;
          return (
            <tr key={c.id} style={{ opacity: isMapped ? 1 : 0.55 }}>
              <td>{c.name}{!isMapped && <div className="sf-calc" style={{ fontSize: '10px' }}>not mapped — plan only</div>}{a && a.added > 0 && <div className="sf-calc" style={{ fontSize: '10px' }}>{a.added} entered in RS this year{a.purchased ? ` (${a.purchased} purchased)` : ''}</div>}</td>
              <V plan={r.open} act={a ? a.open : null} />
              <V plan={pb} act={a ? a.births : null} />
              <V plan={ps} act={a ? a.sold : null} />
              <V plan={pd} act={a ? a.dead : null} />
              <V plan={ptd.head} act={a ? a.now : null} />
              <td className="n sf-calc">{orig[c.id] ? sf0(orig[c.id].close) : '—'}</td>
              <td className="n">{sf0(r.close)}</td>
              <td className="n" style={{ fontWeight: 700 }}>{forecast === null ? '—' : sf0(forecast)}</td>
              <td className="n">{c.kind === 'breeding' && a && a.preg > 0 ? <span>{sfPct(a.pregOpen / a.preg)} <span className="sf-calc">({a.preg})</span> <button className="btn-icon" title="Use this as the plan's expected open %" onClick={() => applyPreg(c)}>⇢</button></span> : <span className="sf-calc">—</span>}</td>
            </tr>
          );
        })}
      </tbody></table></div>
      <div className="sf-note">
        <b>Plan to date</b> runs through the current month on the plan's month schedule (deaths spread evenly). <b>Forecast</b> = RS head now + the plan's remaining movements for the rest of the year — so when actual deaths or sales run ahead or behind, the year-end close and everything downstream (grazing AUs, marketings) moves with it. To re-forecast properly, update the rates or quantities on the other tabs (preg-check open % can be pulled straight in with ⇢), then Save. Lock an original budget first if you want to keep the before-and-after.
        {act && act.pregAvailable === false && ' Preg-check history table not found — open % from RS is unavailable.'}
        {' '}Calves that aren't entered in RS until weaning will show as "entered this year" rather than births; the 2026 green-tag stocker cows without unique VIDs will undercount until they're tagged.
      </div>
    </div>
  );
}

function LogsPage({ toast }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selected, setSelected] = useState(null);

  const fetchLogs = async () => {
    setLoading(true);
    const { data, error } = await supabase.from('conversation_log').select('*').order('created_at', { ascending: false }).limit(200);
    if (error) toast('Error: ' + error.message, 'error');
    else setLogs(data || []);
    setLoading(false);
  };

  useEffect(() => { fetchLogs(); }, []);

  const handleRollback = async (log) => {
    // NOTE: this only FLAGS the log entry — it does NOT reverse the underlying sale/death/status
    // changes. True reversal requires storing affected animal IDs in conversation_log (schema change).
    if (!window.confirm('This marks the log entry as rolled back, but does NOT undo the database changes (sale records, death records, status updates). You must reverse those manually in Animal Inventory.\n\nContinue?')) return;
    const { error } = await supabase.from('conversation_log').update({ status: 'rolled_back', rolled_back_at: new Date().toISOString() }).eq('id', log.id);
    if (error) toast('Error: ' + error.message, 'error');
    else { toast('Flagged as rolled back — remember to reverse the data manually', 'success'); fetchLogs(); setSelected(null); }
  };

  const statusColor = (s) => ({ completed: 'var(--sage)', failed: '#e05555', rolled_back: 'var(--ash)', cancelled: 'var(--hay)' }[s] || 'var(--ash)');

  return (
    <div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px'}}>
        <p style={{color:'var(--ash)', fontSize:'13px'}}>Complete audit trail of all conversational entries. Click any row to view details or roll back.</p>
        <button className="btn btn-ghost" onClick={fetchLogs}>↻ Refresh</button>
      </div>
      <div className="table-wrap">
        {loading ? <div className="loading"><div className="spinner"></div> Loading logs...</div>
        : logs.length === 0 ? <div className="empty-state"><h3>No log entries yet</h3><p>Field entries will appear here.</p></div>
        : <table>
            <thead><tr><th>Date / Time</th><th>Type</th><th>Input</th><th>Interpretation</th><th>Status</th></tr></thead>
            <tbody>
              {logs.map(l => (
                <tr key={l.id} onClick={() => setSelected(l)}>
                  <td className="td-mono" style={{fontSize:'11px', whiteSpace:'nowrap'}}>{new Date(l.created_at).toLocaleString()}</td>
                  <td><span className="badge badge-steer" style={{fontSize:'11px'}}>{l.action_type || '—'}</span></td>
                  <td style={{maxWidth:'250px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', color:'var(--ash)', fontSize:'13px'}}>{l.raw_input}</td>
                  <td style={{maxWidth:'200px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontSize:'13px'}}>{l.ai_interpretation || '—'}</td>
                  <td><span style={{color: statusColor(l.status), fontFamily:'IBM Plex Mono', fontSize:'11px'}}>● {l.status}</span></td>
                </tr>
              ))}
            </tbody>
          </table>}
      </div>
      {selected && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setSelected(null)}>
          <div className="modal" style={{maxWidth:'600px'}}>
            <div className="modal-header"><h2 className="modal-title">Log Entry Detail</h2><button className="modal-close" onClick={() => setSelected(null)}>✕</button></div>
            <div className="modal-body">
              <div className="detail-card"><h3>Entry Info</h3><div className="detail-row"><span className="detail-key">Date/Time</span><span className="detail-val">{new Date(selected.created_at).toLocaleString()}</span></div><div className="detail-row"><span className="detail-key">Action Type</span><span className="detail-val">{selected.action_type || '—'}</span></div><div className="detail-row"><span className="detail-key">Status</span><span className="detail-val" style={{color: statusColor(selected.status)}}>{selected.status}</span></div></div>
              <div className="detail-card" style={{marginTop:'12px'}}><h3>Raw Input</h3><p style={{color:'var(--cream)', fontSize:'14px', lineHeight:'1.5'}}>{selected.raw_input}</p></div>
              {selected.ai_interpretation && <div className="detail-card" style={{marginTop:'12px'}}><h3>AI Interpretation</h3><p style={{color:'var(--cream)', fontSize:'14px'}}>{selected.ai_interpretation}</p></div>}
            </div>
            <div className="modal-footer"><button className="btn btn-ghost" onClick={() => setSelected(null)}>Close</button>{selected.status === 'completed' && <button className="btn btn-danger" onClick={() => handleRollback(selected)}>↩ Flag as Rolled Back</button>}</div>
          </div>
        </div>
      )}
    </div>
  );
}

// ===== LOGIN PAGE =====
function LoginPage({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [forgot, setForgot] = useState(false);
  const [sent, setSent] = useState(false);

  const sendReset = async () => {
    if (!email.trim()) { setError('Enter your email address.'); return; }
    setLoading(true); setError('');
    const { error: e } = await supabase.auth.resetPasswordForEmail(email.trim(), { redirectTo: APP_URL });
    setLoading(false);
    // Same message whether or not the address has an account, so the form can't be used to probe for users
    if (e && !/not found|no user/i.test(e.message)) setError(e.message);
    else setSent(true);
  };

  const handleLogin = async () => {
    if (!email || !password) { setError('Please enter your email and password.'); return; }
    setLoading(true); setError('');
    const { error: authError } = await supabase.auth.signInWithPassword({ email, password });
    if (authError) {
      // Only call it a bad password when Supabase says so — network, sandbox and account problems need their real message
      const m = authError.message || '';
      setError(/invalid login credentials/i.test(m) ? 'Wrong email or password. Use "Forgot password?" below to reset it.'
        : /fetch|network|load failed/i.test(m) ? `Couldn't reach the server (${m}). Check your connection — this page has to run from your RanchSavvy web address, not a preview or a downloaded file.`
        : /not confirmed/i.test(m) ? 'This email address hasn\'t been confirmed yet — check your inbox for the confirmation link.'
        : `Sign-in failed: ${m}`);
      setLoading(false);
    }
    else { onLogin(); }
  };

  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--soil)', backgroundImage:'radial-gradient(ellipse at 20% 50%, rgba(58,125,123,0.15) 0%, transparent 60%)'}}>
      <div style={{background:'var(--charcoal)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'8px', padding:'48px 40px', width:'100%', maxWidth:'400px', boxShadow:'0 20px 60px rgba(0,0,0,0.5)'}}>
        <div style={{textAlign:'center', marginBottom:'36px'}}>
          <h1 style={{fontFamily:'Syncopate, sans-serif', fontSize:'28px', fontWeight:'700', color:'var(--hay)', letterSpacing:'4px', textTransform:'uppercase', lineHeight:'1.2'}}>Ranch Savvy</h1>
          <p style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', letterSpacing:'3px', color:'var(--ash)', marginTop:'8px', textTransform:'uppercase'}}>Cattle Management Platform</p>
        </div>
        {forgot ? (
          <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
            {sent ? <>
              <p style={{color:'var(--cream)', fontSize:'14px', lineHeight:1.6}}>If <strong>{email.trim()}</strong> has a RanchSavvy login, a reset link is on its way. Open it on this device to set a new password.</p>
              <p style={{color:'var(--ash)', fontSize:'12px', lineHeight:1.5}}>Nothing after a few minutes? Check spam. The link works once and expires after an hour.</p>
            </> : <>
              <p style={{color:'var(--ash)', fontSize:'13px', lineHeight:1.5}}>Enter your email and we'll send a link to set a new password.</p>
              <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" placeholder="your@email.com" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key==='Enter'&&sendReset()} autoFocus /></div>
              {error && <div style={{background:'rgba(224,85,85,0.1)', border:'1px solid rgba(224,85,85,0.4)', borderRadius:'4px', padding:'10px 14px', color:'#e05555', fontSize:'13px'}}>{error}</div>}
              <button className="btn btn-primary" onClick={sendReset} disabled={loading} style={{padding:'12px', fontSize:'15px'}}>{loading ? 'Sending...' : 'Send Reset Link'}</button>
            </>}
            <button className="btn btn-ghost" onClick={() => { setForgot(false); setSent(false); setError(''); }}>← Back to sign in</button>
          </div>
        ) : (
        <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
          <div className="form-group"><label className="form-label">Email</label><input className="form-input" type="email" placeholder="your@email.com" value={email} onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key==='Enter'&&handleLogin()} autoFocus /></div>
          <div className="form-group"><label className="form-label">Password</label><input className="form-input" type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key==='Enter'&&handleLogin()} /></div>
          {error && <div style={{background:'rgba(224,85,85,0.1)', border:'1px solid rgba(224,85,85,0.4)', borderRadius:'4px', padding:'10px 14px', color:'#e05555', fontSize:'13px'}}>{error}</div>}
          <button className="btn btn-primary" onClick={handleLogin} disabled={loading} style={{padding:'12px', fontSize:'15px', marginTop:'8px'}}>{loading ? 'Signing in...' : 'Sign In'}</button>
          <button onClick={() => { setForgot(true); setError(''); }} style={{background:'none', border:'none', color:'var(--ash)', fontSize:'13px', cursor:'pointer', textDecoration:'underline', padding:0}}>Forgot password?</button>
        </div>
        )}
        <div style={{marginTop:'24px', textAlign:'center', fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', color:'var(--ash)', letterSpacing:'1px'}}>RANCHSAVVY.COM · SECURE LOGIN</div>
      </div>
    </div>
  );
}

// Shown after arriving from a reset email: the link signs the person in, this sets the new password
function SetPasswordPage({ onDone }) {
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const save = async () => {
    if (pw.length < 8) { setError('Use at least 8 characters.'); return; }
    if (pw !== pw2) { setError("The two passwords don't match."); return; }
    setSaving(true); setError('');
    const { error: e } = await supabase.auth.updateUser({ password: pw });
    setSaving(false);
    if (e) setError(e.message); else onDone();
  };
  return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--soil)'}}>
      <div style={{background:'var(--charcoal)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'8px', padding:'40px', width:'100%', maxWidth:'400px'}}>
        <h2 style={{fontFamily:'Syncopate, sans-serif', fontSize:'18px', color:'var(--hay)', letterSpacing:'3px', textTransform:'uppercase', marginBottom:'24px', textAlign:'center'}}>Set New Password</h2>
        <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
          <div className="form-group"><label className="form-label">New Password</label><input className="form-input" type="password" autoComplete="new-password" value={pw} onChange={e => setPw(e.target.value)} autoFocus /></div>
          <div className="form-group"><label className="form-label">Confirm New Password</label><input className="form-input" type="password" autoComplete="new-password" value={pw2} onChange={e => setPw2(e.target.value)} onKeyDown={e => e.key==='Enter'&&save()} /></div>
          {error && <div style={{background:'rgba(224,85,85,0.1)', border:'1px solid rgba(224,85,85,0.4)', borderRadius:'4px', padding:'10px 14px', color:'#e05555', fontSize:'13px'}}>{error}</div>}
          <button className="btn btn-primary" onClick={save} disabled={saving} style={{padding:'12px', fontSize:'15px'}}>{saving ? 'Saving...' : 'Save Password'}</button>
        </div>
      </div>
    </div>
  );
}

// ===== MAIN APP =====
function App() {
  const [page, setPage] = useState('animals');
  const [toast, setToast] = useState(null);
  const [session, setSession] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [pendingHerdFilter, setPendingHerdFilter] = useState(null);
  const [recovering, setRecovering] = useState(ARRIVED_FROM_RESET_LINK);

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => { setSession(session); setAuthLoading(false); });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') setRecovering(true);
      setSession(session);
    });
    return () => subscription.unsubscribe();
  }, []);

  const handleLogout = async () => { await supabase.auth.signOut(); setSession(null); };
  const showToast = (message, type = 'success') => { setToast({ message, type }); };
  const navigateToAnimalsWithHerd = (herdId) => { setPendingHerdFilter(herdId); setPage('animals'); };

  const pageTitles = {
    animals: 'Animal Inventory', herds: 'Herd Management', partnerships: 'Ownership Partnerships',
    reports: 'Reports', import: 'Bulk Import', chat: 'Field Entry', logs: 'Entry Log',
    calving_gap: 'Calving Gap', planning: 'Stock Flow Planning',
  };

  if (authLoading) return (
    <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--soil)'}}>
      <div style={{display:'flex', alignItems:'center', gap:'12px', color:'var(--ash)'}}><div className="spinner"></div><span style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px', letterSpacing:'2px'}}>LOADING...</span></div>
    </div>
  );

  if (!session) return <LoginPage onLogin={() => {}} />;
  if (recovering) return <SetPasswordPage onDone={() => {
    setRecovering(false);
    window.history.replaceState(null, '', APP_URL);   // drop the reset tokens from the address bar
    showToast('Password updated', 'success');
  }} />;

  return (
    <div>
      <div className={`sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
        <div className="logo">
          <h1>{sidebarCollapsed ? 'RS' : 'Ranch\nSavvy'}</h1>
          {!sidebarCollapsed && <span>Cattle Management <b style={{color:'var(--rust)'}}>· BETA</b></span>}
        </div>
        <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} style={{position:'absolute', top:'16px', right: sidebarCollapsed ? '8px' : '16px', background:'none', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'3px', color:'var(--ash)', fontSize:'14px', padding:'4px 8px', cursor:'pointer'}}>
          {sidebarCollapsed ? '→' : '←'}
        </button>

        <div className="nav-section">
          {!sidebarCollapsed && <div className="nav-label">Inventory</div>}
          {['animals','herds','partnerships','reports'].map(id => {
            const n = NAV.find(x => x.id === id);
            return <div key={id} className={`nav-item ${page === id ? 'active' : ''}`} onClick={() => setPage(id)} title={sidebarCollapsed ? n.label : ''}><span className="nav-icon">{NAV_ICONS[id]}</span>{!sidebarCollapsed && <span>{n.label}</span>}</div>;
          })}
        </div>

        <div className="nav-section">
          {!sidebarCollapsed && <div className="nav-label">Data Entry</div>}
          {['import','chat','logs'].map(id => {
            const n = NAV.find(x => x.id === id);
            return <div key={id} className={`nav-item ${page === id ? 'active' : ''}`} onClick={() => setPage(id)} title={sidebarCollapsed ? n.label : ''}><span className="nav-icon">{NAV_ICONS[id]}</span>{!sidebarCollapsed && <span>{n.label}</span>}</div>;
          })}
        </div>

        <div className="nav-section">
          {!sidebarCollapsed && <div className="nav-label">Analytics</div>}
          <div className={`nav-item ${page === 'calving_gap' ? 'active' : ''}`} onClick={() => setPage('calving_gap')} title={sidebarCollapsed ? 'Calving Gap' : ''}>
            <span className="nav-icon">{NAV_ICONS['calving_gap']}</span>
            {!sidebarCollapsed && <span>Calving Gap</span>}
          </div>
        </div>

        <div className="nav-section">
          {!sidebarCollapsed && <div className="nav-label">Planning</div>}
          <div className={`nav-item ${page === 'planning' ? 'active' : ''}`} onClick={() => setPage('planning')} title={sidebarCollapsed ? 'Stock Flow Plan' : ''}>
            <span className="nav-icon">{NAV_ICONS['planning']}</span>
            {!sidebarCollapsed && <span>Stock Flow Plan</span>}
          </div>
        </div>

        <div className="sidebar-footer">
          {!sidebarCollapsed && (
            <>
              <div style={{marginBottom:'8px', color:'var(--hay)', fontSize:'11px', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}>{session.user.email}</div>
              <button onClick={handleLogout} style={{background:'none', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'3px', color:'var(--ash)', fontSize:'11px', fontFamily:'IBM Plex Mono, monospace', padding:'4px 8px', cursor:'pointer', letterSpacing:'1px', width:'100%'}}>SIGN OUT</button>
              <div style={{marginTop:'8px', fontSize:'11px', color:'rgba(154,175,184,0.5)'}}>Ranch Savvy v1.2</div>
            </>
          )}
        </div>
      </div>

      <div className="main" style={{marginLeft: sidebarCollapsed ? '60px' : '220px'}}>
        <div className="topbar">
          <h1 className="page-title">{pageTitles[page]}</h1>
          <div className="topbar-actions">
            {page === 'animals' && <button className="btn btn-primary" onClick={() => window.__addAnimal && window.__addAnimal()}>+ Add Animal</button>}
          </div>
        </div>
        <div className="content">
          {page === 'animals' && <AnimalsPage toast={showToast} pendingHerdFilter={pendingHerdFilter} clearPendingFilter={() => setPendingHerdFilter(null)} />}
          {page === 'herds' && <HerdsPage toast={showToast} navigateToAnimals={navigateToAnimalsWithHerd} />}
          {page === 'partnerships' && <PartnershipsPage toast={showToast} />}
          {page === 'reports' && <ReportsPage toast={showToast} />}
          {page === 'import' && <ImportPage toast={showToast} />}
          {page === 'chat' && <ChatPage toast={showToast} />}
          {page === 'logs' && <LogsPage toast={showToast} />}
          {page === 'calving_gap' && <CalvingGapPage toast={showToast} />}
          {page === 'planning' && <PlanningPage toast={showToast} />}
        </div>
      </div>

      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
