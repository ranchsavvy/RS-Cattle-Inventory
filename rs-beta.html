      // Current owner = latest effective_date, same rule as Animal Inventory and the Head Count report
      const PAGE = 1000; const latest = {};
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await supabase.from('animal_ownership_history').select('id, animal_id, partnership_id, effective_date').order('id', { ascending: true }).range(from, from + PAGE - 1);
        if (error) { toast(`Couldn't load ownership history: ${error.message}`, 'error'); return; }
        (data || []).forEach(o => { const cur = latest[o.animal_id]; if (!cur || String(o.effective_date) > String(cur.effective_date)) latest[o.animal_id] = o; });
        if (!data || data.length < PAGE) break;
      }
      setOwnerNow(latest);
    })();
    (async () => {
      const PAGE = 1000; let rows = [];
      for (let from = 0; ; from += PAGE) {
        const { data, error } = await supabase.from('animals').select('*').eq('status', 'active').order('id', { ascending: true }).range(from, from + PAGE - 1);
        if (error) { toast(`Couldn't load animals: ${error.message}`, 'error'); return; }
        rows = rows.concat(data || []);
        if (!data || data.length < PAGE) break;
      }
      setAnimals(rows);
    })();
  }, []);

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const { headers, rows } = parseCSV(e.target.result);
      if (!headers.length || !rows.length) { toast('No rows found in that file', 'error'); return; }
      setFileName(file.name);
      setCsvData({ headers, rows });
      // Guess the tag column for the chosen match type, then the field columns (each header used once)
      const used = new Set();
      const tag = headers.find(h => MATCH_GUESS[matchBy].test(h.trim())) || '';
      if (tag) used.add(tag);
      setTagCol(tag);
      const map = {};
      UPDATE_FIELD_GUESS.forEach(([key, re]) => {
        if (key === matchBy) return;
        const h = headers.find(h => !used.has(h) && re.test(h.trim()));
        if (h) { map[key] = h; used.add(h); }
      });
      setColumnMap(map);
      setValueMap({});
      setStep('map');
    };
    reader.readAsText(file);
  };

  // Distinct values in the result column, with counts, so odd codes get a human decision
  const resultValues = useMemo(() => {
    const col = columnMap.breeding_status;
    if (!csvData || !col) return [];
    const counts = {};
    csvData.rows.forEach(r => { const v = String(r[col] ?? '').trim(); counts[v] = (counts[v] || 0) + 1; });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }, [csvData, columnMap.breeding_status]);

  const mappedStatus = (raw) => {
    const v = String(raw ?? '').trim();
    return v in valueMap ? valueMap[v] : guessBreedingStatus(v, bredDefault);
  };

  const buildPreview = () => {
    if (!tagCol) { toast(`Pick the column that holds the ${MATCH_LABEL[matchBy]}`, 'error'); return; }
    if (!animals) { toast('Still loading animals — try again in a second', 'error'); return; }
    if (UPDATE_FIELDS.some(f => f.score && columnMap[f.key]) && scoresOk === false) { toast('Run the cow-score setup SQL first (shown below the column list), or skip those columns', 'error'); return; }
    const ownerOn = !!(columnMap.owner || ownerDefault);
    if (ownerOn && !ownerNow) { toast('Still loading ownership history — try again in a second', 'error'); return; }
    if (ownerOn && !ownerDate) { toast('Pick an effective date for the ownership change', 'error'); return; }
    const norm = MATCH_NORM[matchBy];
    const index = {}; // normalized tag -> [animals]
    animals.forEach(a => { const k = norm(a[matchBy]); if (k) (index[k] = index[k] || []).push(a); });
    const vidIndex = {}, eidIndex = {};
    animals.forEach(a => { if (a.vid) (vidIndex[normVid(a.vid)] = vidIndex[normVid(a.vid)] || []).push(a.id); if (a.eid) (eidIndex[normEid(a.eid)] = eidIndex[normEid(a.eid)] || []).push(a.id); });
    const seen = {};
    const doPreg = recordPreg && pregTableOk && !!columnMap.breeding_status;

    const rows = csvData.rows.map((row, i) => {
      const rowNum = i + 2; // spreadsheet row (header is row 1)
      const tag = String(row[tagCol] ?? '').trim();
      const r = { rowNum, tag, animal: null, patch: {}, changes: [], notesAppend: '', preg: null, errors: [], warnings: [] };
      if (!tag) { r.errors.push('No tag'); return r; }
      let candidates = index[norm(tag)] || [];
      if (herdScope) {
        const inScope = candidates.filter(a => String(a.herd_id) === herdScope);
        if (!inScope.length && candidates.length) { r.errors.push(`Not in ${herdName(herdScope)} — found in ${[...new Set(candidates.map(a => herdName(a.herd_id)))].join(', ')}`); return r; }
        candidates = inScope;
      }
      if (!candidates.length) { r.errors.push(`No active animal with ${MATCH_LABEL[matchBy]} ${tag}`); return r; }
      if (candidates.length > 1) { r.errors.push(`${candidates.length} active animals share this tag (${candidates.map(a => herdName(a.herd_id)).join(', ')}) — set a herd scope or fix the duplicate`); return r; }
      const a = candidates[0];
      r.animal = a;
      if (seen[a.id]) { r.errors.push(`Same animal as row ${seen[a.id]}`); return r; }
      seen[a.id] = rowNum;

      const val = (key) => columnMap[key] ? String(row[columnMap[key]] ?? '').trim() : '';
      const change = (field, label, from, to, display) => {
        if ((from ?? '') === (to ?? '')) return;
        r.patch[field] = to; r.changes.push({ label, from: display ? display(from) : from, to: display ? display(to) : to });
      };

      // Breeding status / preg result
      const rawResult = val('breeding_status');
      if (columnMap.breeding_status && rawResult) {
        const status = mappedStatus(rawResult);
        if (!status) r.warnings.push(`Result "${rawResult}" not mapped — skipped`);
        else {
          if (!['cow', 'heifer'].includes(a.sex)) r.errors.push(`Breeding status on a ${a.sex} — check the tag`);
          change('breeding_status', 'Status', a.breeding_status, status, v => v ? v.replace('_', ' ') : '—');
          if (doPreg && (status === 'open' || status.startsWith('bred'))) {
            const rawDays = val('days_bred') || (!columnMap.days_bred && isNumeric(rawResult) ? rawResult : '');
            let days = null;
            if (rawDays) {
              if (isNumeric(rawDays)) days = Math.round(Number(rawDays));
              else if (columnMap.days_bred && columnMap.days_bred !== columnMap.breeding_status) r.warnings.push(`Days "${rawDays}" isn't a number — not recorded`);
            }
            if (status === 'open') days = null;
            if (days !== null && (days < 25 || days > 290)) { r.warnings.push(`${days} days bred looks off — not recorded`); days = null; }
            r.preg = {
              result: status === 'open' ? 'open' : 'bred',
              days_bred: days,
              calving_period: status === 'open' ? null : (val('calving_period') || null),
              expected_calving_date: days !== null ? addDays(checkDate, GESTATION_DAYS - days) : null,
            };
          }
        }
      }

      // Cow scores — blank leaves the current value; mouth/udder only make sense on females
      const female = ['cow', 'heifer'].includes(a.sex);
      const scoreObs = {}; // what the file says at this check, for preg_checks history (even if unchanged)
      const mRaw = val('mouth');
      if (mRaw) {
        const m = parseMouth(mRaw);
        if (m === null) r.warnings.push(`Mouth "${mRaw}" not recognized — skipped`);
        else if (!female) r.errors.push(`Mouth on a ${a.sex} — check the tag`);
        else { scoreObs.mouth = m; change('mouth', 'Mouth', a.mouth, m); }
      }
      const uRaw = val('udder_score');
      if (uRaw) {
        const u = parseUdder(uRaw);
        if (u === null) r.warnings.push(`Udder "${uRaw}" not A–F — skipped`);
        else if (!female) r.errors.push(`Udder score on a ${a.sex} — check the tag`);
        else { scoreObs.udder_score = u; change('udder_score', 'Udder', a.udder_score, u); }
      }
      const cRaw = val('condition_score');
      if (cRaw) {
        const c = parseBCS(cRaw);
        if (c === null) r.warnings.push(`Condition score "${cRaw}" not 1–6 — skipped`);
        else { scoreObs.condition_score = c; change('condition_score', 'BCS', a.condition_score == null ? null : Number(a.condition_score), c, bcsLabel); }
      }
      const alRaw = val('is_cull');
      if (alRaw) {
        const al = parseAlert(alRaw);
        if (al === null) r.warnings.push(`Alert "${alRaw}" not yes/no — skipped`);
        else change('is_cull', 'Cull', !!a.is_cull, al, cullLabel);
      }
      if (r.preg && pregScoresOk) Object.assign(r.preg, scoreObs);

      // Plain fields
      const herdRaw = val('herd_name');
      if (herdRaw) {
        const h = herds.find(h => h.name.toLowerCase() === herdRaw.toLowerCase());
        if (!h) r.errors.push(`Unknown herd "${herdRaw}"`);
        else change('herd_id', 'Herd', a.herd_id, h.id, herdName);
      }
      const projectRaw = val('project');
      if (projectRaw) {
        const pr = projects.find(p => normName(p.name) === normName(projectRaw));
        if (!pr) r.errors.push(`Unknown project "${projectRaw}" — add it under Animals → Projects`);
        else if (!pr.is_active) r.errors.push(`Project "${pr.name}" is archived`);
        else if ((a.project || null) !== pr.name) { change('project', 'Project', a.project, pr.name); r.patch.project_date = projectDate; }
      }
      const color = val('tag_color').toLowerCase();
      if (color) change('tag_color', 'Tag color', a.tag_color, color);
      const breed = val('breed');
      if (breed) change('breed', 'Breed', a.breed, breed);
      const dobRaw = val('date_of_birth');
      if (dobRaw) { const d = parseCSVDate(dobRaw); if (!d) r.errors.push(`Bad date "${dobRaw}"`); else change('date_of_birth', 'DOB', a.date_of_birth, d); }
      if (matchBy !== 'eid') {
        const eid = normEid(val('eid'));
        if (eid && eid !== normEid(a.eid)) {
          if ((eidIndex[eid] || []).some(id => id !== a.id)) r.errors.push(`EID ${eid} already on another active animal`);
          else change('eid', 'EID', a.eid, eid);
        }
      }
      if (matchBy !== 'vid') {
        const vid = val('vid');
        if (vid && normVid(vid) !== normVid(a.vid)) {
          if ((vidIndex[normVid(vid)] || []).some(id => id !== a.id)) r.errors.push(`VID ${vid} already on another active animal`);
          else change('vid', 'VID', a.vid, vid);
        }
      }
      // Ownership — a new dated row in animal_ownership_history (never overwrites the old owner)
      const ownerRaw = val('owner');
      const targetOwner = ownerRaw
        ? partnerships.find(p => normName(p.name) === normName(ownerRaw))
        : (ownerDefault ? partnerships.find(p => String(p.id) === ownerDefault) : null);
      if (ownerRaw && !targetOwner) r.errors.push(`Unknown owner "${ownerRaw}" — add it under Partnerships first`);
      else if (targetOwner) {
        const cur = ownerNow?.[a.id];
        if (targetOwner.is_active === false) r.errors.push(`Owner "${targetOwner.name}" is archived`);
        else if (!cur || String(cur.partnership_id) !== String(targetOwner.id)) {
          const curDate = cur ? String(cur.effective_date).slice(0, 10) : null;
          if (curDate && ownerDate < curDate) r.errors.push(`Already has an owner change dated ${curDate} — use that date or later`);
          else {
            // Same date as the current entry: correct that row instead of stacking two owners on one day
            r.owner = { partnership_id: targetOwner.id, replaceRowId: curDate === ownerDate ? cur.id : null, oldPartnershipId: cur?.partnership_id ?? null };
            r.changes.push({ label: r.owner.replaceRowId ? `Owner (fixes ${curDate} entry)` : 'Owner', from: cur ? ownerName(cur.partnership_id) : '', to: targetOwner.name });
          }
        }
      }

      const note = val('notes');
      if (note) r.notesAppend = note;
      return r;
    });

    // Females in the scoped herd that the file never mentioned — lost tags, missed cows, or dead/sold not recorded
    let miss = [];
    if (herdScope) {
      const hit = new Set(rows.filter(r => r.animal).map(r => r.animal.id));
      miss = animals.filter(a => String(a.herd_id) === herdScope && ['cow', 'heifer'].includes(a.sex) && !hit.has(a.id));
    }
    setPreview(rows);
    setMissing(miss);
    setFilter('all');
    setStep('preview');
  };

  const counts = useMemo(() => {
    const ok = preview.filter(r => r.animal && !r.errors.length);
    return {
      changes: ok.filter(r => r.changes.length || r.notesAppend).length,
      preg: ok.filter(r => r.preg).length,
      opens: ok.filter(r => r.preg?.result === 'open' || r.patch.breeding_status === 'open').length,
      noChange: ok.filter(r => !r.changes.length && !r.notesAppend && !r.preg).length,
      errors: preview.filter(r => r.errors.length).length,
      warnings: preview.filter(r => !r.errors.length && r.warnings.length).length,
    };
  }, [preview]);

  const visibleRows = preview.filter(r =>
    filter === 'all' ? true :
    filter === 'errors' ? r.errors.length > 0 :
    filter === 'changes' ? (!r.errors.length && (r.changes.length || r.notesAppend)) :
    filter === 'opens' ? (!r.errors.length && (r.preg?.result === 'open' || r.patch.breeding_status === 'open')) :
    filter === 'warnings' ? (!r.errors.length && r.warnings.length) : true);

  // Before-values of every changed field, matched on RS ID — re-run it through this page to put fields back
  const downloadUndo = (rows) => {
    const fields = ['breeding_status', 'herd_name', 'project', 'tag_color', 'breed', 'date_of_birth', 'eid', 'vid', 'mouth', 'udder_score', 'condition_score', 'is_cull'];
    const lines = [['rs_id', ...fields].join(',')];
    rows.forEach(r => {
      const a = r.animal, p = r.patch;
      lines.push([a.id,
        'breeding_status' in p ? a.breeding_status : '', 'herd_id' in p ? herdName(a.herd_id) : '',
        'project' in p ? a.project : '',
        'tag_color' in p ? a.tag_color : '', 'breed' in p ? a.breed : '', 'date_of_birth' in p ? a.date_of_birth : '',
        'eid' in p ? a.eid : '', 'vid' in p ? a.vid : '',
        'mouth' in p ? a.mouth : '', 'udder_score' in p ? a.udder_score : '',
        'condition_score' in p ? (a.condition_score ?? '') : '', 'is_cull' in p ? (a.is_cull ? 'yes' : 'no') : ''].map(csvCell).join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = url; link.download = `ranch_savvy_undo_${todayLocal()}.csv`; link.click();
    URL.revokeObjectURL(url);
  };

  const apply = async () => {
    const ok = preview.filter(r => r.animal && !r.errors.length);
    const fieldRows = ok.filter(r => Object.keys(r.patch).length);
    const noteRows = ok.filter(r => r.notesAppend);
    const pregRows = ok.filter(r => r.preg);
    const ownerRows = ok.filter(r => r.owner);
    const touched = new Set([...fieldRows, ...noteRows, ...ownerRows].map(r => r.animal.id)).size;
    if (!touched && !pregRows.length) { toast('Nothing to change', 'error'); return; }
    if (!window.confirm(`Update ${touched} animals${ownerRows.length ? ` (${ownerRows.length} owner changes effective ${ownerDate})` : ''}${pregRows.length ? ` and record ${pregRows.length} preg checks` : ''}?`)) return;
    setApplying(true);
    const failed = [];
    const ownerUndo = { inserted: [], replaced: [] };
    let updated = 0, notesDone = 0, pregDone = 0, ownersDone = 0;
    const stamp = new Date().toISOString();
    try {
      // 1. Field changes — rows with an identical patch go up together
      const groups = {};
      fieldRows.forEach(r => { const k = JSON.stringify(r.patch); (groups[k] = groups[k] || []).push(r); });
      let done = 0;
      for (const [k, rows] of Object.entries(groups)) {
        const ids = rows.map(r => r.animal.id);
        setProgress(`Updating animals… ${done}/${fieldRows.length}`);
        const { data, error } = await chunkedIn(ids, (chunk) => supabase.from('animals').update({ ...JSON.parse(k), updated_at: stamp }).in('id', chunk).select('id'));
        const got = new Set((data || []).map(d => d.id));
        rows.forEach(r => { if (!error && got.has(r.animal.id)) updated++; else failed.push({ tag: r.tag, why: error?.message || 'not saved (row-level security?)' }); });
        done += rows.length;
      }
      // 2. Notes — appended per animal, matching Bulk Edit's format
      for (const r of noteRows) {
        setProgress(`Adding notes… ${notesDone}/${noteRows.length}`);
        const text = `${checkDate}: ${r.notesAppend}`;
        const { error } = await supabase.from('animals').update({ notes: r.animal.notes ? `${r.animal.notes}\n\n${text}` : text, updated_at: stamp }).eq('id', r.animal.id);
        if (error) failed.push({ tag: r.tag, why: `notes: ${error.message}` }); else notesDone++;
      }
      // 3. Ownership — new rows for real changes; same-day corrections update the existing row
      const inserts = ownerRows.filter(r => !r.owner.replaceRowId);
      for (let i = 0; i < inserts.length; i += 200) {
        setProgress(`Recording owners… ${i}/${ownerRows.length}`);
        const batch = inserts.slice(i, i + 200);
        const { data, error } = await supabase.from('animal_ownership_history').insert(batch.map(r => ({ animal_id: r.animal.id, partnership_id: r.owner.partnership_id, effective_date: ownerDate }))).select('id');
        if (error) batch.forEach(r => failed.push({ tag: r.tag, why: `owner: ${error.message}` }));
        else { ownersDone += (data || []).length; ownerUndo.inserted.push(...(data || []).map(d => d.id)); }
      }
      for (const r of ownerRows.filter(r => r.owner.replaceRowId)) {
        const { data, error } = await supabase.from('animal_ownership_history').update({ partnership_id: r.owner.partnership_id }).eq('id', r.owner.replaceRowId).select('id');
        if (error || !data?.length) failed.push({ tag: r.tag, why: `owner: ${error?.message || 'not saved (row-level security?)'}` });
        else { ownersDone++; ownerUndo.replaced.push({ id: r.owner.replaceRowId, partnership_id: r.owner.oldPartnershipId }); }
      }
      // 4. Preg history
      if (pregRows.length) {
        const records = pregRows.map(r => ({
          animal_id: r.animal.id, herd_id: r.animal.herd_id || null, check_date: checkDate, ...r.preg,
          method: method || null, technician: technician.trim() || null, source: `csv: ${fileName}`.slice(0, 200),
        }));
        for (let i = 0; i < records.length; i += 200) {
          setProgress(`Recording preg checks… ${i}/${records.length}`);
          const { data, error } = await supabase.from('preg_checks').insert(records.slice(i, i + 200)).select('id');
          if (error) failed.push({ tag: `preg rows ${i + 1}–${Math.min(i + 200, records.length)}`, why: error.message });
          else pregDone += (data || []).length;
        }
      }
      const summary = `${updated} animals updated, ${ownersDone} owner changes (eff. ${ownerDate}), ${notesDone} notes, ${pregDone} preg checks (${counts.opens} open) from ${fileName}${failed.length ? `; ${failed.length} failed` : ''}`;
      const { error: logErr } = await supabase.from('conversation_log').insert({ input_type: 'csv', raw_input: `CSV update: ${fileName}`, ai_interpretation: summary, action_type: 'data_entry', status: failed.length ? 'failed' : 'completed' });
      if (logErr) console.warn('Entry log not written:', logErr.message);
      setResult({ updated, notesDone, pregDone, ownersDone, ownerUndo, failed, appliedRows: fieldRows });
      setStep('done');
      toast(failed.length ? `Done with ${failed.length} failures` : 'Records updated!', failed.length ? 'error' : 'success');
    } catch (err) {
      toast(`Update failed: ${err.message}`, 'error');
    }
    setProgress('');
    setApplying(false);
  };

  const undoOwners = async () => {
    const { inserted, replaced } = result.ownerUndo;
    if (!window.confirm(`Reverse ${inserted.length + replaced.length} owner changes from this import?`)) return;
    setUndoing(true);
    let bad = 0;
    for (let i = 0; i < inserted.length; i += 200) {
      const { error } = await supabase.from('animal_ownership_history').delete().in('id', inserted.slice(i, i + 200));
      if (error) bad += Math.min(200, inserted.length - i);
    }
    for (const u of replaced) {
      const { error } = await supabase.from('animal_ownership_history').update({ partnership_id: u.partnership_id }).eq('id', u.id);
      if (error) bad++;
    }
    setUndoing(false);
    if (bad) { toast(`${bad} owner changes couldn't be reversed`, 'error'); return; }
    setResult(res => ({ ...res, ownersDone: 0, ownerUndo: { inserted: [], replaced: [] }, ownersUndone: true }));
    await supabase.from('conversation_log').insert({ input_type: 'csv', raw_input: `CSV update undo: ${fileName}`, ai_interpretation: `Reversed ${inserted.length + replaced.length} owner changes`, action_type: 'data_entry', status: 'completed' });
    toast('Owner changes reversed', 'success');
  };

  const reset = () => { setStep('upload'); setCsvData(null); setColumnMap({}); setValueMap({}); setPreview([]); setMissing([]); setResult(null); setTagCol(''); };

  const mono = { fontFamily: 'IBM Plex Mono, monospace' };
  const chip = (key, label, n, color) => (
    <button key={key} className={`btn ${filter === key ? 'btn-secondary' : 'btn-ghost'}`} onClick={() => setFilter(key)} style={{ fontSize: '12px', padding: '6px 12px' }}>
      <span style={{ color }}>{n}</span>&nbsp;{label}
    </button>
  );
  const sampleOf = (col) => (csvData?.rows.find(r => String(r[col] ?? '').trim())?.[col]) || '—';

  return (
    <div>
      <div style={{display:'flex', gap:'0', marginBottom:'28px', background:'var(--charcoal)', borderRadius:'6px', border:'1px solid rgba(58,125,123,0.3)', overflow:'hidden'}}>
        {['upload','map','preview','done'].map((s, i) => (
          <div key={s} style={{flex:1, padding:'12px', textAlign:'center', ...mono, fontSize:'11px', letterSpacing:'2px', textTransform:'uppercase', background: step===s?'rgba(42,157,143,0.2)':'transparent', color: step===s?'var(--hay)':'var(--ash)', borderRight: i<3?'1px solid rgba(58,125,123,0.3)':'none'}}>
            {i+1}. {s}
          </div>
        ))}
      </div>

      {step === 'upload' && (
        <div>
          <div className="detail-card" style={{marginBottom:'20px'}}>
            <h3>Update Existing Animals</h3>
            <p style={{color:'var(--ash)', fontSize:'14px', lineHeight:'1.7', marginTop:'8px'}}>
              Each row is matched to an <strong style={{color:'var(--cream)'}}>active</strong> animal by tag and only the columns you map get changed. Nothing new is created.
              Blank cells leave the existing value alone. Use this for preg-check results, retagging, herd moves, or fixing a batch of records.
            </p>
          </div>
          <div className="detail-card" style={{marginBottom:'20px'}}>
            <h3>Matching</h3>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'14px', marginTop:'10px'}}>
              <div className="form-group"><label className="form-label">Match rows on</label>
                <select className="form-select" value={matchBy} onChange={e => setMatchBy(e.target.value)}>
                  <option value="vid">VID (visual tag)</option><option value="eid">EID (electronic tag)</option><option value="id">RS ID (undo files)</option>
                </select></div>
              <div className="form-group"><label className="form-label">Limit to herd (recommended)</label>
                <select className="form-select" value={herdScope} onChange={e => setHerdScope(e.target.value)}>
                  <option value="">All herds</option>{herds.map(h => <option key={h.id} value={String(h.id)}>{h.name}</option>)}
                </select></div>
            </div>
            <p style={{color:'var(--ash)', fontSize:'12px', marginTop:'8px'}}>Picking a herd settles tags that repeat across herds, and the preview will list cows in that herd the file didn't include.</p>
          </div>
          <div style={{border:'2px dashed rgba(58,125,123,0.4)', borderRadius:'6px', padding:'48px 20px', textAlign:'center', cursor:'pointer', background:'var(--charcoal)'}} onClick={() => fileRef.current?.click()} onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); }}>
            <p style={{color:'var(--cream)', fontSize:'15px', fontWeight:'600', marginBottom:'6px'}}>Drop CSV file here or click to browse</p>
            <p style={{color:'var(--ash)', fontSize:'13px'}}>{animals ? `${animals.length.toLocaleString()} active animals loaded` : 'Loading animals…'}</p>
            <input ref={fileRef} type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={e => { handleFile(e.target.files[0]); e.target.value = ''; }} />
          </div>
        </div>
      )}

      {step === 'map' && csvData && (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'20px', gap:'12px', flexWrap:'wrap'}}>
            <div><h2 style={{fontFamily:'Playfair Display, serif', fontSize:'20px', color:'var(--cream)'}}>Map Your Columns</h2><p style={{color:'var(--ash)', fontSize:'13px', marginTop:'4px'}}>{fileName} · {csvData.rows.length} rows · matching on {MATCH_LABEL[matchBy]}{herdScope ? ` in ${herdName(herdScope)}` : ''}</p></div>
            <button className="btn btn-ghost" onClick={reset}>← Back</button>
          </div>

          <div className="detail-card" style={{marginBottom:'16px'}}>
            <div className="form-group"><label className="form-label" style={{color:'var(--rust)'}}>* Column with the {MATCH_LABEL[matchBy]}</label>
              <select className="form-select" value={tagCol} onChange={e => setTagCol(e.target.value)}><option value="">-- Pick column --</option>{csvData.headers.map(h => <option key={h} value={h}>{h}</option>)}</select>
              {tagCol && <span style={{color:'var(--sage)', fontSize:'12px', ...mono, marginTop:'6px', display:'block'}}>e.g. {sampleOf(tagCol)}</span>}
            </div>
          </div>

          <div className="table-wrap" style={{marginBottom:'16px'}}>
            <table>
              <thead><tr><th>Ranch Savvy Field</th><th>Your CSV Column</th><th>Sample</th></tr></thead>
              <tbody>
                {UPDATE_FIELDS.filter(f => f.key !== matchBy).map(f => (
                  <tr key={f.key}>
                    <td><div style={{color:'var(--cream)', fontSize:'13px'}}>{f.label}</div>{f.hint && <div style={{color:'var(--ash)', fontSize:'11px'}}>{f.hint}</div>}</td>
                    <td><select className="form-select" value={columnMap[f.key] || ''} onChange={e => setColumnMap(m => ({...m, [f.key]: e.target.value}))} style={{minWidth:'160px'}}><option value="">-- Skip --</option>{csvData.headers.map(h => <option key={h} value={h}>{h}</option>)}</select></td>
                    <td style={{color:'var(--sage)', fontSize:'13px', ...mono}}>{columnMap[f.key] ? sampleOf(columnMap[f.key]) : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {UPDATE_FIELDS.some(f => f.score && columnMap[f.key]) && (scoresOk === false || (pregTableOk && !pregScoresOk)) && (
            <div className="detail-card" style={{marginBottom:'16px'}}>
              <h3>Cow Scores Setup</h3>
              <p style={{color:'var(--hay)', fontSize:'13px', margin:'6px 0 10px'}}>
                {scoresOk === false
                  ? 'Mouth, udder and condition score aren\'t in the database yet. Run this once, or skip those columns.'
                  : 'Scores will save on the animals, but preg-check history doesn\'t have score columns yet — run this once to keep a dated record of mouth, udder and BCS with each preg check.'}
              </p>
              <div style={{display:'flex', gap:'10px', flexWrap:'wrap'}}>
                <button className="btn btn-secondary" onClick={() => setShowScoreSql(s => !s)}>{showScoreSql ? 'Hide' : 'Show'} setup SQL</button>
                <button className="btn btn-ghost" onClick={checkScoreCols}>I ran it — check again</button>
              </div>
              {showScoreSql && <div style={{marginTop:'10px'}}>
                <p style={{color:'var(--ash)', fontSize:'12px', marginBottom:'6px'}}>Supabase → SQL Editor → New query → paste → Run.</p>
                <textarea readOnly value={COW_SCORES_SQL} onFocus={e => e.target.select()} style={{width:'100%', height:'200px', ...mono, fontSize:'11px', background:'var(--charcoal)', color:'var(--cream)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'4px', padding:'8px'}} />
                <button className="btn btn-ghost" style={{marginTop:'6px'}} onClick={() => { navigator.clipboard?.writeText(COW_SCORES_SQL); toast('SQL copied', 'success'); }}>Copy SQL</button>
              </div>}
            </div>
          )}

          {columnMap.project && (
            <div className="detail-card" style={{marginBottom:'16px'}}>
              <h3>Project</h3>
              <p style={{color:'var(--ash)', fontSize:'13px', margin:'6px 0 12px'}}>Project changes are logged as transfers on this date, so head-day reports split days at the right point.</p>
              <div className="form-group" style={{maxWidth:'220px'}}><label className="form-label">Effective date</label><input type="date" className="form-input" max={todayLocal()} value={projectDate} onChange={e => setProjectDate(e.target.value)} /></div>
            </div>
          )}

          <div className="detail-card" style={{marginBottom:'16px'}}>
            <h3>Ownership</h3>
            <p style={{color:'var(--ash)', fontSize:'13px', marginTop:'6px'}}>
              {columnMap.owner ? <>Owner comes from the <strong style={{color:'var(--cream)'}}>{columnMap.owner}</strong> column. Rows with a blank owner use the fallback below.</> : 'Map an Owner column above, or set one owner for every row in the file.'}
              {' '}The old owner stays in history; the new one starts on the effective date.
            </p>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))', gap:'14px', marginTop:'12px'}}>
              <div className="form-group"><label className="form-label">{columnMap.owner ? 'Fallback owner (blank cells)' : 'Owner for every row'}</label>
                <select className="form-select" value={ownerDefault} onChange={e => setOwnerDefault(e.target.value)}>
                  <option value="">— don't change owner —</option>
                  {partnerships.filter(p => p.is_active !== false).map(p => <option key={p.id} value={String(p.id)}>{p.name}</option>)}
                </select></div>
              {(columnMap.owner || ownerDefault) && <div className="form-group"><label className="form-label">Effective date</label><input type="date" className="form-input" value={ownerDate} onChange={e => setOwnerDate(e.target.value)} /></div>}
            </div>
          </div>

          {columnMap.breeding_status && (
            <div className="detail-card" style={{marginBottom:'16px'}}>
              <h3>Preg Results → Breeding Status</h3>
              <div className="form-group" style={{maxWidth:'260px', marginTop:'10px'}}><label className="form-label">Bred cows calve in</label>
                <select className="form-select" value={bredDefault} onChange={e => { setBredDefault(e.target.value); setValueMap({}); }}><option value="bred_spring">Spring (bred spring)</option><option value="bred_fall">Fall (bred fall)</option></select></div>
              <div className="table-wrap" style={{marginTop:'10px'}}>
                <table>
                  <thead><tr><th>Value in file</th><th>Rows</th><th>Set status to</th></tr></thead>
                  <tbody>
                    {resultValues.map(([v, n]) => {
                      const cur = mappedStatus(v);
                      return (
                        <tr key={v}>
                          <td style={mono}>{v === '' ? <span style={{color:'var(--ash)'}}>(blank)</span> : v}</td>
                          <td style={{color:'var(--ash)'}}>{n}</td>
                          <td>{v === '' ? <span style={{color:'var(--ash)', fontSize:'12px'}}>left unchanged</span> :
                            <select className="form-select" value={cur} onChange={e => setValueMap(m => ({...m, [v]: e.target.value}))} style={{minWidth:'150px', borderColor: cur ? undefined : '#e05555'}}>
                              <option value="">— skip —</option>{BREEDING_VALUES.map(b => <option key={b} value={b}>{b.replace('_', ' ')}</option>)}
                            </select>}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {resultValues.length > 12 && <p style={{color:'var(--ash)', fontSize:'12px', marginTop:'8px'}}>Lots of distinct values — if this column is days bred, numbers map to bred and 0 to open automatically.</p>}

              <div style={{borderTop:'1px solid rgba(58,125,123,0.3)', marginTop:'16px', paddingTop:'14px'}}>
                {pregTableOk === false ? (
                  <div>
                    <p style={{color:'var(--hay)', fontSize:'13px'}}>Preg-check history isn't set up yet, so only breeding status will change (no dated record, days bred, or calving date).</p>
                    <div style={{display:'flex', gap:'10px', marginTop:'10px', flexWrap:'wrap'}}>
                      <button className="btn btn-secondary" onClick={() => setShowSql(s => !s)}>{showSql ? 'Hide' : 'Show'} setup SQL</button>
                      <button className="btn btn-ghost" onClick={checkPregTable}>I ran it — check again</button>
                    </div>
                    {showSql && <div style={{marginTop:'10px'}}>
                      <p style={{color:'var(--ash)', fontSize:'12px', marginBottom:'6px'}}>Supabase → SQL Editor → New query → paste → Run.</p>
                      <textarea readOnly value={PREG_CHECKS_SQL} onFocus={e => e.target.select()} style={{width:'100%', height:'220px', ...mono, fontSize:'11px', background:'var(--charcoal)', color:'var(--cream)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'4px', padding:'8px'}} />
                      <button className="btn btn-ghost" style={{marginTop:'6px'}} onClick={() => { navigator.clipboard?.writeText(PREG_CHECKS_SQL); toast('SQL copied', 'success'); }}>Copy SQL</button>
                    </div>}
                  </div>
                ) : (
                  <div>
                    <label style={{display:'flex', gap:'8px', alignItems:'center', color:'var(--cream)', fontSize:'14px', cursor:'pointer'}}>
                      <input type="checkbox" checked={recordPreg} disabled={!pregTableOk} onChange={e => setRecordPreg(e.target.checked)} /> Record as a preg check (keeps history, days bred, expected calving date)
                    </label>
                    {recordPreg && <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:'14px', marginTop:'12px'}}>
                      <div className="form-group"><label className="form-label">Check date</label><input type="date" className="form-input" value={checkDate} onChange={e => setCheckDate(e.target.value || todayLocal())} /></div>
                      <div className="form-group"><label className="form-label">Method</label><select className="form-select" value={method} onChange={e => setMethod(e.target.value)}>{PREG_METHODS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select></div>
                      <div className="form-group"><label className="form-label">Vet / technician</label><input className="form-input" value={technician} onChange={e => setTechnician(e.target.value)} placeholder="optional" /></div>
                    </div>}
                  </div>
                )}
              </div>
            </div>
          )}

          <div style={{display:'flex', justifyContent:'flex-end', gap:'10px'}}><button className="btn btn-ghost" onClick={reset}>← Back</button><button className="btn btn-primary" onClick={buildPreview} disabled={!tagCol || !animals}>Preview Changes →</button></div>
        </div>
      )}

      {step === 'preview' && (
        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'14px', gap:'12px', flexWrap:'wrap'}}>
            <div><h2 style={{fontFamily:'Playfair Display, serif', fontSize:'20px', color:'var(--cream)'}}>Preview Changes</h2><p style={{color:'var(--ash)', fontSize:'13px', marginTop:'4px'}}>Nothing is saved until you click Apply. Rows with errors are skipped.</p></div>
            <button className="btn btn-ghost" onClick={() => setStep('map')}>← Remap</button>
          </div>
          <div style={{display:'flex', gap:'8px', flexWrap:'wrap', marginBottom:'14px'}}>
            {chip('all', 'rows', preview.length, 'var(--cream)')}
            {chip('changes', 'with changes', counts.changes, 'var(--sage)')}
            {counts.opens > 0 && chip('opens', 'open', counts.opens, '#e05555')}
            {counts.warnings > 0 && chip('warnings', 'warnings', counts.warnings, 'var(--hay)')}
            {counts.errors > 0 && chip('errors', 'skipped', counts.errors, '#e05555')}
          </div>
          <p style={{color:'var(--ash)', fontSize:'13px', marginBottom:'14px'}}>
            {counts.preg > 0 && <span>{counts.preg} preg checks will be recorded for {checkDate}. </span>}
            {counts.noChange > 0 && <span>{counts.noChange} rows already match RS. </span>}
          </p>

          {missing.length > 0 && (
            <div style={{background:'rgba(212,160,23,0.08)', border:'1px solid rgba(212,160,23,0.3)', borderRadius:'6px', padding:'12px 16px', marginBottom:'16px'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:'10px'}}>
                <span style={{color:'var(--hay)', fontSize:'13px'}}>{missing.length} active cows/heifers in {herdName(herdScope)} aren't in this file — missed, lost tag, or dead/sold not recorded?</span>
                <button className="btn btn-ghost" style={{fontSize:'12px'}} onClick={() => setShowMissing(s => !s)}>{showMissing ? 'Hide' : 'Show'}</button>
              </div>
              {showMissing && <p style={{color:'var(--ash)', fontSize:'12px', ...mono, marginTop:'8px', lineHeight:'1.8'}}>{missing.map(a => a.vid || a.eid || '(no tag)').sort((x, y) => String(x).localeCompare(String(y), undefined, { numeric: true })).join(' · ')}</p>}
            </div>
          )}

          <div className="table-wrap" style={{marginBottom:'20px'}}>
            <table>
              <thead><tr><th>Row</th><th>Tag</th><th>Herd</th><th>Changes</th><th>Preg</th><th></th></tr></thead>
              <tbody>
                {visibleRows.map(r => (
                  <tr key={r.rowNum} style={{opacity: r.errors.length ? 0.55 : 1}}>
                    <td style={{color:'var(--ash)', fontSize:'12px'}}>{r.rowNum}</td>
                    <td className="td-mono">{r.tag || '—'}</td>
                    <td style={{fontSize:'12px', color:'var(--ash)'}}>{r.animal ? herdName(r.animal.herd_id) : '—'}</td>
                    <td style={{fontSize:'12px'}}>
                      {r.changes.map((c, i) => <div key={i}><span style={{color:'var(--ash)'}}>{c.label}:</span> <span style={{color:'var(--ash)', textDecoration:'line-through'}}>{c.from || '—'}</span> → <span style={{color: c.to === 'open' ? '#e05555' : 'var(--sage)'}}>{c.to}</span></div>)}
                      {r.notesAppend && <div><span style={{color:'var(--ash)'}}>Note:</span> <span style={{color:'var(--cream)'}}>+ {r.notesAppend}</span></div>}
                      {!r.changes.length && !r.notesAppend && !r.errors.length && <span style={{color:'var(--ash)'}}>no change</span>}
                      {r.errors.map((e, i) => <div key={'e'+i} style={{color:'#e05555'}}>⚠ {e}</div>)}
                      {r.warnings.map((w, i) => <div key={'w'+i} style={{color:'var(--hay)'}}>△ {w}</div>)}
                    </td>
                    <td style={{fontSize:'12px', ...mono}}>{r.preg ? <span style={{color: r.preg.result === 'open' ? '#e05555' : 'var(--sage)'}}>{r.preg.result.toUpperCase()}{r.preg.days_bred !== null ? ` ${r.preg.days_bred}d` : ''}{r.preg.calving_period ? ` · ${r.preg.calving_period}` : ''}{r.preg.expected_calving_date ? <div style={{color:'var(--ash)'}}>due {r.preg.expected_calving_date}</div> : null}</span> : '—'}</td>
                    <td>{r.errors.length ? <span style={{color:'#e05555', fontSize:'11px', ...mono}}>SKIP</span> : (r.changes.length || r.notesAppend || r.preg) ? <span style={{color:'var(--sage)', fontSize:'11px', ...mono}}>✓</span> : null}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div style={{display:'flex', justifyContent:'flex-end', alignItems:'center', gap:'10px', flexWrap:'wrap'}}>
            {progress && <span style={{color:'var(--ash)', fontSize:'12px', ...mono}}>{progress}</span>}
            <button className="btn btn-ghost" onClick={() => setStep('map')} disabled={applying}>← Remap</button>
            <button className="btn btn-primary" onClick={apply} disabled={applying || (counts.changes === 0 && counts.preg === 0)}>{applying ? 'Saving…' : `Apply ${counts.changes} changes${counts.preg ? ` + ${counts.preg} preg checks` : ''}`}</button>
          </div>
        </div>
      )}

      {step === 'done' && result && (
        <div style={{textAlign:'center', padding:'40px 20px'}}>
          <h2 style={{fontFamily:'Playfair Display, serif', fontSize:'32px', color:'var(--cream)', marginBottom:'16px'}}>Records Updated</h2>
          <div style={{display:'flex', gap:'16px', justifyContent:'center', marginBottom:'24px', flexWrap:'wrap'}}>
            {(result.updated > 0 || !(result.ownersDone || result.ownersUndone || result.pregDone || result.notesDone)) && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Animals Updated</div><div className="stat-value" style={{color:'var(--sage)'}}>{result.updated}</div></div>}
            {(result.ownersDone > 0 || result.ownersUndone) && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Owner Changes</div><div className="stat-value" style={{color:'var(--rust)'}}>{result.ownersUndone ? 'undone' : result.ownersDone}</div></div>}
            {result.pregDone > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Preg Checks</div><div className="stat-value" style={{color:'var(--hay)'}}>{result.pregDone}</div></div>}
            {result.notesDone > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Notes Added</div><div className="stat-value" style={{color:'var(--ash)'}}>{result.notesDone}</div></div>}
            {result.failed.length > 0 && <div className="stat-card" style={{minWidth:'140px'}}><div className="stat-label">Failed</div><div className="stat-value" style={{color:'#e05555'}}>{result.failed.length}</div></div>}
          </div>
          {result.failed.length > 0 && <div style={{textAlign:'left', maxWidth:'640px', margin:'0 auto 20px', background:'rgba(224,85,85,0.1)', border:'1px solid rgba(224,85,85,0.3)', borderRadius:'6px', padding:'12px 16px'}}>{result.failed.map((f, i) => <p key={i} style={{color:'var(--ash)', fontSize:'13px'}}>{f.tag}: {f.why}</p>)}</div>}
          {result.appliedRows.length > 0 && <p style={{color:'var(--ash)', fontSize:'12px', maxWidth:'560px', margin:'0 auto 16px'}}>The undo file holds the old values of every field changed. Owner changes have their own undo button, available until you leave this screen. Run it back through this page (match on RS ID) to restore them. It doesn't remove notes or preg-check records.</p>}
          <div style={{display:'flex', gap:'12px', justifyContent:'center', flexWrap:'wrap'}}>
            {result.appliedRows.length > 0 && <button className="btn btn-secondary" onClick={() => downloadUndo(result.appliedRows)}>⤓ Download Undo File</button>}
            {(result.ownerUndo.inserted.length + result.ownerUndo.replaced.length) > 0 && <button className="btn btn-secondary" onClick={undoOwners} disabled={undoing}>{undoing ? 'Reversing…' : '↶ Undo Owner Changes'}</button>}
            <button className="btn btn-secondary" onClick={reset}>Update Another File</button>
            <button className="btn btn-primary" onClick={() => window.location.reload()}>View Animals →</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ===== CHAT PAGE =====
function ChatPage({ toast }) {
  const [messages, setMessages] = useState([
    { role: 'assistant', text: "Welcome to Ranch Savvy Field Entry. Type or dictate what happened — sales, treatments, moves, calvings, and more. Say when it happened (\"yesterday\", \"9/18\", \"Sept 18\") or set the date before you confirm; otherwise it's today. I'll confirm before saving anything.", time: new Date() },
  ]);
  const [input, setInput] = useState('');
  const [pending, setPending] = useState(null);
  const [processing, setProcessing] = useState(false);
  const messagesEnd = useRef(null);

  useEffect(() => { messagesEnd.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);
  const addMsg = (role, text) => setMessages(m => [...m, { role, text, time: new Date() }]);

  // Date the event happened: from the pending entry's date box; checked before any lookup or write
  const entryDateOrThrow = (p) => {
    const d = p.date || todayLocal();
    const err = checkEventDate(d);
    if (err) throw new Error(`${err} Fix the date box, then reply YES.`);
    return d;
  };

  const executeSale = async (p) => {
    const when = entryDateOrThrow(p);
    const { data: foundAnimals, error: findErr } = await supabase.from('animals').select('id, vid, status').in('vid', p.tags).eq('status', 'active');
    if (findErr) throw new Error('Could not look up animals: ' + findErr.message);
    const foundTags = foundAnimals.map(a => a.vid);
    const notFound = p.tags.filter(t => !foundTags.includes(t));
    if (foundAnimals.length === 0) throw new Error(`No active animals found with tags: ${p.tags.join(', ')}`);
    // Duplicate-VID guard: if one tag matches multiple active animals, stop rather than sell the wrong one
    const dupTags = foundTags.filter((t, i) => foundTags.indexOf(t) !== i);
    if (dupTags.length > 0) throw new Error(`Tag(s) ${[...new Set(dupTags)].join(', ')} match more than one ACTIVE animal. Nothing was saved — resolve the duplicate in Animal Inventory, then re-enter.`);
    const { data: saleRecord, error: saleErr } = await supabase.from('sale_records').insert({ sale_date: when, sale_location: p.location, sale_type: 'auction', notes: p.text }).select().single();
    if (saleErr) throw new Error('Could not create sale record: ' + saleErr.message);
    const { error: saLinkErr } = await supabase.from('sale_animals').insert(foundAnimals.map(a => ({ sale_record_id: saleRecord.id, animal_id: a.id })));
    if (saLinkErr) throw new Error('Sale record created but animals could NOT be linked (' + saLinkErr.message + '). Check the sale in the database before re-entering.');
    const { error: statusErr } = await supabase.from('animals').update({ status: 'sold', status_date: when, is_active: false, updated_at: new Date().toISOString() }).in('id', foundAnimals.map(a => a.id));
    if (statusErr) throw new Error('Sale saved but animal statuses were NOT updated to sold (' + statusErr.message + '). Update them manually in Animal Inventory.');
    let resultMsg = `✓ Sale recorded at ${p.location}, ${formatDate(when)}.\n${foundAnimals.length} animal(s) marked as SOLD: tags ${foundTags.join(', ')}.`;
    if (notFound.length > 0) resultMsg += `\n\n⚠️ These tags were not found: ${notFound.join(', ')}`;
    return resultMsg;
  };

  const executeDeath = async (p) => {
    const when = entryDateOrThrow(p);
    const { data: foundAnimals, error: findErr } = await supabase.from('animals').select('id, vid').in('vid', p.tags).eq('status', 'active');
    if (findErr) throw new Error('Could not look up animals: ' + findErr.message);
    if (foundAnimals.length === 0) throw new Error(`No active animals found with tags: ${p.tags.join(', ')}`);
    const dVids = foundAnimals.map(a => a.vid);
    const dDups = dVids.filter((t, i) => dVids.indexOf(t) !== i);
    if (dDups.length > 0) throw new Error(`Tag(s) ${[...new Set(dDups)].join(', ')} match more than one ACTIVE animal. Nothing was saved — resolve the duplicate first.`);
    const { error: drErr } = await supabase.from('death_records').insert(foundAnimals.map(a => ({ animal_id: a.id, death_date: when, cause_of_death: p.cause || 'Unknown', notes: p.text })));
    if (drErr) throw new Error('Could not save death record: ' + drErr.message);
    const { error: dsErr } = await supabase.from('animals').update({ status: 'dead', status_date: when, is_active: false, updated_at: new Date().toISOString() }).in('id', foundAnimals.map(a => a.id));
    if (dsErr) throw new Error('Death record saved but animal statuses were NOT updated (' + dsErr.message + '). Update them manually in Animal Inventory.');
    return `✓ Death recorded for ${foundAnimals.length} animal(s), ${formatDate(when)}: tags ${foundAnimals.map(a=>a.vid).join(', ')}.`;
  };

  const executeCalving = async (p) => {
    const when = entryDateOrThrow(p);
    const { data: foundAnimals, error: findErr } = await supabase.from('animals').select('id, vid, status').in('vid', p.tags).eq('status', 'active');
    if (findErr) throw new Error('Could not look up animals: ' + findErr.message);
    if (foundAnimals.length === 0) throw new Error(`No active animals found with tags: ${p.tags.join(', ')}`);
    if (foundAnimals.length > 1) throw new Error(`Multiple active animals match (${foundAnimals.map(a => a.vid).join(', ')}). Enter the calving from the dam's Animal Detail page to be sure it lands on the right cow.`);
    const dam = foundAnimals[0];
    const { error: crErr } = await supabase.from('calving_records').insert({ dam_id: dam.id, calving_date: when, calf_sex: p.calfSex || 'unknown', calf_status: p.calfStatus || 'alive', udder_score: p.udderScore || null, calving_ease: 'unassisted', notes: p.text });
    if (crErr) throw new Error('Could not save calving record: ' + crErr.message);
    return `✓ Calving record saved for cow ${dam.vid}, ${formatDate(when)}.\nCalf: ${p.calfSex || 'unknown sex'}, ${p.calfStatus || 'alive'}${p.udderScore ? `, udder score ${p.udderScore}` : ''}.`;
  };

  const executeHealth = async (p) => {
    const when = entryDateOrThrow(p);
    // Use the tags the user confirmed at parse time; fall back to re-extraction for older pending entries
    const tags = p.tags && p.tags.length > 0 ? p.tags : (p.text.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || []);
    if (tags.length === 0) throw new Error('No animal tags found. Please specify which animals were treated.');
    const { data: foundAnimals, error: findErr } = await supabase.from('animals').select('id, vid').in('vid', tags).eq('status', 'active');
    if (findErr) throw new Error('Could not look up animals: ' + findErr.message);
    if (foundAnimals.length === 0) throw new Error(`No active animals found with tags: ${tags.join(', ')}`);
    const hVids = foundAnimals.map(a => a.vid);
    const hDups = hVids.filter((t, i) => hVids.indexOf(t) !== i);
    if (hDups.length > 0) throw new Error(`Tag(s) ${[...new Set(hDups)].join(', ')} match more than one ACTIVE animal. Nothing was saved — resolve the duplicate first.`);
    const { error: trErr } = await supabase.from('treatments').insert(foundAnimals.map(a => ({ animal_id: a.id, treatment_date: when, treatment_type: p.products.length > 0 ? 'vaccination' : 'general', product_name: p.products.join(', ') || null, lot_number: p.lotNumbers.join(', ') || null, reason: 'Field entry', notes: p.text })));
    if (trErr) throw new Error('Could not save treatment records: ' + trErr.message);
    return `✓ Treatment records saved for ${foundAnimals.length} animal(s): ${foundAnimals.map(a => a.vid).join(', ')}.`;
  };

  const executeNotes = async (p) => {
    const { data: foundAnimals, error: findErr } = await supabase.from('animals').select('id, vid, notes').in('vid', p.tags).eq('status', 'active');
    if (findErr) throw new Error('Could not look up animals: ' + findErr.message);
    if (foundAnimals.length === 0) throw new Error(`No active animals found with tags: ${p.tags.join(', ')}`);
    for (const animal of foundAnimals) {
      const newNotes = animal.notes ? `${animal.notes}\n\n[${new Date().toLocaleDateString()}] ${p.notes}` : `[${new Date().toLocaleDateString()}] ${p.notes}`;
      await supabase.from('animals').update({ notes: newNotes, updated_at: new Date().toISOString() }).eq('id', animal.id);
    }
    return `✓ Notes added to ${foundAnimals.length} animal(s): ${foundAnimals.map(a => a.vid).join(', ')}.`;
  };

  const parseAndRespond = async (text) => {
    const logEntry = { input_type: 'text', raw_input: text, ai_interpretation: null, action_type: null, action_executed: null, status: 'completed' };
    const lower = text.toLowerCase().trim();

    if ((lower === 'yes' || lower === 'confirm' || lower === 'correct') && pending) {
      setProcessing(true);
      try {
        let resultMsg = '';
        if (pending.type === 'sale') resultMsg = await executeSale(pending);
        else if (pending.type === 'death') resultMsg = await executeDeath(pending);
        else if (pending.type === 'calving') resultMsg = await executeCalving(pending);
        else if (pending.type === 'health') resultMsg = await executeHealth(pending);
        else if (pending.type === 'notes') resultMsg = await executeNotes(pending);
        else resultMsg = '✓ Entry noted. Manual follow-up may be needed for this event type.';
        addMsg('system', resultMsg);
        logEntry.ai_interpretation = `Confirmed: ${pending.type}`; logEntry.action_type = 'data_entry'; logEntry.status = 'completed';
        setPending(null); toast('Saved to database!', 'success');
      } catch (err) { addMsg('system', `❌ Error: ${err.message}`); logEntry.status = 'failed'; toast('Error saving entry', 'error'); }
      setProcessing(false);
      await supabase.from('conversation_log').insert(logEntry);
      return;
    }

    if ((lower === 'no' || lower === 'cancel') && pending) {
      setPending(null);
      addMsg('assistant', 'Cancelled. Nothing was saved. What else can I help you record?');
      logEntry.action_type = 'cancelled'; logEntry.status = 'cancelled';
      await supabase.from('conversation_log').insert(logEntry);
      return;
    }

    // When it happened: said in the text, else today. The date box under the chat can change it before YES.
    // Tags, location and cause are read from `stripped` so a date like 9/18 never turns into tags 9 and 18.
    const { date: saidDate, stripped } = extractEntryDate(text);
    const entryDate = saidDate || todayLocal();
    const daysBack = Math.round((new Date(todayLocal() + 'T12:00:00') - new Date(entryDate + 'T12:00:00')) / 86400000);
    const dateLine = `Date: ${formatDate(entryDate)}${daysBack === 0 ? ' (today)' : daysBack === 1 ? ' (yesterday)' : ''}`
      + (daysBack < 0 ? ' ⚠️ that is in the future — fix it in the date box.' : daysBack > 30 ? ` ⚠️ ${daysBack} days ago — make sure that's right.` : '')
      + '\nChange the date in the box below if needed.';

    if (lower.includes('sold') || lower.includes('sale')) {
      const locationMatch = stripped.match(/at\s+([A-Za-z][A-Za-z\s]+?)(?:,|\.|tags?|$)/i);
      const location = locationMatch?.[1]?.trim() || 'Unknown Location';
      const afterTags = stripped.match(/tags?\s+([0-9A-Za-z,\s]+)/i)?.[1] || '';
      const tags = afterTags ? afterTags.match(/[A-Z0-9]{1,6}/gi)?.map(t => t.toUpperCase()) || [] : stripped.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || [];
      setPending({ type: 'sale', tags, location, text, date: entryDate });
      addMsg('assistant', `Sale detected at ${location}.\n\nTags identified: ${tags.length > 0 ? tags.join(', ') : 'none found'}\n${dateLine}\n\nIs this correct? Reply YES to save or tell me what to correct.`);
      logEntry.ai_interpretation = `Sale pending: ${tags.length} head at ${location}`; logEntry.action_type = 'data_entry';
    } else if (lower.includes('calv') || lower.includes('gave birth') || lower.includes('born') || lower.includes('had a calf') || lower.includes('had a bull') || lower.includes('had a heifer') || lower.match(/had a (dead|alive|live)? ?(bull|heifer|male|female)? ?calf/i)) {
      const tags = stripped.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || [];
      let calfSex = null;
      if (lower.match(/\b(bull|male)\b/i) && !lower.includes('bull calf')) calfSex = 'bull';
      else if (lower.match(/\b(heifer|female)\b/i)) calfSex = 'heifer';
      else if (lower.includes('bull calf')) calfSex = 'bull';
      else if (lower.includes('heifer calf')) calfSex = 'heifer';
      let calfStatus = 'alive';
      if (lower.match(/dead|died|stillborn|still born/i)) calfStatus = 'dead';
      const udderMatch = text.match(/udder\s*(?:score)?\s*([A-F])/i);
      const udderScore = udderMatch ? udderMatch[1].toUpperCase() : null;
      setPending({ type: 'calving', tags, calfSex, calfStatus, udderScore, text, date: entryDate });
      let confirmMsg = `Calving event detected${tags.length ? ` for cow ${tags[0]}` : ''}.\n\nDetected:\n`;
      if (calfSex) confirmMsg += `• Calf sex: ${calfSex}\n`;
      if (calfStatus) confirmMsg += `• Calf status: ${calfStatus}\n`;
      if (udderScore) confirmMsg += `• Udder score: ${udderScore}\n`;
      confirmMsg += `${dateLine}\n\nReply YES to save, or provide corrections.`;
      addMsg('assistant', confirmMsg);
      logEntry.ai_interpretation = `Calving event pending: cow ${tags[0] || 'unknown'}, ${calfSex || 'unknown sex'} calf, ${calfStatus}`; logEntry.action_type = 'data_entry';
    } else if ((lower.includes('cow died') || lower.includes('bull died') || lower.includes('heifer died') || lower.includes('steer died') || lower.includes('found dead')) || (lower.includes('died') && !lower.includes('calf')) || (lower.includes('death') && !lower.includes('calf'))) {
      // Strip head-count phrases ("3 died", "2 head") so counts aren't mistaken for tag numbers — but NOT a tag
      // that happens to sit before "died": "Tag 234 died", "Cow 12 died", "tags 101 102 died" keep their tags.
      const deathTagSource = stripped.replace(/\b\d{1,3}\s+(head|hd|cows?|calves|calf|bulls?|steers?|heifers?)\b/gi, '')
        .replace(/\b\d{1,2}\s+(died|dead|found dead)\b/gi, (m, _w, at, str) => /(\b(?:tags?|cows?|bulls?|heifers?|steers?|calf|calves|number|no\.?)|#|\d|,|\band)\s*$/i.test(str.slice(0, at)) ? m : '');
      const tags = deathTagSource.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || [];
      const cause = stripped.match(/(?:from|cause|due to)\s+([a-z\s]+?)(?:\.|,|$)/i)?.[1]?.trim() || null;
      setPending({ type: 'death', tags, cause, text, date: entryDate });
      addMsg('assistant', `Death detected for tag(s): ${tags.length > 0 ? tags.join(', ') : 'none found'}.\nCause: ${cause || 'not specified'}\n${dateLine}\n\nIs this correct? Reply YES to save or correct me.`);
      logEntry.ai_interpretation = `Death pending: tags ${tags.join(', ')}`; logEntry.action_type = 'data_entry';
    } else if (lower.includes('vaccin') || lower.includes('treated') || lower.includes('medicated') || lower.includes('castrat')) {
      const products = [];
      const productMatches = [...text.matchAll(/(?:with\s+)([\w\s]+?)(?:\s*\(lot|\s*,|\s+and\s+[A-Z]|\.)/gi)];
      productMatches.forEach(m => products.push(m[1].trim()));
      const lotNumbers = [...text.matchAll(/lot\s+(?:number\s+)?([0-9]+)/gi)].map(m => m[1]);
      // Extract tags now (not at execute time) so the user confirms the exact animals being written to.
      // Strip dosage/lot phrases first so "5 cc" or "lot 12345" numbers aren't mistaken for tags.
      const tagSource = stripped.replace(/\b\d+(\.\d+)?\s*(cc|ml|mls|ccs|mg|head|hd)\b/gi, '').replace(/lot\s+(?:number\s+)?[0-9]+/gi, '');
      const healthTags = tagSource.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || [];
      setPending({ type: 'health', text, products, lotNumbers, tags: healthTags, date: entryDate });
      addMsg('assistant', `Health event detected.\n\nAnimal tags: ${healthTags.length > 0 ? healthTags.join(', ') : '⚠️ NONE FOUND — entry will fail; include tag numbers'}\nProducts: ${products.length > 0 ? products.join(', ') : 'not specified'}\nLot numbers: ${lotNumbers.length > 0 ? lotNumbers.join(', ') : 'not specified'}\n${dateLine}\n\nTreatment records will be written to the tags listed above. Reply YES to confirm or correct me.`);
      logEntry.ai_interpretation = `Health/vaccination event pending: ${products.join(', ')}`; logEntry.action_type = 'bulk_update';
    } else if (lower.includes('note for') || lower.includes('add note') || lower.includes('notes:') || lower.match(/tag \d+.*note/i) || lower.match(/cow \d+.*note/i)) {
      const tags = text.match(/\b\d{1,5}[A-Z]?\b/g)?.map(t => t.toUpperCase()) || [];
      let noteText = text;
      const noteMatch = text.match(/note[s]?:?\s*(.+)/i);
      if (noteMatch) noteText = noteMatch[1].trim();
      setPending({ type: 'notes', tags, notes: noteText, text });
      addMsg('assistant', `Note detected for tag(s): ${tags.length > 0 ? tags.join(', ') : 'none found'}.\n\nNote: "${noteText}"\n\nReply YES to save.`);
      logEntry.ai_interpretation = `Note pending for ${tags.length} animal(s)`; logEntry.action_type = 'data_entry';
    } else {
      addMsg('assistant', `I'm not sure what to record. Here are some examples:\n\n• "Sold 5 cows at Herreid Livestock, tags 101, 202, 303, 404, 505"\n• "Cow 607 calved today, heifer calf, udder score B"\n• "Tag 234 found dead yesterday"\n• "Vaccinated all calves in Old Cows herd with Vision 7 (lot 12345)"\n\nWhat happened?`);
      logEntry.action_type = 'query';
    }
    await supabase.from('conversation_log').insert(logEntry);
  };

  const handleSend = async () => {
    const text = input.trim();
    if (!text || processing) return;
    addMsg('user', text);
    setInput('');
    await parseAndRespond(text);
  };

  const handleKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

  return (
    <div className="chat-container">
      <div className="chat-messages">
        {messages.map((m, i) => (
          <div key={i}>
            <div className={`chat-bubble ${m.role}`} style={{whiteSpace:'pre-line'}}>{m.text}</div>
            <div className="chat-time" style={{textAlign: m.role === 'user' ? 'right' : 'left', paddingLeft: m.role !== 'user' ? '4px' : 0, paddingRight: m.role === 'user' ? '4px' : 0}}>
              {m.time?.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' })}
            </div>
          </div>
        ))}
        {processing && <div className="chat-bubble assistant" style={{display:'flex', alignItems:'center', gap:'10px'}}><div className="spinner"></div> Saving to database...</div>}
        <div ref={messagesEnd} />
      </div>
      {pending && FE_DATED.includes(pending.type) && (
        <div className="chat-date-bar">
          <label htmlFor="fe-date">Date it happened</label>
          <input id="fe-date" type="date" className="form-input" value={pending.date || ''} max={todayLocal()} disabled={processing}
            onChange={e => { const v = e.target.value; setPending(p => (p ? { ...p, date: v } : p)); }} />
          <span>{{ sale: 'Sale', death: 'Death', calving: 'Calving', health: 'Treatment' }[pending.type]} is waiting — reply YES to save it with this date.</span>
        </div>
      )}
      <div className="chat-input-area">
        <textarea className="chat-input" placeholder="Type a field entry... (e.g. 'Sold 5 cows at Herreid, tags 101, 202, 303')" value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKey} rows={1} disabled={processing} />
        <button className="chat-send-btn" onClick={handleSend} disabled={processing} title="Send">➤</button>
      </div>
    </div>
  );
}

// ===== INVENTORY CHANGE REPORT =====
function InventoryChangeReport({ toast, herds, projects = [] }) {
  const today = todayLocal();
  const janFirst = new Date(new Date().getFullYear(), 0, 1).toISOString().split('T')[0];
  const [startDate, setStartDate] = useState(janFirst);
  const [endDate, setEndDate] = useState(today);
  const [scope, setScope] = useState('');   // '' | herd:<id> | ent:<name> | proj:<name> — see REPORT SCOPES
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);

  const TYPE_STYLE = {
    purchase: { color: 'var(--sky)',   label: 'PURCHASE', sign: '+' },
    birth:    { color: 'var(--sage)',  label: 'BIRTH',    sign: '+' },
    sale:     { color: 'var(--hay)',   label: 'SALE',     sign: '−' },
    death:    { color: '#e05555',      label: 'DEATH',    sign: '−' },
  };

  const runReport = async () => {
    if (!startDate || !endDate) { toast('Please select a date range', 'error'); return; }
    if (startDate > endDate)   { toast('Start date must be before end date', 'error'); return; }
    setLoading(true);
    setResults(null);
    const inScope = scopeMatcher(scope, herds);
    try {
      // ── 1. Beginning inventory ──────────────────────────────────────────────
      // Animals that existed BEFORE the period that were still active at period start.
      // "Active at start" = currently active (never left), OR left (sold/dead) on/after startDate.
      let begQ = supabase.from('animals')
        .select('id, vid, sex, herd_id, status, status_date, created_at, herds(name)')
        .lt('created_at', startDate)
        .limit(10000);
      begQ = scopeQuery(begQ, scope, herds);
      const { data: prePeriod, error: begErr } = await begQ;
      if (begErr) throw new Error('Beginning inventory query failed: ' + begErr.message);

      const beginningInventory = (prePeriod || []).filter(a => {
        if (a.status === 'active') return true;
        if ((a.status === 'sold' || a.status === 'dead') && a.status_date >= startDate) return true;
        return false;
      });

      // ── 2. Purchases / additions (animals first entered during period) ──────
      let addQ = supabase.from('animals')
        .select('id, vid, sex, herd_id, created_at, notes, herds(name)')
        .gte('created_at', startDate)
        .lte('created_at', endDate + 'T23:59:59')
        .limit(10000);
      addQ = scopeQuery(addQ, scope, herds);
      const { data: added, error: addErr } = await addQ;
      if (addErr) throw new Error('Purchases query failed: ' + addErr.message);

      // ── 3. Calvings (live calves born during period) ────────────────────────
      const { data: calvingRaw, error: calvErr } = await supabase.from('calving_records')
        .select('id, calving_date, calf_sex, calf_status, dam_id')
        .gte('calving_date', startDate)
        .lte('calving_date', endDate)
        .eq('calf_status', 'alive')
        .limit(10000);
      if (calvErr) throw new Error('Calving query failed: ' + calvErr.message);

      // fetch dam details for herd filtering
      let damsMap = {};
      const uniqueDamIds = [...new Set((calvingRaw || []).map(c => c.dam_id))];
      if (uniqueDamIds.length > 0) {
        const { data: dams } = await chunkedIn(uniqueDamIds, (chunk) => supabase.from('animals')
          .select('id, vid, herd_id, project, herds(name)')
          .in('id', chunk)
          .limit(10000));
        (dams || []).forEach(d => { damsMap[d.id] = d; });
      }
      // Births count to the dam's scope (her herd / enterprise / project)
      const calvingData = scope
        ? (calvingRaw || []).filter(c => inScope(damsMap[c.dam_id]))
        : (calvingRaw || []);

      // ── 4. Sales during period ──────────────────────────────────────────────
      const { data: saleRecords, error: srErr } = await supabase.from('sale_records')
        .select('id, sale_date, sale_location, sale_type, notes')
        .gte('sale_date', startDate)
        .lte('sale_date', endDate)
        .limit(10000);
      if (srErr) throw new Error('Sales query failed: ' + srErr.message);

      let salesFlat = [];
      if ((saleRecords || []).length > 0) {
        const srIds = saleRecords.map(s => s.id);
        const { data: saleAnimals, error: saErr } = await supabase.from('sale_animals')
          .select('sale_record_id, animals(id, vid, sex, herd_id, project, herds(name))')
          .in('sale_record_id', srIds)
          .limit(10000);
        if (saErr) throw new Error('Sale animals query failed: ' + saErr.message);
        const srMap = Object.fromEntries(saleRecords.map(s => [s.id, s]));
        salesFlat = (saleAnimals || [])
          .filter(sa => !scope || inScope(sa.animals))
          .map(sa => {
            const sr = srMap[sa.sale_record_id] || {};
            return {
              date:  sr.sale_date || '',
              type:  'sale',
              vid:   sa.animals?.vid || '—',
              sex:   sa.animals?.sex || '—',
              herd:  sa.animals?.herds?.name || '—',
              notes: [sr.sale_location, sr.sale_type].filter(Boolean).join(' · ') || '',
            };
          });
      }

      // ── 5. Deaths during period ─────────────────────────────────────────────
      const { data: deathRaw, error: drErr } = await supabase.from('death_records')
        .select('id, death_date, cause_of_death, notes, animals(id, vid, sex, herd_id, project, herds(name))')
        .gte('death_date', startDate)
        .lte('death_date', endDate)
        .limit(10000);
      if (drErr) throw new Error('Deaths query failed: ' + drErr.message);
      const deathsFlat = (deathRaw || [])
        .filter(d => !scope || inScope(d.animals))
        .map(d => ({
          date:  d.death_date,
          type:  'death',
          vid:   d.animals?.vid || '—',
          sex:   d.animals?.sex || '—',
          herd:  d.animals?.herds?.name || '—',
          notes: d.cause_of_death || d.notes || '',
        }));

      // ── 6. Ending inventory (currently active) ─────────────────────────────
      let endQ = supabase.from('animals').select('id', { count: 'exact', head: true }).eq('status', 'active').limit(10000);
      endQ = scopeQuery(endQ, scope, herds);
      const { count: endingCount, error: endErr } = await endQ;
      if (endErr) throw new Error('Ending inventory query failed: ' + endErr.message);

      // ── 7. Build unified transaction ledger ────────────────────────────────
      const purchasesFlat = (added || []).map(a => ({
        date:  a.created_at.split('T')[0],
        type:  'purchase',
        vid:   a.vid || '—',
        sex:   a.sex || '—',
        herd:  a.herds?.name || '—',
        notes: a.notes || '',
      }));
      const calvingsFlat = calvingData.map(c => {
        const dam = damsMap[c.dam_id];
        return {
          date:  c.calving_date,
          type:  'birth',
          vid:   dam?.vid ? `(dam: ${dam.vid})` : '—',
          sex:   c.calf_sex || '—',
          herd:  dam?.herds?.name || '—',
          notes: 'Live calf',
        };
      });

      const transactions = [...purchasesFlat, ...calvingsFlat, ...salesFlat, ...deathsFlat]
        .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      setResults({
        beginningCount: beginningInventory.length,
        purchases:      purchasesFlat.length,
        births:         calvingsFlat.length,
        sales:          salesFlat.length,
        deaths:         deathsFlat.length,
        endingCount:    endingCount || 0,
        transactions,
        startDate,
        endDate,
        herdName:       scope ? scopeLabel(scope, herds) : 'All Herds',
      });
      toast(`Report complete — ${transactions.length} event${transactions.length !== 1 ? 's' : ''}`, 'success');
    } catch (err) {
      toast('Error: ' + err.message, 'error');
    }
    setLoading(false);
  };

  const exportCSV = () => {
    if (!results) return;
    const rows = [
      `Ranch Savvy — Inventory Change Report`,
      `Scope: ${results.herdName}`,
      `Period: ${results.startDate} to ${results.endDate}`,
      `Generated: ${new Date().toLocaleString()}`,
      ``,
      `SUMMARY`,
      `Beginning Inventory,${results.beginningCount}`,
      `+ Purchases / Additions,${results.purchases}`,
      `+ Births (Live Calves),${results.births}`,
      `− Sales,${results.sales}`,
      `− Deaths,${results.deaths}`,
      `= Calculated Ending,${results.beginningCount + results.purchases + results.births - results.sales - results.deaths}`,
      `Actual Ending Inventory,${results.endingCount}`,
      `Unreconciled Difference,${results.endingCount - (results.beginningCount + results.purchases + results.births - results.sales - results.deaths)}`,
      ``,
      `TRANSACTIONS`,
      `Date,Type,VID,Sex,Herd,Notes`,
      ...results.transactions.map(t =>
        [t.date, t.type.toUpperCase(), t.vid, t.sex, t.herd, `"${(t.notes||'').replace(/"/g,'""')}"`].join(',')
      ),
    ];
    const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ranch_savvy_inventory_change_${results.startDate}_${results.endDate}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    toast('CSV exported!', 'success');
  };

  const calcEnding = results
    ? results.beginningCount + results.purchases + results.births - results.sales - results.deaths
    : 0;
  const diff = results ? results.endingCount - calcEnding : 0;

  return (
    <div>
      {/* ── Parameters ── */}
      <div className="detail-card" style={{marginBottom:'24px'}}>
        <h3 style={{marginBottom:'16px'}}>Report Parameters</h3>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'14px', alignItems:'end'}}>
          <div className="form-group" style={{margin:0}}>
            <label className="form-label">Start Date</label>
            <input className="form-input" type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
          </div>
          <div className="form-group" style={{margin:0}}>
            <label className="form-label">End Date</label>
            <input className="form-input" type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
          </div>
          <div className="form-group" style={{margin:0}}>
            <label className="form-label">Scope</label>
            <ScopeSelect value={scope} onChange={setScope} herds={herds} projects={projects} />
          </div>
        </div>
        <div style={{display:'flex', gap:'10px', marginTop:'16px', alignItems:'center'}}>
          <button className="btn btn-primary" onClick={runReport} disabled={loading}>
            {loading ? 'Running...' : 'Run Report'}
          </button>
          {results && <button className="btn btn-secondary" onClick={exportCSV}>⤓ Export CSV</button>}
          {loading && <span style={{color:'var(--ash)', fontSize:'13px', fontFamily:'IBM Plex Mono, monospace'}}>Querying database...</span>}
        </div>
      </div>

      {/* ── Results ── */}
      {results && (
        <>
          {/* Stat cards */}
          <div style={{display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:'12px', marginBottom:'16px'}}>
            {[
              { label:'BEG. INVENTORY',    value: results.beginningCount, color:'var(--cream)',  sign:'' },
              { label:'+ PURCHASES',        value: results.purchases,      color:'var(--sky)',   sign:'+' },
              { label:'+ BIRTHS',           value: results.births,         color:'var(--sage)',  sign:'+' },
              { label:'− SALES',            value: results.sales,          color:'var(--hay)',   sign:'−' },
              { label:'− DEATHS',           value: results.deaths,         color:'#e05555',      sign:'−' },
              { label:'END INVENTORY',      value: results.endingCount,    color:'var(--cream)', sign:'' },
            ].map(s => (
              <div key={s.label} className="stat-card">
                <div className="stat-label">{s.label}</div>
                <div className="stat-value" style={{color: s.color, fontSize:'28px', lineHeight:'1.1'}}>
                  {s.sign}{s.value}
                </div>
              </div>
            ))}
          </div>

          {/* Reconciliation banner */}
          <div style={{
            background: diff === 0 ? 'rgba(148,180,159,0.15)' : 'rgba(168,218,220,0.1)',
            border: `1px solid ${diff === 0 ? 'rgba(148,180,159,0.5)' : 'rgba(168,218,220,0.5)'}`,
            borderRadius:'6px', padding:'12px 18px', marginBottom:'20px',
            display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:'8px',
          }}>
            <span style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'12px', color: diff === 0 ? 'var(--sage)' : 'var(--hay)'}}>
              {diff === 0 ? '✓ RECONCILED' : `⚠ ${Math.abs(diff)} HEAD UNACCOUNTED`}
              <span style={{color:'var(--ash)', marginLeft:'12px'}}>
                {results.beginningCount} beg &nbsp;+ {results.purchases} pur &nbsp;+ {results.births} births &nbsp;− {results.sales} sales &nbsp;− {results.deaths} deaths &nbsp;= {calcEnding} calc &nbsp;| {results.endingCount} actual
              </span>
            </span>
            <span style={{fontFamily:'IBM Plex Mono, monospace', fontSize:'11px', color:'var(--ash)'}}>
              {results.herdName} · {results.startDate} → {results.endDate}
            </span>
          </div>

          {/* Transaction ledger */}
          {results.transactions.length === 0 ? (
            <div className="empty-state">
              <h3>No transactions in this period</h3>
              <p>No purchases, births, sales, or deaths recorded between {startDate} and {endDate}
                {scope ? ` for ${scopeLabel(scope, herds)}` : ''}.</p>
            </div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>+/−</th>
                    <th>VID</th>
                    <th>Sex</th>
                    <th>Herd</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody>
                  {results.transactions.map((t, i) => {
                    const ts = TYPE_STYLE[t.type] || { color:'var(--ash)', label: t.type.toUpperCase(), sign:'' };
                    return (
                      <tr key={i} style={{cursor:'default'}}>
                        <td className="td-mono" style={{fontSize:'12px'}}>{t.date}</td>
                        <td>
                          <span style={{
                            display:'inline-block', padding:'2px 8px', borderRadius:'3px',
                            fontSize:'11px', fontFamily:'IBM Plex Mono, monospace', fontWeight:'600',
                            color: ts.color, background: ts.color + '1a', border: `1px solid ${ts.color}44`,
                          }}>{ts.label}</span>
                        </td>
