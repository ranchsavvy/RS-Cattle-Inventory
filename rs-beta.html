// Local calendar date (YYYY-MM-DD). NEVER use new Date().toISOString().split('T')[0] for "today" —
// that returns the UTC date, which rolls over at 6-7pm Central and stamps evening entries with tomorrow's date.
const todayLocal = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

// Status changes record the date it HAPPENED, not the day it was entered. Blank or future dates are rejected.
const checkEventDate = (d) => {
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return 'Enter the date it happened.';
  if (d > todayLocal()) return "The date can't be in the future.";
  return null;
};
const STATUS_DATE_LABEL = { sold: 'Date Sold', dead: 'Date of Death', archived: 'Date Archived', active: 'Date Returned to Active' };

// Field Entry: pull "when it happened" out of the text — "yesterday", "today", 9/18, 9/18/26, Sept 18, September 18th 2026.
// Returns the date plus the text with that phrase cut out, so the date's numbers are never read as tag numbers.
const FE_MONTHS = { january:1, jan:1, february:2, feb:2, march:3, mar:3, april:4, apr:4, may:5, june:6, jun:6, july:7, jul:7, august:8, aug:8, september:9, sept:9, sep:9, october:10, oct:10, november:11, nov:11, december:12, dec:12 };
const extractEntryDate = (text) => {
  const today = todayLocal();
  const [ty, tm, td] = today.split('-').map(Number);
  const ymd = (y, m, d) => {
    const dt = new Date(y, m - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null; // e.g. 2/30
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  };
  // No year given: this year, unless that lands in the future — then last year (entering 12/28 in January)
  const noYear = (m, d) => { const thisYear = ymd(ty, m, d); return thisYear && thisYear > today ? ymd(ty - 1, m, d) : thisYear; };
  const cut = (phrase) => text.replace(phrase, ' ');
  let m = text.match(/\byesterday\b/i);
  if (m) { const dt = new Date(ty, tm - 1, td - 1); return { date: ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()), stripped: cut(m[0]) }; }
  m = text.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{4}|\d{2}))?\b/);
  if (m) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : null;
    const date = y ? ymd(y, Number(m[1]), Number(m[2])) : noYear(Number(m[1]), Number(m[2]));
    if (date) return { date, stripped: cut(m[0]) };
  }
  m = text.match(/\b(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sept|sep|oct|nov|dec)\.?\s+(\d{1,2})(?:st|nd|rd|th)?\b(?:,?\s+(\d{4})\b)?/i);
  if (m) {
    const mo = FE_MONTHS[m[1].toLowerCase()], d = Number(m[2]);
    const date = m[3] ? ymd(Number(m[3]), mo, d) : noYear(mo, d);
    if (date) return { date, stripped: cut(m[0]) };
  }
  if (/\btoday\b/i.test(text)) return { date: today, stripped: text };
  return { date: null, stripped: text };
};

// Run a Supabase .in() query in chunks to avoid URL length limits (GET requests fail past ~8-16KB;
// ~200 UUIDs per request is safe). buildQuery receives one chunk of ids and must return the query promise.
const chunkedIn = async (ids, buildQuery, chunkSize = 200) => {
  let all = [];
  for (let i = 0; i < ids.length; i += chunkSize) {
    const { data, error } = await buildQuery(ids.slice(i, i + chunkSize));
    if (error) return { data: null, error };
    all = all.concat(data || []);
  }
  return { data: all, error: null };
};

const formatDate = (d) => {
  if (!d) return '—';
  const [year, month, day] = d.split('T')[0].split('-');
  return new Date(parseInt(year), parseInt(month) - 1, parseInt(day))
    .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};

// ===== PROJECTS (Ambrook) =====
// A project tag rides on the animal, not the herd, so it survives herd moves. Names should match Ambrook Projects.
// animals.project references projects.name with ON UPDATE CASCADE, so a rename here re-tags every animal in one step,
// and ON DELETE RESTRICT stops a project that still has cattle from being deleted.
const PROJECTS_SQL = `-- Run in Supabase → SQL Editor. Safe to re-run: adds whatever is missing.
-- Ambrook-style projects that stay with an animal across herds, plus a dated log of every project change.

-- 1. Projects
create table if not exists public.projects (
  id bigint generated always as identity primary key,
  name text not null unique,
  is_active boolean not null default true,
  notes text,
  created_at timestamptz not null default now()
);
alter table public.projects enable row level security;
drop policy if exists "authenticated full access" on public.projects;
create policy "authenticated full access" on public.projects for all to authenticated using (true) with check (true);
insert into public.projects (name) values ('2027 Blue Steers') on conflict (name) do nothing;

-- 2. Current project on the animal, and the date it joined that project
alter table public.animals add column if not exists project text
  references public.projects(name) on update cascade on delete restrict;
alter table public.animals add column if not exists project_date date;
create index if not exists animals_project_idx on public.animals (project) where project is not null;

-- 3. Project history: one row per change, dated when it took effect (transfers between projects)
do $$
declare animal_t text;
begin
  select format_type(atttypid, atttypmod) into animal_t from pg_attribute where attrelid = 'public.animals'::regclass and attname = 'id';
  execute format($f$
    create table if not exists public.project_history (
      id bigint generated always as identity primary key,
      animal_id %s not null references public.animals(id) on delete cascade,
      from_project text references public.projects(name) on update cascade on delete restrict,
      to_project   text references public.projects(name) on update cascade on delete restrict,
      effective_date date not null,
      created_at timestamptz not null default now()
    )$f$, animal_t);
end $$;
create index if not exists project_history_animal_idx on public.project_history (animal_id, effective_date, id);
alter table public.project_history enable row level security;
drop policy if exists "authenticated full access" on public.project_history;
create policy "authenticated full access" on public.project_history for all to authenticated using (true) with check (true);

-- 4. Backfill: animals already tagged get a starting history row dated at arrival
update public.animals set project_date = coalesce(purchase_date, case when not coalesce(purchased, false) then date_of_birth end, created_at::date)
  where project is not null and project_date is null;
insert into public.project_history (animal_id, from_project, to_project, effective_date)
  select a.id, null, a.project, a.project_date from public.animals a
  where a.project is not null and not exists (select 1 from public.project_history h where h.animal_id = a.id);

-- 5. Every project change writes history, whichever screen or import made it.
--    The app sends project_date with a change to backdate it; otherwise it's dated today (or the purchase date for a new animal).
create or replace function public.animals_project_date() returns trigger language plpgsql as $f$
begin
  -- A project rename cascades into animals.project; the old name is already gone from projects. Not a transfer.
  if tg_op = 'UPDATE' and old.project is not null and new.project is not null
     and not exists (select 1 from public.projects where name = old.project) then return new; end if;
  if tg_op = 'INSERT' then
    if new.project is not null then new.project_date := coalesce(new.project_date, new.purchase_date, current_date); end if;
  elsif new.project is distinct from old.project then
    if new.project_date is null or new.project_date is not distinct from old.project_date then new.project_date := current_date; end if;
  end if;
  return new;
end $f$;
create or replace function public.animals_project_history() returns trigger language plpgsql as $f$
begin
  if tg_op = 'UPDATE' and old.project is not null and new.project is not null
     and not exists (select 1 from public.projects where name = old.project) then return null; end if;   -- rename, not a transfer
  if tg_op = 'INSERT' then
    if new.project is not null then
      insert into public.project_history (animal_id, from_project, to_project, effective_date) values (new.id, null, new.project, new.project_date);
    end if;
  elsif new.project is distinct from old.project then
    insert into public.project_history (animal_id, from_project, to_project, effective_date) values (new.id, old.project, new.project, new.project_date);
  end if;
  return null;
end $f$;
drop trigger if exists animals_project_date_trg on public.animals;
create trigger animals_project_date_trg before insert or update of project, project_date on public.animals
  for each row execute function public.animals_project_date();
drop trigger if exists animals_project_history_trg on public.animals;
create trigger animals_project_history_trg after insert or update of project on public.animals
  for each row execute function public.animals_project_history();`;

const fmtMoney = (n) => `$${Math.round(n).toLocaleString()}`;

function ProjectsModal({ projects, projectsReady, animals, onChanged, onView, onClose, toast }) {
  const [newName, setNewName] = useState('');
  const [edits, setEdits] = useState({});

  // Per-project roll-up from the loaded inventory — head by status and purchase cost, for squaring up with Ambrook
  const stats = useMemo(() => {
    const s = {};
    animals.forEach(a => {
      if (!a.project) return;
      const t = s[a.project] = s[a.project] || { total: 0, active: 0, sold: 0, dead: 0, other: 0, cost: 0, priced: 0 };
      t.total++;
      if (['active', 'sold', 'dead'].includes(a.status)) t[a.status]++; else t.other++;
      if (a.purchase_price_per_head) { t.cost += Number(a.purchase_price_per_head); t.priced++; }
    });
    return s;
  }, [animals]);

  const add = async () => {
    const name = newName.trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (projects.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('That project already exists', 'error'); return; }
    const { error } = await supabase.from('projects').insert({ name });
    if (error) toast('Error: ' + error.message, 'error');
    else { setNewName(''); onChanged(); toast('Project added', 'success'); }
  };
  const rename = async (p) => {
    const name = (edits[p.id] ?? p.name).trim().replace(/\s+/g, ' ');
    if (!name || name === p.name) return;
    if (projects.some(x => x.id !== p.id && x.name.toLowerCase() === name.toLowerCase())) { toast('That name is already used', 'error'); return; }
    const n = stats[p.name]?.total || 0;
    if (n && !confirm(`Rename "${p.name}" to "${name}"? ${n} animal${n === 1 ? '' : 's'} will carry the new name.`)) return;
    const { error } = await supabase.from('projects').update({ name }).eq('id', p.id);
    if (error) { toast('Error: ' + error.message, 'error'); return; }
    setEdits(x => { const y = { ...x }; delete y[p.id]; return y; });
    onChanged(true); toast('Project renamed', 'success');
  };
  const toggle = async (p) => {
    const { error } = await supabase.from('projects').update({ is_active: !p.is_active }).eq('id', p.id);
    if (error) toast('Error: ' + error.message, 'error'); else onChanged();
  };
  const remove = async (p) => {
    const n = stats[p.name]?.total || 0;
    if (n > 0) { toast(`${n} animal(s) still carry "${p.name}" — clear them or archive the project instead`, 'error'); return; }
    if (!confirm(`Delete project "${p.name}"?`)) return;
    const { error } = await supabase.from('projects').delete().eq('id', p.id);
    if (error?.code === '23503') toast(`"${p.name}" has cattle in its history — archive it instead so past reports keep working`, 'error');
    else if (error) toast('Error: ' + error.message, 'error'); else onChanged();
  };

  const mono = { fontFamily: 'IBM Plex Mono', fontSize: '11px', color: 'var(--ash)' };
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:'640px'}}>
        <div className="modal-header">
          <h2 className="modal-title">Projects</h2>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {!projectsReady ? <>
            <p style={{fontSize:'13px', color:'var(--ash)', lineHeight:1.5, marginBottom:'10px'}}>The projects table isn't set up yet. Run this once in Supabase → SQL Editor, then reload the page.</p>
            <textarea readOnly value={PROJECTS_SQL} onFocus={e => e.target.select()} style={{width:'100%', height:'240px', ...mono, color:'var(--cream)', background:'var(--charcoal)', border:'1px solid rgba(58,125,123,0.4)', borderRadius:'4px', padding:'8px'}} />
            <button className="btn btn-ghost" style={{marginTop:'6px'}} onClick={() => { navigator.clipboard?.writeText(PROJECTS_SQL); toast('SQL copied', 'success'); }}>Copy SQL</button>
          </> : <>
            <div style={{fontSize:'12px', color:'var(--ash)', marginBottom:'12px', lineHeight:1.5}}>A project stays with the animal whichever herd it's in. Names should match Ambrook Projects exactly — renaming here re-tags every animal carrying the old name.</div>
            <div style={{display:'flex', gap:'8px', marginBottom:'16px'}}>
              <input className="form-input" style={{flex:1}} placeholder="New project name, e.g. 2027 Blue Steers" value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => e.key === 'Enter' && add()} />
              <button className="btn btn-primary" onClick={add}>Add</button>
            </div>
            {projects.length === 0 && <div style={{color:'var(--ash)', fontSize:'13px'}}>No projects yet.</div>}
            {projects.map(p => {
              const val = edits[p.id] ?? p.name;
              const t = stats[p.name];
              return (
                <div key={p.id} style={{padding:'10px 0', borderBottom:'1px solid rgba(58,125,123,0.2)', opacity: p.is_active ? 1 : 0.55}}>
                  <div style={{display:'flex', gap:'6px', alignItems:'center'}}>
                    <input className="form-input" style={{flex:1}} value={val} onChange={e => setEdits(x => ({...x, [p.id]: e.target.value}))} onKeyDown={e => e.key === 'Enter' && rename(p)} />
                    {val.trim() !== p.name && <button className="btn btn-primary" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => rename(p)}>Save</button>}
                    {t && <button className="btn btn-secondary" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => onView(p.name)}>View</button>}
                    <button className="btn btn-ghost" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => toggle(p)}>{p.is_active ? 'Archive' : 'Restore'}</button>
                    <button className="btn btn-ghost" style={{padding:'6px 10px', fontSize:'12px'}} onClick={() => remove(p)}>✕</button>
                  </div>
                  <div style={{...mono, marginTop:'6px'}}>
                    {t ? <>
                      {t.total} hd tagged · <span style={{color:'var(--sage)'}}>{t.active} active</span> · {t.sold} sold · {t.dead} dead{t.other ? ` · ${t.other} other` : ''}
                      {t.priced > 0 && <> · purchase {fmtMoney(t.cost)} ({fmtMoney(t.cost / t.priced)}/hd{t.priced < t.total ? `, ${t.priced} hd priced` : ''})</>}
                    </> : 'no animals tagged'}
                  </div>
                </div>
              );
            })}
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Done</button>
        </div>
      </div>
    </div>
  );
}

// Project picker shared by Add / Edit / Bulk Edit. Archived projects only show if already on the record.
function ProjectSelect({ projects, value, onChange, disabled }) {
  const active = projects.filter(p => p.is_active).map(p => p.name);
  return (
    <select className="form-select" value={value || ''} disabled={disabled} onChange={e => onChange(e.target.value)}>
      <option value="">-- No Project --</option>
      {active.map(n => <option key={n} value={n}>{n}</option>)}
      {value && !active.includes(value) && <option value={value}>{value} (archived)</option>}
    </select>
  );
}

        .from('animals')
        .select('*, herds(name), animal_classes(name)')
        .order('vid', { ascending: true })
        .range(from, from + PAGE - 1);
      if (error) { toast('Error loading animals: ' + error.message, 'error'); setLoading(false); return; }
      allData = allData.concat(data || []);
      if (!data || data.length < PAGE) break;
      from += PAGE;
    }
    setAllAnimals(allData);
    // Paginate ownership history too
    let allOwnership = [];
    from = 0;
    while (true) {
      const { data: ownershipData, error: ownershipError } = await supabase
        .from('animal_ownership_history')
        .select('animal_id, partnership_id, partnerships(name)')
        .order('effective_date', { ascending: false })
        .range(from, from + PAGE - 1);
      if (ownershipError) break;
      allOwnership = allOwnership.concat(ownershipData || []);
      if (!ownershipData || ownershipData.length < PAGE) break;
      from += PAGE;
    }
    const animalIdSet = new Set(allData.map(a => a.id));
    const ownerMap = {};
    allOwnership.forEach(o => {
      if (animalIdSet.has(o.animal_id) && !ownerMap[o.animal_id] && o.partnerships?.name)
        ownerMap[o.animal_id] = o.partnerships.name;
    });
    setAnimalOwners(ownerMap);
    setLoading(false);
  }, []);

  const fetchHerds = async () => { const { data } = await supabase.from('herds').select('*').order('name'); setHerds(data || []); };
  const fetchPartnerships = async () => { const { data } = await supabase.from('partnerships').select('*').order('name'); setPartnerships(data || []); };
  const fetchProjects = async () => {
    const { data, error } = await supabase.from('projects').select('*').order('name');
    setProjectsReady(!error);
    setProjects(error ? [] : (data || []));
  };

  useEffect(() => { fetchHerds(); fetchPartnerships(); fetchProjects(); }, []);
  useEffect(() => { fetchAnimals(); }, [fetchAnimals]);

  const filteredAnimals = useMemo(() => {
    let filtered = [...allAnimals];
    if (search) { const s = search.toLowerCase(); filtered = filtered.filter(a => a.vid?.toLowerCase().includes(s) || a.eid?.toLowerCase().includes(s) || a.calf_id_code?.toLowerCase().includes(s)); }
    if (herdFilter.length > 0) filtered = filtered.filter(a => (herdFilter.includes('NO_HERD') && !a.herd_id) || herdFilter.includes(a.herd_id));
    if (sexFilter.length > 0) filtered = filtered.filter(a => sexFilter.includes(a.sex));
    if (statusFilter.length > 0) filtered = filtered.filter(a => statusFilter.includes(a.status));
    if (breedingStatusFilter.length > 0) filtered = filtered.filter(a => breedingStatusFilter.includes(a.breeding_status));
    if (ownerFilter.length > 0) filtered = filtered.filter(a => {
      const ownerName = animalOwners[a.id];
      if (ownerFilter.includes('NO_OWNER') && !ownerName) return true;
      const partnership = partnerships.find(p => p.name === ownerName);
      return ownerName && ownerFilter.includes(partnership?.id);
    });
    if (purchasedFilter === 'yes') filtered = filtered.filter(a => a.purchased);
    if (purchasedFilter === 'no') filtered = filtered.filter(a => !a.purchased);
    if (projectFilter.length > 0) filtered = filtered.filter(a => a.project ? projectFilter.includes(a.project) : projectFilter.includes('NO_PROJECT'));
    if (breedFilter) filtered = filtered.filter(a => a.breed?.toLowerCase().includes(breedFilter.toLowerCase()));
    if (dobStartDate || dobEndDate) filtered = filtered.filter(a => {
      if (!a.date_of_birth) return false;
      const dob = a.date_of_birth.split('T')[0];
      if (dobStartDate && dobEndDate) return dob >= dobStartDate && dob <= dobEndDate;
      if (dobStartDate) return dob >= dobStartDate;
      return dob <= dobEndDate;
    });
    filtered.sort((a, b) => {
      let aVal, bVal;
      switch(sortColumn) {
        case 'vid': aVal = a.vid||''; bVal = b.vid||''; if (!isNaN(aVal) && !isNaN(bVal)) return sortDirection==='asc' ? Number(aVal)-Number(bVal) : Number(bVal)-Number(aVal); break;
        case 'eid': aVal=a.eid||''; bVal=b.eid||''; break;
        case 'calfId': aVal=a.calf_id_code||''; bVal=b.calf_id_code||''; break;
        case 'sex': aVal=a.sex||''; bVal=b.sex||''; break;
        case 'herd': aVal=a.herds?.name||''; bVal=b.herds?.name||''; break;
        case 'owner': aVal=animalOwners[a.id]||''; bVal=animalOwners[b.id]||''; break;
        case 'dob': aVal=a.date_of_birth||''; bVal=b.date_of_birth||''; break;
        case 'tagColor': aVal=a.tag_color||''; bVal=b.tag_color||''; break;
        case 'breedingStatus': aVal=a.breeding_status||''; bVal=b.breeding_status||''; break;
        case 'project': aVal=a.project||''; bVal=b.project||''; break;
        case 'mouth': aVal=a.mouth||''; bVal=b.mouth||''; break;
        case 'udder': aVal=a.udder_score||''; bVal=b.udder_score||''; break;
        case 'bcs': { const x = a.condition_score==null ? -1 : Number(a.condition_score), y = b.condition_score==null ? -1 : Number(b.condition_score); return sortDirection==='asc' ? x-y : y-x; }
        case 'cull': aVal=a.is_cull?'1':'0'; bVal=b.is_cull?'1':'0'; break;
        case 'status': aVal=a.status||''; bVal=b.status||''; break;
        default: aVal=''; bVal='';
      }
      if (typeof aVal==='string' && typeof bVal==='string') return sortDirection==='asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
      return 0;
    });
    return filtered;
  }, [allAnimals, search, herdFilter, sexFilter, statusFilter, breedingStatusFilter, ownerFilter, purchasedFilter, projectFilter, breedFilter, dobStartDate, dobEndDate, animalOwners, partnerships, sortColumn, sortDirection]);

  const paginatedAnimals = useMemo(() => filteredAnimals.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE), [filteredAnimals, page]);

  const stats = useMemo(() => {
    const activeFiltered = filteredAnimals.filter(a => a.status === 'active');
    return { total: activeFiltered.length, cows: activeFiltered.filter(a => ['cow','heifer'].includes(a.sex)).length, bulls: activeFiltered.filter(a => a.sex==='bull').length, stockers: activeFiltered.filter(a => a.sex==='steer').length };
  }, [filteredAnimals]);

  const toggleFilter = (arr, setArr, val) => { setArr(prev => prev.includes(val) ? prev.filter(v => v !== val) : [...prev, val]); setPage(0); };
  const handleSort = (column) => { if (sortColumn === column) setSortDirection(d => d==='asc'?'desc':'asc'); else { setSortColumn(column); setSortDirection('asc'); } setPage(0); };
  const clearAllFilters = () => { setSearch(''); setHerdFilter([]); setSexFilter([]); setStatusFilter(['active']); setBreedingStatusFilter([]); setOwnerFilter([]); setPurchasedFilter(''); setProjectFilter([]); setBreedFilter(''); setDobStartDate(''); setDobEndDate(''); setPage(0); };

  const exportToCSV = () => {
    const headers = []; const rows = [];
    if (visibleColumns.vid) headers.push('VID');
    if (visibleColumns.eid) headers.push('EID');
    if (visibleColumns.calfId) headers.push('Calf ID');
    if (visibleColumns.sex) headers.push('Sex');
    if (visibleColumns.herd) headers.push('Herd');
    if (visibleColumns.owner) headers.push('Owner');
    if (visibleColumns.dob) headers.push('Date of Birth');
    if (visibleColumns.tagColor) headers.push('Tag Color');
    if (visibleColumns.breedingStatus) headers.push('Breeding Status');
    if (visibleColumns.project) headers.push('Project');
    if (visibleColumns.mouth) headers.push('Mouth');
    if (visibleColumns.udder) headers.push('Udder');
    if (visibleColumns.bcs) headers.push('Condition Score');
    if (visibleColumns.cull) headers.push('Cull');
    if (visibleColumns.status) headers.push('Status');
    filteredAnimals.forEach(a => {
      const row = [];
      if (visibleColumns.vid) row.push(a.vid||'');
      if (visibleColumns.eid) row.push(a.eid||'');
      if (visibleColumns.calfId) row.push(a.calf_id_code||'');
      if (visibleColumns.sex) row.push(sexLabel(a.sex));
      if (visibleColumns.herd) row.push(a.herds?.name||'');
      if (visibleColumns.owner) row.push(animalOwners[a.id]||'');
      if (visibleColumns.dob) row.push(formatDate(a.date_of_birth)||'');
      if (visibleColumns.tagColor) row.push(a.tag_color||'');
      if (visibleColumns.breedingStatus) row.push(a.breeding_status?.replace('_',' ')||'');
      if (visibleColumns.project) row.push(a.project||'');
      if (visibleColumns.mouth) row.push(a.mouth||'');
      if (visibleColumns.udder) row.push(a.udder_score||'');
      if (visibleColumns.bcs) row.push(a.condition_score==null?'':Number(a.condition_score));
      if (visibleColumns.cull) row.push(a.is_cull?'Yes':'No');
      if (visibleColumns.status) row.push(a.status);
      rows.push(row);
    });
    const csvContent = [headers.join(','), ...rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ranch_savvy_inventory_${todayLocal()}.csv`; a.click();
    URL.revokeObjectURL(url);
    toast(`Exported ${filteredAnimals.length} animals to CSV`, 'success');
  };

  const SortTh = ({ col, label }) => (
    <th onClick={() => handleSort(col)} style={{cursor:'pointer', userSelect:'none'}}>
      {label} {sortColumn === col && (sortDirection === 'asc' ? '↑' : '↓')}
    </th>
  );

  return (
    <div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Total Active</div><div className="stat-value">{stats.total}</div><div className="stat-sub">{filteredAnimals.length !== allAnimals.length ? 'filtered' : 'head on inventory'}</div></div>
        <div className="stat-card"><div className="stat-label">Cows & Heifers</div><div className="stat-value">{stats.cows}</div><div className="stat-sub">breeding females</div></div>
        <div className="stat-card"><div className="stat-label">Bulls</div><div className="stat-value">{stats.bulls}</div><div className="stat-sub">breeding males</div></div>
        <div className="stat-card"><div className="stat-label">Stockers</div><div className="stat-value">{stats.stockers}</div><div className="stat-sub">steers on grass</div></div>
      </div>

      <div style={{marginBottom:'16px'}}>
        <div className="filter-bar">
          <div className="search-box">
            <span className="search-icon">🔍</span>
            <input type="text" placeholder="Search by VID, EID, or Calf ID..." value={search} onChange={e => { setSearch(e.target.value); setPage(0); }} />
          </div>
          <button className="btn btn-ghost" onClick={() => setShowAdvanced(!showAdvanced)} style={{whiteSpace:'nowrap'}}>{showAdvanced ? '− Filters' : '+ Filters'}</button>
          <button className="btn btn-ghost" onClick={clearAllFilters} style={{whiteSpace:'nowrap'}}>Clear All</button>
          <button className="btn btn-ghost" onClick={() => setShowProjects(true)} style={{whiteSpace:'nowrap'}}>Projects</button>
          <button className="btn btn-secondary" onClick={exportToCSV} style={{whiteSpace:'nowrap'}}>⤓ Export CSV ({filteredAnimals.length})</button>
        </div>

        {showAdvanced && (
          <div style={{marginTop:'12px', padding:'16px', background:'var(--charcoal)', borderRadius:'6px', border:'1px solid rgba(58,125,123,0.3)'}}>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'12px'}}>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>HERD</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  <label style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                    <input type="checkbox" checked={herdFilter.includes('NO_HERD')} onChange={() => toggleFilter(herdFilter, setHerdFilter, 'NO_HERD')} />
                    <span style={{color:'var(--ash)', fontStyle:'italic'}}>No Herd Assigned</span>
                  </label>
                  {herds.map(h => (
                    <label key={h.id} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                      <input type="checkbox" checked={herdFilter.includes(h.id)} onChange={() => toggleFilter(herdFilter, setHerdFilter, h.id)} />
                      {h.name}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>SEX/CLASS</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  {['cow','heifer','bull','steer','calf_male','calf_female','horse'].map(s => (
                    <label key={s} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                      <input type="checkbox" checked={sexFilter.includes(s)} onChange={() => toggleFilter(sexFilter, setSexFilter, s)} />
                      {sexLabel(s)}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>BREEDING STATUS</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  {['open','bred_spring','bred_fall','dry','nursing','unknown'].map(bs => (
                    <label key={bs} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                      <input type="checkbox" checked={breedingStatusFilter.includes(bs)} onChange={() => toggleFilter(breedingStatusFilter, setBreedingStatusFilter, bs)} />
                      {bs.replace('_', ' ')}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>OWNER</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  <label style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                    <input type="checkbox" checked={ownerFilter.includes('NO_OWNER')} onChange={() => toggleFilter(ownerFilter, setOwnerFilter, 'NO_OWNER')} />
                    <span style={{color:'var(--ash)', fontStyle:'italic'}}>No Owner Assigned</span>
                  </label>
                  {partnerships.map(p => (
                    <label key={p.id} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                      <input type="checkbox" checked={ownerFilter.includes(p.id)} onChange={() => toggleFilter(ownerFilter, setOwnerFilter, p.id)} />
                      {p.name}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>STATUS</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  {['active','sold','dead','archived'].map(st => (
                    <label key={st} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                      <input type="checkbox" checked={statusFilter.includes(st)} onChange={() => toggleFilter(statusFilter, setStatusFilter, st)} />
                      {st}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>PROJECT</label>
                <div style={{display:'flex', flexDirection:'column', gap:'4px'}}>
                  <label style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                    <input type="checkbox" checked={projectFilter.includes('NO_PROJECT')} onChange={() => toggleFilter(projectFilter, setProjectFilter, 'NO_PROJECT')} />
                    <span style={{color:'var(--ash)', fontStyle:'italic'}}>No Project</span>
                  </label>
                  {projects.map(p => (
                    <label key={p.id} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)', opacity: p.is_active ? 1 : 0.6}}>
                      <input type="checkbox" checked={projectFilter.includes(p.name)} onChange={() => toggleFilter(projectFilter, setProjectFilter, p.name)} />
                      {p.name}{!p.is_active && ' (archived)'}
                    </label>
                  ))}
                </div>
              </div>
              <div>
                <label style={{display:'block', fontSize:'11px', color:'var(--ash)', marginBottom:'6px', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>DATE OF BIRTH</label>
                <div style={{display:'flex', flexDirection:'column', gap:'8px'}}>
                  <div>
                    <label style={{display:'block', fontSize:'10px', color:'var(--ash)', marginBottom:'4px'}}>From</label>
                    <input type="date" className="form-input" value={dobStartDate} onChange={e => { setDobStartDate(e.target.value); setPage(0); }} style={{width:'100%', padding:'6px 8px', fontSize:'12px'}} />
                  </div>
                  <div>
                    <label style={{display:'block', fontSize:'10px', color:'var(--ash)', marginBottom:'4px'}}>To</label>
                    <input type="date" className="form-input" value={dobEndDate} onChange={e => { setDobEndDate(e.target.value); setPage(0); }} style={{width:'100%', padding:'6px 8px', fontSize:'12px'}} />
                  </div>
                  {(dobStartDate || dobEndDate) && <button className="btn btn-ghost" onClick={() => { setDobStartDate(''); setDobEndDate(''); }} style={{padding:'4px 8px', fontSize:'11px'}}>Clear Dates</button>}
                </div>
              </div>
            </div>
          </div>
        )}

        {selectedAnimals.size > 0 && (
          <div style={{marginTop:'12px', padding:'12px 16px', background:'rgba(42,157,143,0.15)', borderRadius:'6px', border:'1px solid var(--rust)', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
            <span style={{color:'var(--hay)', fontSize:'13px', fontFamily:'IBM Plex Mono, monospace'}}>{selectedAnimals.size} animals selected</span>
            <div style={{display:'flex', gap:'8px'}}>
              <button className="btn btn-secondary" onClick={() => setSelectedAnimals(new Set())}>Clear Selection</button>
              <button className="btn btn-primary" onClick={() => setShowBulkEdit(true)}>Bulk Edit</button>
            </div>
          </div>
        )}

        <details style={{marginTop:'12px'}}>
          <summary style={{cursor:'pointer', fontSize:'12px', color:'var(--ash)', fontFamily:'IBM Plex Mono, monospace', letterSpacing:'1px'}}>⚙ COLUMN VISIBILITY</summary>
          <div style={{marginTop:'8px', padding:'12px', background:'var(--charcoal)', borderRadius:'4px', display:'flex', flexWrap:'wrap', gap:'12px'}}>
            {Object.entries({vid:'VID', eid:'EID', calfId:'Calf ID', sex:'Sex', herd:'Herd', owner:'Owner', dob:'DOB', tagColor:'Tag Color', breedingStatus:'Breeding', project:'Project', status:'Status', mouth:'Mouth', udder:'Udder', bcs:'BCS', cull:'Cull'}).map(([key, label]) => (
              <label key={key} style={{display:'flex', alignItems:'center', gap:'6px', cursor:'pointer', fontSize:'13px', color:'var(--cream)'}}>
                <input type="checkbox" checked={visibleColumns[key]} onChange={() => setVisibleColumns(v => ({...v, [key]: !v[key]}))} />
                {label}
              </label>
            ))}
          </div>
        </details>
      </div>

      <div className="table-wrap">
        {loading ? <div className="loading"><div className="spinner"></div> Loading animals...</div>
        : paginatedAnimals.length === 0 ? <div className="empty-state"><h3>No animals found</h3><p>Try adjusting your filters or add your first animal.</p></div>
        : <>
          <table>
            <thead>
              <tr>
                <th style={{width:'40px'}}>
                  <input type="checkbox" checked={paginatedAnimals.every(a => selectedAnimals.has(a.id))} onChange={e => {
                    if (e.target.checked) setSelectedAnimals(new Set([...selectedAnimals, ...paginatedAnimals.map(a => a.id)]));
                    else { const ns = new Set(selectedAnimals); paginatedAnimals.forEach(a => ns.delete(a.id)); setSelectedAnimals(ns); }
                  }} />
                </th>
                {visibleColumns.vid && <SortTh col="vid" label="VID" />}
                {visibleColumns.eid && <SortTh col="eid" label="EID" />}
                {visibleColumns.calfId && <SortTh col="calfId" label="Calf ID" />}
                {visibleColumns.sex && <SortTh col="sex" label="Sex / Class" />}
                {visibleColumns.herd && <SortTh col="herd" label="Herd" />}
                {visibleColumns.owner && <SortTh col="owner" label="Owner" />}
                {visibleColumns.dob && <SortTh col="dob" label="Date of Birth" />}
                {visibleColumns.tagColor && <SortTh col="tagColor" label="Tag Color" />}
                {visibleColumns.breedingStatus && <SortTh col="breedingStatus" label="Breed Status" />}
                {visibleColumns.project && <SortTh col="project" label="Project" />}
                {visibleColumns.mouth && <SortTh col="mouth" label="Mouth" />}
                {visibleColumns.udder && <SortTh col="udder" label="Udder" />}
                {visibleColumns.bcs && <SortTh col="bcs" label="BCS" />}
                {visibleColumns.cull && <SortTh col="cull" label="Cull" />}
                {visibleColumns.status && <SortTh col="status" label="Status" />}
              </tr>
            </thead>
            <tbody>
              {paginatedAnimals.map(a => (
                <tr key={a.id} onClick={e => { if (e.target.type !== 'checkbox') setSelectedAnimal(a); }}>
                  <td onClick={e => e.stopPropagation()}>
                    <input type="checkbox" checked={selectedAnimals.has(a.id)} onChange={() => { const ns = new Set(selectedAnimals); ns.has(a.id) ? ns.delete(a.id) : ns.add(a.id); setSelectedAnimals(ns); }} />
                  </td>
                  {visibleColumns.vid && <td className="td-mono">{a.vid || '—'}</td>}
                  {visibleColumns.eid && <td className="td-mono" style={{fontSize:'11px', color:'var(--ash)'}}>{a.eid || '—'}</td>}
                  {visibleColumns.calfId && <td className="td-mono" style={{color:'var(--sky)'}}>{a.calf_id_code || '—'}</td>}
                  {visibleColumns.sex && <td><span className={`badge badge-${a.sex?.includes('calf') ? 'calf' : a.sex}`}>{sexLabel(a.sex)}</span></td>}
                  {visibleColumns.herd && <td>{a.herds?.name || '—'}</td>}
                  {visibleColumns.owner && <td style={{fontSize:'13px', color:'var(--sage)'}}>{animalOwners[a.id] || '—'}</td>}
                  {visibleColumns.dob && <td style={{color:'var(--ash)', fontSize:'13px'}}>{formatDate(a.date_of_birth)}</td>}
                  {visibleColumns.tagColor && <td>{a.tag_color ? <span style={{display:'inline-flex', alignItems:'center', gap:'6px', fontSize:'12px', color:'var(--cream)', textTransform:'capitalize'}}><span style={{width:'12px', height:'12px', borderRadius:'50%', background: a.tag_color, border: a.tag_color==='white'?'1px solid var(--ash)':'none'}}></span>{a.tag_color}</span> : '—'}</td>}
                  {visibleColumns.breedingStatus && <td>{a.breeding_status ? <span style={{fontSize:'12px', color: a.breeding_status==='open' ? '#e05555' : 'var(--sage)'}}>{a.breeding_status.replace('_', ' ')}</span> : '—'}</td>}
                  {visibleColumns.project && <td style={{fontSize:'12px', color: a.project ? 'var(--hay)' : 'var(--ash)'}}>{a.project || '—'}</td>}
                  {visibleColumns.mouth && <td style={{fontSize:'12px', textTransform:'capitalize', color: a.mouth==='broken' ? 'var(--hay)' : undefined}}>{a.mouth || '—'}</td>}
                  {visibleColumns.udder && <td className="td-mono" style={{color: ['D','F'].includes(a.udder_score) ? '#e05555' : undefined}}>{a.udder_score || '—'}</td>}
                  {visibleColumns.bcs && <td className="td-mono">{bcsLabel(a.condition_score)}</td>}
                  {visibleColumns.cull && <td style={{fontSize:'12px', color: a.is_cull ? '#e05555' : 'var(--ash)'}}>{a.is_cull ? 'CULL' : '—'}</td>}
                  {visibleColumns.status && <td><span className={`status-dot status-${a.status}`}></span>{a.status}</td>}
                </tr>
              ))}
            </tbody>
          </table>
          <div className="pagination">
            <span className="pagination-info">Page {page + 1} · Showing {paginatedAnimals.length} of {filteredAnimals.length} animals</span>
            <div className="pagination-btns">
              <button className="page-btn" onClick={() => setPage(p => p - 1)} disabled={page === 0}>← Prev</button>
              <button className="page-btn active">{page + 1}</button>
              <button className="page-btn" onClick={() => setPage(p => p + 1)} disabled={(page + 1) * PAGE_SIZE >= filteredAnimals.length}>Next →</button>
            </div>
          </div>
        </>}
      </div>

      {showProjects && <ProjectsModal projects={projects} projectsReady={projectsReady} animals={allAnimals} toast={toast}
        onChanged={(renamed) => { fetchProjects(); if (renamed) { fetchAnimals(); setProjectFilter([]); } }}
        onView={(name) => { setProjectFilter([name]); setStatusFilter([]); setShowAdvanced(true); setPage(0); setShowProjects(false); }}
        onClose={() => setShowProjects(false)} />}
      {showAdd && <AddAnimalModal herds={herds} partnerships={partnerships} projects={projects} onClose={() => setShowAdd(false)} onSaved={() => { setShowAdd(false); fetchAnimals(); toast('Animal added successfully!', 'success'); }} toast={toast} />}
      {selectedAnimal && <AnimalDetailModal animal={selectedAnimal} herds={herds} partnerships={partnerships} projects={projects} animalOwners={animalOwners} onClose={() => setSelectedAnimal(null)} onSaved={() => { setSelectedAnimal(null); fetchAnimals(); toast('Animal updated!', 'success'); }} toast={toast} />}
      {showBulkEdit && <BulkEditModal selectedIds={Array.from(selectedAnimals)} herds={herds} partnerships={partnerships} projects={projects} onClose={() => setShowBulkEdit(false)} onSaved={(msg) => { setShowBulkEdit(false); setSelectedAnimals(new Set()); fetchAnimals(); toast(msg || 'Bulk edit complete!', 'success'); }} toast={toast} />}
    </div>
  );
}

// ===== BULK EDIT MODAL =====
// Plain per-animal fields: one value written to every selected head. Same field list as the CSV import
// (Owner, Status, Notes and Vaccination have their own handling below). Options are written out here rather
// than reusing SEX_VALUES / BREEDING_VALUES, which are declared further down the file.
// ===== COW SCORES (mouth, udder, condition) + Cull/Alert =====
// Tru-Test's Alert flag maps to the existing is_cull checkbox — one flag, not two.
// Current value lives on animals; a preg-check import also copies mouth/udder/BCS onto that preg_checks row as dated history.
// Columns are added by COW_SCORES_SQL — until it's run, edits only send these fields when they actually change, so nothing else breaks.
const MOUTH_OPTIONS = [['solid','Solid'],['broken','Broken']];
const UDDER_OPTIONS = ['A','B','C','D','F'].map(v => [v, v]);
const BCS_OPTIONS = ['1','1.5','2','2.5','3','3.5','4','4.5','5','5.5','6'].map(v => [v, v]);
const COW_SCORE_COLS = 'mouth, udder_score, condition_score';
const parseMouth = (raw) => {
  const v = String(raw ?? '').trim().toLowerCase().replace(/[\s_\-.]+/g, ' ');
  if (!v) return '';
  if (['s','sm','solid','solid mouth','sound','sound mouth','full','full mouth'].includes(v)) return 'solid';
  if (['b','bm','br','broke','broken','broken mouth','brk'].includes(v)) return 'broken';
  return null; // unrecognized
};
const parseAlert = (raw) => {
  const v = String(raw ?? '').trim().toLowerCase();
  if (!v) return '';
  if (['y','yes','true','t','1','x','alert','on'].includes(v)) return true;
  if (['n','no','false','f','0','off','-'].includes(v)) return false;
  return null;
};
const parseUdder = (raw) => {
  const v = String(raw ?? '').trim().toUpperCase();
  if (!v) return '';
  return ['A','B','C','D','F'].includes(v) ? v : null;
};
const parseBCS = (raw) => {
  const v = String(raw ?? '').trim();
  if (!v) return '';
  if (!/^\d+(\.\d+)?$/.test(v)) return null;
  const n = Math.round(Number(v) * 2) / 2; // half-score steps
  return n >= 1 && n <= 6 ? n : null;
};
const cullLabel = (v) => v ? 'CULL' : 'No';
const bcsLabel = (v) => v == null || v === '' ? '—' : String(Number(v));
const COW_SCORES_SQL = `-- Run once in Supabase → SQL Editor. Adds mouth, udder and condition score. (Tru-Test Alert uses the existing is_cull.)
alter table public.animals
  add column if not exists mouth text check (mouth in ('solid','broken')),
  add column if not exists udder_score text check (udder_score in ('A','B','C','D','F')),
  add column if not exists condition_score numeric(2,1) check (condition_score between 1 and 6);
-- Dated history on preg checks (skipped if preg_checks hasn't been created yet)
do $$ begin
  if to_regclass('public.preg_checks') is not null then
    alter table public.preg_checks
      add column if not exists mouth text check (mouth in ('solid','broken')),
      add column if not exists udder_score text check (udder_score in ('A','B','C','D','F')),
      add column if not exists condition_score numeric(2,1) check (condition_score between 1 and 6);
  end if;
end $$;
-- If an earlier version added a separate alert column: fold it into is_cull, then drop it
do $$ begin
  if exists (select 1 from information_schema.columns where table_schema = 'public' and table_name = 'animals' and column_name = 'alert') then
    update public.animals set is_cull = true where alert = true and coalesce(is_cull, false) = false;
    alter table public.animals drop column alert;
  end if;
end $$;`;

const BULK_TAG_COLORS = ['yellow','red','blue','green','orange','white','black','pink','purple'];
const BULK_FIELDS = {
  vid:               { label: 'VID', input: 'text', clearable: true, uniqueTag: true, placeholder: 'e.g. H607' },
  eid:               { label: 'EID', input: 'text', clearable: true, uniqueTag: true, placeholder: 'e.g. 982000123456789' },
  tag_color:         { label: 'Tag Color', input: 'text', clearable: true, lower: true, list: BULK_TAG_COLORS, placeholder: 'e.g. yellow' },
  sex:               { label: 'Sex/Class', input: 'select', options: [['cow','Cow'],['heifer','Heifer'],['bull','Bull'],['steer','Steer'],['calf_male','Bull Calf'],['calf_female','Heifer Calf'],['horse','Horse']] },
  breed:             { label: 'Breed', input: 'text', clearable: true, placeholder: 'e.g. Angus, Sim-Angus' },
  date_of_birth:     { label: 'Date of Birth', input: 'date', clearable: true },
  breeding_status:   { label: 'Breeding Status', input: 'select', clearable: true, options: [['open','Open'],['bred_spring','Bred Spring'],['bred_fall','Bred Fall'],['dry','Dry'],['nursing','Nursing'],['unknown','Unknown']] },
  herd_id:           { label: 'Herd', input: 'herd', clearable: true },
  purchased:         { label: 'Purchased', input: 'select', options: [['true','Yes — purchased'],['false','No — raised']] },
  purchase_date:     { label: 'Purchase Date', input: 'date', clearable: true },
  purchase_location: { label: 'Purchase Location', input: 'text', clearable: true, placeholder: 'e.g. Herreid Livestock' },
  purchase_price_per_head: { label: 'Purchase Price ($/hd)', input: 'number', clearable: true, placeholder: 'e.g. 1250' },
  project:           { label: 'Project', input: 'project', clearable: true },
  mouth:             { label: 'Mouth', input: 'select', clearable: true, options: MOUTH_OPTIONS },
  is_cull:           { label: 'Cull (Alert)', input: 'select', options: [['true','Yes — cull'],['false','No']], bool: true },
  udder_score:       { label: 'Udder Score', input: 'select', clearable: true, options: UDDER_OPTIONS },
  condition_score:   { label: 'Condition Score', input: 'select', clearable: true, options: BCS_OPTIONS, num: true },
};

function BulkEditModal({ selectedIds, herds, partnerships, projects = [], onClose, onSaved, toast }) {
  const [action, setAction] = useState('herd_id');
  const [fieldValue, setFieldValue] = useState('');
  const [clearField, setClearField] = useState(false);
  const [ownerId, setOwnerId] = useState('');
  const [status, setStatus] = useState('');
  const [statusDate, setStatusDate] = useState(todayLocal());
  const [saleLocation, setSaleLocation] = useState('');
  const [deathCause, setDeathCause] = useState('');
  const [notes, setNotes] = useState('');
  const [notesMode, setNotesMode] = useState('append');
  const [vaccineProduct, setVaccineProduct] = useState('');
  const [vaccineLot, setVaccineLot] = useState('');
  const [vaccineDosage, setVaccineDosage] = useState('');
  const [vaccineDate, setVaccineDate] = useState(todayLocal());
  const [projectDate, setProjectDate] = useState(todayLocal());
  const [projectUseArrival, setProjectUseArrival] = useState(true);
  const [saving, setSaving] = useState(false);

  const field = BULK_FIELDS[action];
  // A tag number belongs to one animal — with several selected, the only sensible bulk change is to clear it
  const tagLocked = !!(field?.uniqueTag && selectedIds.length > 1);
  const changeAction = (a) => { setAction(a); setFieldValue(''); setClearField(!!(BULK_FIELDS[a]?.uniqueTag && selectedIds.length > 1)); };

  // Chunked so big selections don't overrun the URL limit; counts rows because updates blocked by RLS fail silently
  const updateAnimals = async (patch) => {
    const { data, error } = await chunkedIn(selectedIds, (chunk) => supabase.from('animals').update({ ...patch, updated_at: new Date().toISOString() }).in('id', chunk).select('id'));
    if (error) throw error;
    const n = (data || []).length;
    if (n < selectedIds.length) throw new Error(`only ${n} of ${selectedIds.length} animals changed — check row-level security on animals`);
  };

  // Calf codes carry the birth-year letter (P/607 = 2026). When DOB changes, swap the letter on any existing code.
  const syncCalfCodes = async (dob) => {
    const letter = getYearLetter(parseInt(dob.slice(0, 4), 10));
    const { data, error } = await chunkedIn(selectedIds, (chunk) => supabase.from('animals').select('id, calf_id_code').in('id', chunk).not('calf_id_code', 'is', null));
    if (error) throw error;
    let changed = 0;
    for (const a of data || []) {
      const m = /^([A-Z?])\/(.+)$/.exec(a.calf_id_code || '');
      if (!m || m[1] === letter) continue;
      const { error: e } = await supabase.from('animals').update({ calf_id_code: `${letter}/${m[2]}` }).eq('id', a.id);
      if (e) throw e;
      changed++;
    }
    return changed;
  };

  // ── Status changes keep sale and death records in step with the animal, so Inventory Change agrees ──
  //   Sold     → every selected head ends up on a sale record dated statusDate. A sale made up only of selected
  //              head is re-dated; head on a sale shared with unselected head move to a new record; head with no
  //              sale go on that new record. Any death record is removed (an animal can't be sold and dead).
  //   Dead     → every selected head has a death record dated statusDate (existing ones re-dated); sale links removed.
  //   Active   → sale links and death records removed — the undo for a mistaken sale or death.
  //   Archived → records untouched.
  // Sale records themselves are never deleted — an emptied one counts nothing in Inventory Change.
  // Every step is worked out from current data, so re-running the same Bulk Edit after an error finishes the job.
  // Returns a summary for the toast, or null if the user backs out at the confirm.
  const applyStatusChange = async () => {
    const ids = selectedIds, when = statusDate, sel = new Set(ids);
    const loc = saleLocation.trim(), cause = deathCause.trim();
    const day = (d) => (d ? String(d).split('T')[0] : '');
    const hd = (n) => `${n} head`;
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
    const read = async (table, cols, col, list) => {
      if (!list.length) return [];
      const { data, error } = await chunkedIn(list, (chunk) => supabase.from(table).select(cols).in(col, chunk).limit(10000));
      if (error) throw new Error(`Couldn't read ${table} (${error.message}). Nothing was changed.`);
      return data || [];
    };
    const done = [];
    const fail = (step, msg) => {
      const e = new Error(`${step} failed: ${msg}. ${done.length ? `Already saved: ${done.join('; ')}.` : 'Nothing was saved.'} Run the same Bulk Edit again to finish.`);
      e.partial = done.length > 0;
      throw e;
    };
    // Updates and deletes blocked by row-level security fail silently (0 rows), so each one returns its rows and is counted
    const write = async (step, list, build, expected) => {
      const { data, error } = await chunkedIn(list, build);
      if (error) fail(step, error.message);
      const n = (data || []).length;
      if (n < expected) fail(step, `only ${n} of ${expected} rows changed — check this table's row-level security policies`);
    };

    const [links, deaths] = await Promise.all([
      read('sale_animals', 'sale_record_id, animal_id', 'animal_id', ids),
      read('death_records', 'id, animal_id, death_date, cause_of_death', 'animal_id', ids),
    ]);
    const linkedIds = [...new Set(links.map(l => l.animal_id))];
    const warn = [];   // what the confirm spells out before anything existing is changed
    let plan = {};

    if (status === 'sold') {
      const recIds = [...new Set(links.map(l => l.sale_record_id))];
      const [recLinks, recs] = await Promise.all([
        read('sale_animals', 'sale_record_id, animal_id', 'sale_record_id', recIds),
        read('sale_records', 'id, sale_date, sale_location', 'id', recIds),
      ]);
      const covered = new Set(recIds.filter(r => recLinks.filter(l => l.sale_record_id === r).every(l => sel.has(l.animal_id))));
      const moving = links.filter(l => !covered.has(l.sale_record_id));
      const unlinked = ids.filter(id => !linkedIds.includes(id));
      const redate = recs.filter(r => covered.has(r.id) && (day(r.sale_date) !== when || (loc && r.sale_location !== loc)));
      if (redate.length) warn.push(`• ${redate.length === 1 ? 'The sale these head are on' : `${redate.length} sales these head are on`} will change to ${formatDate(when)}${loc ? `, ${loc}` : ''}.`);
      if (moving.length) warn.push(`• ${hd(moving.length)} will move off a sale they share with other head, onto a new sale dated ${formatDate(when)}.`);
      if (deaths.length) warn.push(`• ${plural(deaths.length, 'death record')} will be deleted — an animal can't be sold and dead.`);
      plan = { redate, moving, unlinked };
    } else if (status === 'dead') {
      const has = new Set(deaths.map(d => d.animal_id));
      const need = ids.filter(id => !has.has(id));
      const redate = deaths.filter(d => day(d.death_date) !== when || (cause && d.cause_of_death !== cause));
      if (redate.length) warn.push(`• ${plural(redate.length, 'existing death record')} will change to ${formatDate(when)}${cause ? `, cause "${cause}"` : ''}.`);
      if (linkedIds.length) warn.push(`• ${hd(linkedIds.length)} will come off their sale record — an animal can't be dead and sold.`);
      plan = { need, redate };
    } else if (status === 'active') {
      if (linkedIds.length) warn.push(`• ${hd(linkedIds.length)} will come off their sale record.`);
      if (deaths.length) warn.push(`• ${plural(deaths.length, 'death record')} will be deleted.`);
    }
    if (warn.length && !window.confirm(`Mark ${hd(ids.length)} ${status}, ${formatDate(when)}?\n\n${warn.join('\n')}`)) return null;

    if (status === 'sold') {
      const { redate, moving, unlinked } = plan;
      for (const r of redate) {
        await write('Re-dating a sale', [r.id], (chunk) => supabase.from('sale_records').update(loc ? { sale_date: when, sale_location: loc } : { sale_date: when }).in('id', chunk).select('id'), 1);
      }
      if (redate.length) done.push(plural(redate.length, 'sale') + ' re-dated');
      const newHead = unlinked.length + moving.length;
      if (newHead) {
        const { data: rec, error } = await supabase.from('sale_records').insert({ sale_date: when, sale_location: loc || 'Unknown Location', sale_type: 'auction', notes: `Bulk Edit: ${hd(newHead)}` }).select().single();
        if (error) fail('Creating the sale record', error.message);
        done.push('new sale record created');
        if (unlinked.length) {
          const { error: linkErr } = await supabase.from('sale_animals').insert(unlinked.map(id => ({ sale_record_id: rec.id, animal_id: id })));
          if (linkErr) fail('Adding head to the sale', linkErr.message);
          done.push(`${hd(unlinked.length)} added to it`);
        }
        for (const from of [...new Set(moving.map(l => l.sale_record_id))]) {
          const movers = moving.filter(l => l.sale_record_id === from).map(l => l.animal_id);
          await write('Moving head off a shared sale', movers, (chunk) => supabase.from('sale_animals').update({ sale_record_id: rec.id }).eq('sale_record_id', from).in('animal_id', chunk).select('animal_id'), movers.length);
        }
        if (moving.length) done.push(`${hd(moving.length)} moved to it`);
      }
      if (deaths.length) {
        await write('Removing death records', deaths.map(d => d.id), (chunk) => supabase.from('death_records').delete().in('id', chunk).select('id'), deaths.length);
        done.push(plural(deaths.length, 'death record') + ' removed');
      }
    } else if (status === 'dead') {
      const { need, redate } = plan;
      if (redate.length) {
        await write('Re-dating death records', redate.map(d => d.id), (chunk) => supabase.from('death_records').update(cause ? { death_date: when, cause_of_death: cause } : { death_date: when }).in('id', chunk).select('id'), redate.length);
        done.push(plural(redate.length, 'death record') + ' re-dated');
      }
      if (need.length) {
        const { error } = await supabase.from('death_records').insert(need.map(id => ({ animal_id: id, death_date: when, cause_of_death: cause || 'Unknown', notes: 'Bulk Edit' })));
        if (error) fail('Adding death records', error.message);
        done.push(plural(need.length, 'death record') + ' added');
      }
      if (linkedIds.length) {
        await write('Taking head off sale records', linkedIds, (chunk) => supabase.from('sale_animals').delete().in('animal_id', chunk).select('animal_id'), links.length);
        done.push(`${hd(linkedIds.length)} taken off sales`);
      }
    } else if (status === 'active') {
      if (linkedIds.length) {
        await write('Taking head off sale records', linkedIds, (chunk) => supabase.from('sale_animals').delete().in('animal_id', chunk).select('animal_id'), links.length);
        done.push(`${hd(linkedIds.length)} taken off sales`);
      }
      if (deaths.length) {
        await write('Removing death records', deaths.map(d => d.id), (chunk) => supabase.from('death_records').delete().in('id', chunk).select('id'), deaths.length);
        done.push(plural(deaths.length, 'death record') + ' removed');
      }
    }
    await write('Updating animal status', ids, (chunk) => supabase.from('animals').update({ status, status_date: when, is_active: status === 'active', updated_at: new Date().toISOString() }).in('id', chunk).select('id'), ids.length);
    return `${hd(ids.length)} marked ${status}, ${formatDate(when)}${done.length ? ` — ${done.join(', ')}` : ''}.`;
  };

  // Project changes are dated (project_date) so the database trigger logs them in project_history as transfers.
  // Head being tagged for the first time can take their own arrival date — tagging a load days after it came in
  // shouldn't make its first days look like they belonged to no project.
  const applyProjectChange = async (value, shown) => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(projectDate || '')) throw new Error('Pick an effective date');
    if (projectDate > todayLocal()) throw new Error("Effective date can't be in the future");
    const { data, error } = await chunkedIn(selectedIds, (chunk) => supabase.from('animals').select('id, project, purchased, purchase_date, date_of_birth, created_at').in('id', chunk));
    if (error) throw error;
    const byDate = {};
    let same = 0, atArrival = 0;
    for (const a of data || []) {
      if ((a.project || null) === value) { same++; continue; }
      const firstTag = !a.project && value;
      const d = firstTag && projectUseArrival ? hcArrival(a).date : projectDate;
      if (firstTag && projectUseArrival) atArrival++;
      (byDate[d] = byDate[d] || []).push(a.id);
    }
    let changed = 0;
    for (const [d, ids] of Object.entries(byDate)) {
      const { data: got, error: e } = await chunkedIn(ids, (chunk) => supabase.from('animals').update({ project: value, project_date: d > todayLocal() ? todayLocal() : d, updated_at: new Date().toISOString() }).in('id', chunk).select('id'));
      if (e) throw new Error(`${e.message}${changed ? ` (${changed} head already changed)` : ''}`);
      changed += (got || []).length;
    }
    const parts = [`${changed} head ${value === null ? 'taken off their project' : `moved to ${shown}`}`];
    if (atArrival) parts.push(`${atArrival} first-time tags dated at arrival`);
    if (changed - atArrival > 0) parts.push(`${changed - atArrival} effective ${formatDate(projectDate)}`);
    if (same) parts.push(`${same} already there`);
    return parts.join(' · ') + '.';
  };

  // Validates and writes one BULK_FIELDS field. Returns the toast message, or null if the user backs out.
  const applyFieldChange = async () => {
    const f = field, n = selectedIds.length;
    let value = null, shown = '';
    if (!clearField) {
      const raw = String(fieldValue ?? '').trim();
      if (!raw) throw new Error(`Enter a ${f.label}${f.clearable ? ', or tick Clear' : ''}`);
      if (f.input === 'date') {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) throw new Error(`Enter a valid ${f.label}`);
        if (raw > todayLocal()) throw new Error(`${f.label} can't be in the future`);
        value = raw; shown = formatDate(raw);
      } else if (f.input === 'number') {
        const num = parseFloat(raw.replace(/[$,]/g, ''));
        if (!isFinite(num) || num < 0) throw new Error(`${f.label} must be a number`);
        value = num; shown = `$${num.toLocaleString()}`;
      } else if (action === 'purchased') {
        value = raw === 'true'; shown = value ? 'Yes' : 'No';
      } else if (f.input === 'select') {
        value = f.bool ? raw === 'true' : f.num ? Number(raw) : raw; shown = (f.options.find(o => o[0] === raw) || [raw, raw])[1];
      } else if (f.input === 'herd') {
        value = raw; shown = herds.find(h => h.id === raw)?.name || 'herd';
      } else if (f.input === 'project') {
        value = raw; shown = raw;
      } else {
        value = f.lower ? raw.toLowerCase() : raw; shown = value;
      }
    }

    if (f.uniqueTag) {
      if (value !== null && n > 1) throw new Error(`Each animal needs its own ${f.label} — select one animal to set it`);
      if (value !== null) {
        // Field entries match on tag, so a second ACTIVE animal with this tag would send sales/deaths to the wrong head
        const { data: dup, error } = await supabase.from('animals').select('id').eq(action, value).eq('status', 'active').neq('id', selectedIds[0]).limit(1);
        if (error) throw error;
        if (dup?.length && !window.confirm(`⚠️ An ACTIVE animal already has ${f.label} ${value}. Duplicate active tags can cause field entries (sales, deaths, treatments) to hit the wrong animal.\n\nSet it anyway?`)) return null;
      } else if (!window.confirm(`Clear the ${f.label} on ${n} head? Field entries find animals by tag, so these head won't match by ${f.label} until retagged.`)) return null;
    } else if (value === null && !window.confirm(`Clear ${f.label} on ${n} head?`)) return null;

    if (action === 'project') return await applyProjectChange(value, shown);
    await updateAnimals({ [action]: value });
    let extra = '';
    if (action === 'date_of_birth' && value) {
      const codes = await syncCalfCodes(value);
      if (codes) extra = ` — ${codes} calf code${codes === 1 ? '' : 's'} updated to the new birth year`;
    }
    return `${f.label} ${value === null ? 'cleared' : `set to ${shown}`} on ${n} head${extra}.`;
  };

  const handleSave = async () => {
    if (!selectedIds || selectedIds.length === 0) { toast('No animals selected', 'error'); return; }
    if (action === 'owner' && !ownerId) { toast('Please select an owner', 'error'); return; }
    if (action === 'status' && !status) { toast('Please select a status', 'error'); return; }
    if (action === 'status' && checkEventDate(statusDate)) { toast(checkEventDate(statusDate), 'error'); return; }
    if (action === 'notes' && !notes.trim()) { toast('Please enter notes to add', 'error'); return; }
    if (action === 'vaccination' && !vaccineProduct.trim()) { toast('Please enter product name', 'error'); return; }
    setSaving(true);
    let resultMsg;
    try {
      if (field) {
        resultMsg = await applyFieldChange();
        if (resultMsg === null) { setSaving(false); return; }   // backed out at the confirm — nothing written
      } else if (action === 'owner') {
        const today = todayLocal();
        const ownershipRecords = selectedIds.map(animalId => ({ animal_id: animalId, partnership_id: ownerId, effective_date: today }));
        const { error } = await supabase.from('animal_ownership_history').insert(ownershipRecords);
        if (error) throw error;
      } else if (action === 'status') {
        resultMsg = await applyStatusChange();
        if (resultMsg === null) { setSaving(false); return; }
      } else if (action === 'notes') {
        const { data: animals, error: readErr } = await chunkedIn(selectedIds, (chunk) => supabase.from('animals').select('id, notes').in('id', chunk));
        if (readErr) throw readErr;
        for (const animal of animals) {
          let newNotes = '';
          if (notesMode === 'append') newNotes = animal.notes ? `${animal.notes}\n\n${notes}` : notes;
          else if (notesMode === 'prepend') newNotes = animal.notes ? `${notes}\n\n${animal.notes}` : notes;
          else newNotes = notes;
          const { error } = await supabase.from('animals').update({ notes: newNotes, updated_at: new Date().toISOString() }).eq('id', animal.id);
          if (error) throw error;
        }
      } else if (action === 'vaccination') {
        const treatmentRecords = selectedIds.map(animalId => ({ animal_id: animalId, treatment_date: vaccineDate, treatment_type: 'vaccination', product_name: vaccineProduct, lot_number: vaccineLot || null, dosage: vaccineDosage || null, reason: 'Bulk vaccination', administered_by: 'Bulk edit' }));
        const { error } = await supabase.from('treatments').insert(treatmentRecords);
        if (error) throw error;
      }
      onSaved(resultMsg);
    } catch (error) {
      // A half-finished status change must not be missed — an alert stays up until read; plain errors get a toast
      if (error.partial) window.alert(error.message); else toast('Error: ' + error.message, 'error');
    }
    setSaving(false);
  };

  const renderFieldInput = () => {
    const f = field, common = { className: 'form-input', value: fieldValue, disabled: clearField, onChange: e => setFieldValue(e.target.value) };
    if (f.input === 'select') return <select {...common} className="form-select"><option value="">Select {f.label.toLowerCase()}...</option>{f.options.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>;
    if (f.input === 'herd') return <select {...common} className="form-select"><option value="">Select a herd...</option>{herds.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}</select>;
    if (f.input === 'project') return <select {...common} className="form-select"><option value="">Select a project...</option>{projects.filter(p => p.is_active).map(p => <option key={p.id} value={p.name}>{p.name}</option>)}</select>;
    if (f.input === 'date') return <input {...common} type="date" max={todayLocal()} />;
    if (f.input === 'number') return <input {...common} type="number" min="0" step="0.01" inputMode="decimal" placeholder={f.placeholder} />;
    return <>
      <input {...common} placeholder={f.placeholder} list={f.list ? `bulk-list-${action}` : undefined} />
      {f.list && <datalist id={`bulk-list-${action}`}>{f.list.map(v => <option key={v} value={v} />)}</datalist>}
    </>;
  };

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header"><h2 className="modal-title">Bulk Edit</h2><button className="modal-close" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <p style={{color:'var(--ash)', fontSize:'13px', marginBottom:'20px'}}>Update {selectedIds.length} selected animals</p>
          <div className="form-group">
            <label className="form-label">Field / Action</label>
            <select className="form-select" value={action} onChange={e => changeAction(e.target.value)}>
              <optgroup label="Identification">
                <option value="vid">VID</option>
                <option value="eid">EID</option>
                <option value="tag_color">Tag Color</option>
              </optgroup>
              <optgroup label="Animal">
                <option value="sex">Sex/Class</option>
                <option value="breed">Breed</option>
                <option value="date_of_birth">Date of Birth</option>
                <option value="breeding_status">Breeding Status</option>
              </optgroup>
              <optgroup label="Cow Scores">
                <option value="mouth">Mouth (Solid / Broken)</option>
                <option value="is_cull">Cull / Alert (Yes / No)</option>
                <option value="udder_score">Udder Score (A–F)</option>
                <option value="condition_score">Condition Score (1–6)</option>
              </optgroup>
              <optgroup label="Herd & Ownership">
                <option value="herd_id">Move to Herd</option>
                <option value="owner">Assign Owner</option>
              </optgroup>
              <optgroup label="Purchase">
                <option value="purchased">Purchased (Yes/No)</option>
                <option value="purchase_date">Purchase Date</option>
                <option value="purchase_location">Purchase Location</option>
                <option value="purchase_price_per_head">Purchase Price</option>
                <option value="project">Project (Ambrook)</option>
              </optgroup>
              <optgroup label="Status & Records">
                <option value="status">Change Status (Sold / Dead / Active / Archived)</option>
                <option value="notes">Notes</option>
                <option value="vaccination">Add Vaccination</option>
              </optgroup>
            </select>
          </div>
          {field && <>
            {tagLocked
              ? <p style={{fontSize:'13px', color:'var(--ash)', lineHeight:1.5, margin:'0 0 12px'}}>Each animal carries its own {field.label}, so with {selectedIds.length} selected the only bulk change is clearing it. To set a {field.label}, select one animal.</p>
              : <div className="form-group"><label className="form-label">New {field.label}</label>{renderFieldInput()}</div>}
            {field.clearable && <label style={{display:'flex', alignItems:'center', gap:'8px', fontSize:'13px', color:'var(--ash)', cursor: tagLocked ? 'default' : 'pointer'}}>
              <input type="checkbox" checked={clearField} disabled={tagLocked} onChange={e => setClearField(e.target.checked)} />
              Clear {field.label} (leave it blank) on all selected
            </label>}
            {action === 'date_of_birth' && <p style={{fontSize:'12px', color:'var(--ash)', marginTop:'10px'}}>Calf ID codes on these head are re-lettered to match the new birth year.</p>}
            {action === 'project' && <div className="form-grid" style={{marginTop:'12px'}}>
              <div className="form-group"><label className="form-label">Effective Date</label><input type="date" className="form-input" max={todayLocal()} value={projectDate} onChange={e => setProjectDate(e.target.value)} /></div>
              <label className="form-group full" style={{flexDirection:'row', alignItems:'center', gap:'8px', fontSize:'13px', color:'var(--ash)', cursor:'pointer'}}>
                <input type="checkbox" checked={projectUseArrival} onChange={e => setProjectUseArrival(e.target.checked)} />
                Head with no project yet: date them from their purchase / birth date instead
              </label>
            </div>}
            {action === 'project' && <p style={{fontSize:'12px', color:'var(--ash)', marginTop:'10px'}}>{projects.length ? 'The project stays with these head through herd moves. Add or rename projects from Animals → Projects.' : 'No projects yet — set them up from Animals → Projects.'}</p>}
          </>}
          {action === 'owner' && <div className="form-group"><label className="form-label">Assign to Owner</label><select className="form-select" value={ownerId} onChange={e => setOwnerId(e.target.value)}><option value="">Select owner...</option>{partnerships.filter(p => p.is_active !== false).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></div>}
          {action === 'status' && <div className="form-grid" style={{marginTop:'16px'}}>
            <div className="form-group"><label className="form-label">New Status</label><select className="form-select" value={status} onChange={e => setStatus(e.target.value)}><option value="">Select status...</option><option value="active">Active</option><option value="sold">Sold</option><option value="dead">Dead</option><option value="archived">Archived</option></select></div>
            <div className="form-group"><label className="form-label" htmlFor="bulk-status-date">{STATUS_DATE_LABEL[status] || 'Date It Happened'}</label><input id="bulk-status-date" type="date" className="form-input" value={statusDate} max={todayLocal()} onChange={e => setStatusDate(e.target.value)} /></div>
            {status === 'sold' && <div className="form-group full"><label className="form-label" htmlFor="bulk-sale-location">Sold At / To</label><input id="bulk-sale-location" className="form-input" value={saleLocation} onChange={e => setSaleLocation(e.target.value)} placeholder="e.g. Herreid Livestock, or the buyer (optional)" /></div>}
            {status === 'dead' && <div className="form-group full"><label className="form-label" htmlFor="bulk-death-cause">Cause of Death</label><input id="bulk-death-cause" className="form-input" value={deathCause} onChange={e => setDeathCause(e.target.value)} placeholder="e.g. bloat, pneumonia (optional)" /></div>}
            {status && <p className="form-group full" style={{fontSize:'13px', color:'var(--ash)', lineHeight:1.5, margin:0}}>{{
              sold: 'Puts these head on a sale record with this date, so the sale shows in Inventory Change. Head already on a sale get that sale re-dated.',
              dead: 'Gives each head a death record with this date, so it shows in Inventory Change. Existing death records get re-dated.',
              active: 'Puts them back on inventory and takes them off any sale or death record — the way to undo a mistaken sale or death.',
              archived: 'Takes them off inventory without a sale or death record.',
            }[status]}</p>}
          </div>}
          {action === 'notes' && <>
            <div className="form-group"><label className="form-label">Notes Mode</label><select className="form-select" value={notesMode} onChange={e => setNotesMode(e.target.value)}><option value="append">Append to existing notes</option><option value="prepend">Prepend to existing notes</option><option value="replace">Replace all notes</option></select></div>
            <div className="form-group"><label className="form-label">Notes to Add</label><textarea className="form-textarea" value={notes} onChange={e => setNotes(e.target.value)} placeholder="Enter notes here..." rows={4} /></div>
          </>}
          {action === 'vaccination' && <>
            <div className="form-group"><label className="form-label">Product Name *</label><input className="form-input" value={vaccineProduct} onChange={e => setVaccineProduct(e.target.value)} placeholder="e.g. Vision 7, Bovi-Shield" /></div>
            <div className="form-grid">
              <div className="form-group"><label className="form-label">Lot Number</label><input className="form-input" value={vaccineLot} onChange={e => setVaccineLot(e.target.value)} placeholder="Optional" /></div>
              <div className="form-group"><label className="form-label">Dosage</label><input className="form-input" value={vaccineDosage} onChange={e => setVaccineDosage(e.target.value)} placeholder="e.g. 2ml" /></div>
            </div>
            <div className="form-group"><label className="form-label">Vaccination Date</label><input type="date" className="form-input" value={vaccineDate} onChange={e => setVaccineDate(e.target.value)} /></div>
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving ? 'Updating...' : `Update ${selectedIds.length} Animals`}</button>
        </div>
      </div>
    </div>
  );
}

// ===== ADD ANIMAL MODAL =====
function AddAnimalModal({ herds, projects = [], onClose, onSaved, toast }) {
  const [form, setForm] = useState({
    vid:'', eid:'', sex:'cow', herd_id:'', date_of_birth:'', breed:'',
    purchased:false, purchase_date:'', purchase_location:'',
